   <p class="small" style="margin-top:var(--space-3)"><b>Publicising the FRM:</b> ${esc(d.publicise)}</p><p class="small"><b>Data protection:</b> ${esc(d.dataProtection)}</p></div></details>`}
function vFrm(){
  const qs=[...new Set(S.frm.filter(f=>f.date).map(f=>quarter(parse(f.date))))];const cq=quarter(today());if(!qs.includes(cq))qs.push(cq);qs.sort();
  const sel=S.f.fq||cq;const L=S.frm.filter(f=>f.date&&quarter(parse(f.date))===sel);
  const c=fn=>L.filter(fn).length;const closed=c(f=>f.status==='Closed');const sl=L.map(f=>[f,frmSla(f)]);
  const ackD=sl.filter(([f,x])=>x.ackOk!==null);const ackOk=ackD.filter(([f,x])=>x.ackOk).length;const doneD=sl.filter(([f,x])=>x.ok!==null);const doneOk=doneD.filter(([f,x])=>x.ok).length;
  const p1=sl.filter(([f,x])=>x.p==='P1');const p1ok=p1.filter(([f,x])=>x.ok).length;const fb=c(f=>f.feedbackGiven==='Yes');const od=sl.filter(([f,x])=>x.overdue).length;
  const pc=(a,b)=>b?Math.round(a/b*100)+'%':'–';const tone=(a,b,t)=>!b?'none':a/b>=t?'good':a/b>=0.7?'warn':'bad';
  let h=vFrmDesign()+`<div class="toolbar"><select aria-label="Quarter" onchange="S.f.fq=this.value;render()">${qs.map(q=>`<option ${q===sel?'selected':''}>${q}</option>`).join('')}</select><span class="grow small muted">Anonymised – never record names of children or sensitive case details. P1 (safeguarding, PSEA, fraud) referred within 24 hours.</span>${S.canEdit?`<button class="btn primary" onclick="editFrm()">${ic('plus')} Log feedback</button>`:''}</div>
  <div class="grid g-kpi" style="margin-bottom:var(--space-5)"><div class="card kpi none"><div class="l"><span class="dot"></span>Received</div><div class="v">${L.length}</div><div class="s">${c(f=>/Child|Adolescent/.test(f.respondent||''))} children/adolescents · ${closed} closed${od?` · <b>${od} overdue</b>`:''}</div></div>
  <div class="card kpi ${tone(ackOk,ackD.length,1)}"><div class="l"><span class="dot"></span>Acknowledged on time</div><div class="v">${pc(ackOk,ackD.length)}</div><div class="s">P2 ≤3 days · P1 ≤24 h · target 100%</div></div>
  <div class="card kpi ${tone(doneOk,doneD.length,0.9)}"><div class="l"><span class="dot"></span>Closed within timeline</div><div class="v">${pc(doneOk,doneD.length)}</div><div class="s">P2 ≤14 days · P3 ≤7 days · target ≥90%</div></div>
  <div class="card kpi ${p1.length?tone(p1ok,p1.length,1):'none'}"><div class="l"><span class="dot"></span>Sensitive referred ≤24 h</div><div class="v">${p1.length?pc(p1ok,p1.length):'–'}</div><div class="s">${p1.length} P1 case${p1.length===1?'':'s'} · ${pc(fb,L.length)} fed back</div></div></div>
  <div class="tw"><table><thead><tr><th>Ref</th><th>Received</th><th>Priority</th><th>Channel</th><th>Location</th><th>Category</th><th style="min-width:220px">Summary</th><th>Status</th><th>Due</th><th class="num">Days to close</th><th>Fed back</th></tr></thead><tbody>`;
  if(!L.length)h+=`<tr><td colspan="11" class="empty">No feedback logged for ${sel}.</td></tr>`;
  for(const [f,x] of sl.sort((a,b)=>a[0].id<b[0].id?1:-1))h+=`<tr class="click" onclick="editFrm('${f.id}')"><td><b>${esc(f.id)}</b></td><td class="nowrap">${esc(f.date)}</td><td>${chip(x.p==='P1'?'t-alert':x.p==='P2'?'t-warn':'t-none',x.p)}</td><td>${esc(f.channel)}</td><td>${esc(f.location)}</td><td>${esc(f.category)}${f.sensitive==='Yes'?' '+chip('t-alert','Sensitive'):''}</td><td class="small">${esc(f.summary)}</td><td>${chip(statusTone(f.status),f.status)}</td><td class="nowrap">${x.due?iso(x.due):''}${x.overdue?' '+chip('t-bad','Overdue'):x.ok===true?' '+chip('t-good','On time'):x.ok===false?' '+chip('t-bad','Late'):''}</td><td class="num calc">${f.closed?days(parse(f.date),parse(f.closed)):''}</td><td>${esc(f.feedbackGiven)}</td></tr>`;
  return h+`</tbody></table></div>`;
}

    for(let m=1;m<=12;m++){const sch=(e.months||[]).includes(m);const done=(e.done||{})[m];const late=sch&&!done&&m<cm;
      h+=`<td class="m ${m===cm?'cur':''}">${sch?`<button class="tick ${done?'on':late?'late':''}" title="${M[m-1]}: ${done?'done':late?'not done':'scheduled'}" aria-label="${esc(e.event)} ${M[m-1]} ${done?'done':'not done'}" ${dis()} onclick="tickCal('${e.id}',${m},${!done})">${done?'✓':'●'}</button>`:''}</td>`}
    h+='</tr>'}
  if(!S.cal.length)h+=`<tr><td colspan="14" class="empty">No MEAL calendar set up for this project.</td></tr>`;
  return h+'</tbody></table></div>';
}

function wpState(a){const cm=curMonth();const ms=a.months||[];const st=a.status||'';
  if(st==='Completed'||st==='Cancelled')return st;const past=ms.filter(m=>m<cm);const due=ms.includes(cm);

  if(f.wst==='behind')L=L.filter(a=>['Not updated','Behind schedule','Delayed'].includes(wpState(a))||a.status==='Delayed');else if(f.wst==='due')L=L.filter(a=>(a.months||[]).includes(cm)&&a.status!=='Completed'&&a.status!=='Cancelled');else if(f.wst)L=L.filter(a=>(a.status||'')===f.wst);

function vEv(){
  let h=`<p class="lead">Quarterly MEAL / accountability rating session. Available = evidence complete for the quarter; Partial = some evidence; Gap = not yet in place.</p><div class="tw"><table><thead><tr><th>#</th><th style="min-width:200px">Evidence requested</th><th style="min-width:240px">Evidence to bring</th><th>Owner</th><th>Status</th><th style="min-width:200px">Gap / support needed</th><th style="min-width:180px">Action & deadline</th></tr></thead><tbody>`;
  for(const e of S.ev)h+=`<tr><td class="muted">${e.n}</td><td><b>${esc(e.requested)}</b></td><td class="small">${esc(e.evidence)}<div class="muted">${esc(e.where)}</div></td><td class="small">${esc(e.owner)}</td><td style="min-width:122px"><select class="${statusTone(e.status)}" ${dis()} onchange="write(()=>db.doc(dp('evidence','${e.id}')).update({status:this.value}))">${opt(EV_STATUS,e.status||'')}</select></td><td class="small">${esc(e.gap)}</td><td><input type="text" value="${esc(e.action)}" ${dis()} onchange="write(()=>db.doc(dp('evidence','${e.id}')).update({action:this.value}))" style="width:100%"></td></tr>`;
  if(!S.ev.length)h+=`<tr><td colspan="7" class="empty">No evidence checklist set up for this project.</td></tr>`;
  return h+'</tbody></table></div>';
}

/* ---------- CHECKLISTS ---------- */
const curQ=()=>'Q'+(Math.floor(today().getMonth()/3)+1);
const bmVis=()=>hiddenRes().includes('Result 4')?S.bm.filter(b=>!/THP/.test((b.owner||'')+' '+(b.activity||''))):S.bm;
const bmTools=b=>String(b.tool||'').split(/;\s*/).map(x=>x.trim()).filter(Boolean);
const toolsSet=b=>b.tools&&Object.values(b.tools).some(v=>v!==undefined);
function tickTool(id,k,v){write(()=>db.doc(dp('benchmarks',id)).update({tools:{[k]:v}}))}
const bmItems=b=>String(b.benchmark||'').split(/;\s*/).map(x=>x.trim()).filter(Boolean);
function routine(month){
  const m=month||Math.max(1,curMonth());const ld=cycle().latestDue;const lm=inYear(ld)?ld.getMonth()+1:0;
  const doc=S.checklists.find(c=>c.id===`routine-${YEAR}-${String(m).padStart(2,'0')}`)||{};const t=doc.items||{};
  const miss=S.ind.filter(missing).length;const due=S.cal.filter(e=>(e.months||[]).includes(m));const dueDone=due.filter(e=>(e.done||{})[m]).length;
  const noStatus=S.act.filter(a=>!a.status).length;const od=S.actions.filter(isOverdue).length;const badSrc=S.sources.filter(s=>/Failed|Action needed/.test(s.status||'')).length;
  const items=[
   {k:'reports',t:`All 7 health facilities submitted ${lm?M[lm-1]:''} HIA2/DHIS2 reports by the 15th`},
   {k:'extract',t:'DHIS2 data extracted, validated and outliers checked'},
   {k:'iptt',t:`IPTT updated for ${lm?M[lm-1]:'the latest month'}`,auto:miss===0,info:miss?`${miss} monthly indicators still missing`:'all monthly indicators reported',link:'iptt'},
   {k:'dq',t:'Completeness / timeliness reviewed and DQ issues followed up with facilities'},
   {k:'cal',t:`MEAL calendar events for ${M[m-1]} completed and ticked`,auto:due.length>0&&dueDone===due.length,info:`${dueDone}/${due.length} events ticked`,link:'cal'},
   {k:'act',t:'Work-plan activity status updated',auto:S.act.length>0&&noStatus===0,info:noStatus?`${noStatus} activities without a status`:'all activities updated',link:'act'},
   {k:'actions',t:'Overdue actions reviewed with owners',info:`${od} overdue`,link:'actions'},
   {k:'frm',t:'New feedback logged and acknowledged within 7 days',link:'frm'},
   {k:'sources',t:'Data sources pulled without errors',auto:S.sources.length>0&&badSrc===0,info:S.sources.length?`${badSrc} need attention`:'no sources connected',link:'sources'}];
  if([3,6,9,12].includes(m))items.push({k:'qbm',t:'Quarter end: quality benchmarks rated and evidence readiness updated',link:'bm'},{k:'csv',t:'Quarter end: IPTT exported for the MEL review and DHO meeting',link:'iptt'});
  items.forEach(it=>{const v=t[it.k];it.done=it.auto===true||!!(v&&v.done);it.by=v&&v.by;it.at=v&&v.at;it.isAuto=it.auto!==undefined});
  return {m,id:`routine-${YEAR}-${String(m).padStart(2,'0')}`,items,done:items.filter(i=>i.done).length,total:items.length};
}
function prog(d,t){return `<div class="prog"><div class="track"><i style="width:${t?d/t*100:0}%"></i></div><b>${d}/${t}</b></div>`}
function vChecks(){
  const q=S.f.cq||curQ();const m=S.f.cm||Math.max(1,curMonth());const r=routine(m);
  let h=`<div class="toolbar"><select aria-label="Month" onchange="S.f.cm=+this.value;render()">${M.map((x,k)=>`<option value="${k+1}" ${k+1===m?'selected':''}>${x} ${YEAR}</option>`).join('')}</select>
   <select aria-label="Quarter" onchange="S.f.cq=this.value;render()">${['Q1','Q2','Q3','Q4'].map(x=>`<option ${x===q?'selected':''}>${x}</option>`).join('')}</select>
   <span class="grow small muted">Tick items as they are done. Items marked <span class="auto">auto</span> tick themselves from the tracker's data.</span></div>
  <div class="grid g-2" style="align-items:start">
  <section class="card"><div class="card-h"><h2>Monthly MEAL routine · ${M[m-1]} ${YEAR}</h2>${prog(r.done,r.total)}</div>
   <ul class="cl">${r.items.map(it=>`<li class="${it.done?'done':''}"><label><input type="checkbox" ${it.done?'checked':''} ${it.isAuto||!S.canEdit?'disabled':''} onchange="tickRoutine('${r.id}','${it.k}',this.checked)" aria-label="${esc(it.t)}"><span class="txt"><span>${esc(it.t)}</span>${it.info?`<div class="who">${esc(it.info)}</div>`:''}${it.by&&!it.isAuto?`<div class="who" data-uid="${esc(it.by)}">Ticked ${esc((it.at||'').slice(0,10))}</div>`:''}</span></label>${it.isAuto?'<span class="auto">auto</span>':''}${it.link?`<a class="small" href="#/${S.pid}/${it.link}">Open</a>`:''}</li>`).join('')}</ul></section>
  <section class="card"><div class="card-h"><h2>Evidence readiness · ${q}</h2>${prog(S.ev.filter(e=>e.status==='Available').length,S.ev.length)}</div>
   <ul class="cl">${S.ev.map(e=>`<li class="${e.status==='Available'?'done':''}"><label><input type="checkbox" ${e.status==='Available'?'checked':''} ${dis()} onchange="write(()=>db.doc(dp('evidence','${e.id}')).update({status:this.checked?'Available':(${JSON.stringify(e.status||'')}==='Available'?'Partial':${JSON.stringify(e.status||'')})}))" aria-label="${esc(e.requested)}"><span class="txt"><span>${esc(e.requested)}</span><div class="who">${esc(e.owner)}${e.status&&e.status!=='Available'?' · '+esc(e.status):''}</div></span></label></li>`).join('')||'<li class="muted">No evidence checklist for this project.</li>'}</ul></section>
  </div>
  <h2 class="sec">Quality benchmark checklists · ${q}</h2><p class="lead">Each benchmark is split into its criteria. Tick the criteria met this quarter; the suggested rating follows (all met → Met, some → Partly met, none → Not met). Apply it to record the rating on the Quality Benchmarks tab.</p>
  <div class="stack-v" style="--gap:12px">`;
  for(const b of bmVis()){const it=bmItems(b);const auto=bmAuto(b,q,it);const ck=Object.assign({},(b.checks||{})[q]||{});for(const k in auto)if(auto[k].v!==null)ck[k]=auto[k].v;const d=it.filter((_,k)=>ck[k]).length;const sug=d===0?'Not met':d===it.length?'Met':'Partly met';const cur=(b.ratings||{})[q]||'';
    h+=`<details class="card bmc" ${S.f.openBm===b.id?'open':''} ontoggle="if(this.open)S.f.openBm='${b.id}'"><summary><span class="num">${b.n}</span><span><b>${esc(b.activity.split('(')[0].trim())}</b><div class="small muted">${esc(b.owner)} · ${bmTools(b).filter((_,k)=>(b.tools||{})[k]).length}/${bmTools(b).length} tools applicable</div></span>${prog(d,it.length)}${cur?chip(statusTone(cur),cur):chip('t-none','Not rated')}</summary>
     <ul class="cl">${it.map((x,k)=>{const au=auto[k];return `<li class="${ck[k]?'done':''}"><label><input type="checkbox" ${ck[k]?'checked':''} ${au&&au.v!==null||!S.canEdit?'disabled':''} onchange="tickBm('${b.id}','${q}',${k},this.checked)" aria-label="${esc(x)}"><span class="txt"><span>${esc(x)}</span>${au?`<div class="who">${esc(au.info)}</div>`:''}</span></label>${au&&au.v!==null?'<span class="auto">auto</span>':''}</li>`}).join('')}</ul>
     <div class="cl-h"><span>Monitoring checklists / tools · tick those that apply</span><span>${bmTools(b).filter((_,k)=>(b.tools||{})[k]).length}/${bmTools(b).length} applicable</span></div>
     <ul class="cl tools">${bmTools(b).map((x,k)=>{const on=!!(b.tools||{})[k];return `<li class="${on?'':'na'}"><label><input type="checkbox" ${on?'checked':''} ${dis()} onchange="tickTool('${b.id}',${k},this.checked)" aria-label="${esc(x)} applicable"><span class="txt"><span>${esc(x)}</span><div class="who">${on?'Applicable – in use for this benchmark':(toolsSet(b)?'Not applicable':'Not yet confirmed')}</div></span></label></li>`}).join('')}</ul>
     <div class="foot"><span class="small">Suggested ${q} rating: ${chip(statusTone(sug),sug)}</span>${S.canEdit?`<span style="display:flex;gap:8px"><button class="btn" onclick="rateBm('${b.id}','${q}','N/A')">Mark N/A</button><button class="btn primary" ${cur===sug?'disabled':''} onclick="rateBm('${b.id}','${q}','${sug}')">Apply rating</button></span>`:''}</div></details>`}
  if(!S.bm.length)h+='<div class="card empty">No quality benchmarks for this project.</div>';
  return h+'</div>';
}
async function tickRoutine(id,k,v){let by='';try{by=user?await user.id():''}catch(e){}
  const ref=db.doc(dp('checklists',id));write(async()=>{const s=await ref.get();const it={[k]:{done:v,by,at:new Date().toISOString()}};if(s.exists)await ref.update({items:it});else await ref.set({items:it,month:id})})}
function tickBm(id,q,k,v){write(()=>db.doc(dp('benchmarks',id)).update({checks:{[q]:{[k]:v}}}))}

/* benchmark #1 (trainings) criteria checked automatically from the Trainings Tracker */
function bmAuto(b,q,items){const out={};if(!/training/i.test(b.activity||'')||!S.trainings.length)return out;
  const qn=+q.slice(1);const ts=S.trainings.filter(t=>t.type==='Clinical training'&&t.month&&Math.ceil(t.month/3)===qn&&(t.modules||[]).length);
  items.forEach((x,k)=>{
    if(/pre\/?post test administered/i.test(x)){if(!ts.length){out[k]={v:null,info:`No scored clinical trainings dated in ${q}`};return}
      let tot=0,ok=0;ts.forEach(t=>t.participants.forEach(p=>(p.scores||[]).forEach(s=>{tot++;if(typeof s.pre==='number'&&typeof s.post==='number')ok++})));out[k]={v:tot>0&&ok===tot,info:`${ok}/${tot} participant-module tests have both pre and post scores (${ts.map(t=>t.code).join(', ')})`}}
    else if(/score ≥?80% at post/i.test(x)||/80% of participants/i.test(x)){if(!ts.length){out[k]={v:null,info:`No scored clinical trainings dated in ${q}`};return}
      let tot=0,ok=0;ts.forEach(t=>t.participants.forEach(p=>(p.scores||[]).forEach(s=>{if(typeof s.post==='number'){tot++;if(s.post>=0.8)ok++}})));const sh=tot?ok/tot:0;out[k]={v:sh>=0.8,info:`${Math.round(sh*100)}% of post-tests scored ≥80% (${ts.map(t=>t.code).join(', ')})`}}});
  return out}

/* ---------- MEAL PLAN ---------- */
const MP_COLS=[['Disaggregation required','disagg',1],['Method','method',1],['Frequency of collection','freqText',0],['Person who will collect data','collector',0],['Respondents (who to talk to)','respondents',1],['Means of verification','mov',0],['Data quality control','dqc',1],['Analysis method','analysis',1],['Reporting frequency','reporting',0],['Person responsible','owner',0],['Use of information for communication and decision-making','use',0]];
const mpVal=(i,e,c)=>c[2]?e[c[1]]:i[c[1]];
const mpBand=h=>h.startsWith('Intermediate Result ')?'Outcome '+h.slice(20):h;
function mpDef(i){const d=String(i.definition||'');const k=d.search(/\s*Numerator:/);const base=(k<0?d:d.slice(0,k)).trim();
  if(i.numLabel)return [base,'Numerator: '+i.numLabel,'Denominator: '+(i.denLabel||'')];
  if(k>=0){const r=d.slice(k).trim().split(/\s*(?=Denominator:)/);return [base,...r]}return [base,'Numerator: N/A (count)','Denominator: N/A']}
const GOAL_TXT='Goal: Improved maternal, newborn and child health and nutrition outcomes in Chipangali and Lumezi districts, Eastern Province';
function mpFilt(){const mp=S.mealplan||{};const ex=mp.extra||{};const f=S.f;return S.ind.filter(i=>(!f.mres||i.result===f.mres)&&(!f.mq||JSON.stringify([i.name,i.code,i.definition,ex[i.code]]).toLowerCase().includes(f.mq.toLowerCase())))}
function tocStat(res){const L=S.ind.filter(i=>i.result===res&&i.freq!=='survey');const c={good:0,warn:0,bad:0,other:0};L.forEach(i=>{const s=calc(i).status;if(c[s]!==undefined)c[s]++;else c.other++});return {n:L.length,c}}
function tocBar(st){if(!st.n)return '<div class="small muted">THP-led – indicators hidden for now</div>';const w=k=>st.c[k]/st.n*100;
  return `<div class="tocbar" role="img" aria-label="${st.c.good} green, ${st.c.warn} yellow, ${st.c.bad} red, ${st.c.other} awaiting data or no target"><i style="width:${w('good')}%;background:var(--good-ink)"></i><i style="width:${w('warn')}%;background:var(--rag-y)"></i><i style="width:${w('bad')}%;background:var(--bad-ink)"></i><i style="width:${w('other')}%;background:var(--line)"></i></div><div class="small muted">${st.c.good} green · ${st.c.warn} yellow · ${st.c.bad} red${st.c.other?` · ${st.c.other} awaiting data / no target`:''}</div>`}
function vToc(t){const f=S.f;const G=(t.goalCodes||[]).map(c=>S.ind.find(i=>i.code===c)).filter(Boolean);
  let h=`<details class="card tocw" style="margin-bottom:var(--space-5)" ${f.tocC?'':'open'} ontoggle="S.f.tocC=!this.open"><summary class="card-h"><h2>Theory of change</h2><span class="small muted">status from the IPTT</span></summary><div class="cb">
   <div class="tocp"><b>Problem</b> ${esc(t.problem)}</div>
   <div class="toc">`;
  (t.pathways||[]).forEach((p,k)=>{const st=tocStat(p.result);
    h+=`<div class="tcell tout" style="grid-row:${k+1}"><div class="tlab">Activities & outputs</div><ul>${p.outputs.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div><div class="tarr" style="grid-row:${k+1};grid-column:2" aria-hidden="true">→</div>
     <div class="tcell tir" style="grid-row:${k+1}"><div class="tlab">${esc(p.result)}</div><b>${esc(p.ir)}</b><p class="small"><b>If</b> ${esc(p.if)}, <b>then</b> ${esc(p.then)}, <b>because</b> ${esc(p.because)}.</p>${tocBar(st)}</div><div class="tarr" style="grid-row:${k+1};grid-column:4" aria-hidden="true">→</div>`});
  h+=`<div class="tcell tgoal" style="grid-row:1 / span ${(t.pathways||[]).length}"><div class="tlab">Goal</div><b>${esc(t.goal)}</b><ul class="tgl">${G.map(i=>{const c=calc(i);return `<li class="click" onclick="openInd('${i.id}')"><span>${esc(i.name.replace(/^Number of |^% of /,'').replace(/^./,x=>x.toUpperCase()))}</span>${curPill(i,c)}</li>`}).join('')}</ul><div class="small muted">Target is a ceiling for deaths – lower is better.</div></div></div>
   <div class="grid tocx"><div><div class="tlab">How the results connect</div><ul>${(t.links||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><div class="tlab">Assumptions</div><ul>${(t.assumptions||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>${t.risks?`<div class="full" style="grid-column:1/-1"><div class="tlab">Risks & mitigation</div><ul>${t.risks.map(r=>`<li><b>${esc(r[0])}</b> – ${esc(r[1])}</li>`).join('')}</ul></div>`:''}</div></div></details>`;
  return h}

     <tr><th style="width:170px">Output</th><th style="width:260px">Indicator</th><th style="width:280px">Indicator definition</th><th class="num" style="width:90px">Baseline</th><th class="num" style="width:90px">Target</th><th class="num" style="width:90px">Current</th><th style="width:130px">Status</th>${MP_COLS.map(c=>`<th style="width:${c[1]==='dqc'||c[1]==='use'?240:170}px">${c[0]}</th>`).join('')}<th style="width:220px">Notes / data-quality flags</th></tr></thead><tbody>`;
    let lr='',lh='',lo='';
    for(const i of L){const e=ex[i.code]||{};const c=calc(i);
      if(i.result!==lr){lr=i.result;lh='';if(i.result==='Goal')h+=`<tr class="b-res"><td colspan="${NC+1}">${esc(GOAL_TXT)}</td></tr>`}

    h+='</tbody></table></div>';
  }else{
    let lastR='';let open=false;
    for(const i of L){const e=ex[i.code]||{};
      if(i.result!==lastR){if(open)h+='</div></section>';h+=`<section class="card" style="margin-bottom:var(--space-5)"><div class="card-h"><h2><span class="chip t-none" style="margin-right:8px">${esc(i.result)}</span>${esc(resName(i.result)||'')}</h2></div><div>`;lastR=i.result;open=true}
      const c=calc(i);const d=mpDef(i);
      h+=`<details class="mp"><summary><span class="muted small">${esc(i.code)}</span><span><b>${esc(i.name)}</b><div class="small muted">${esc(i.output)}</div></span><span class="small nowrap">${i.baseline===null?esc(i.baselineText||'–'):fmt(i,i.baseline)} → ${i.target===null?esc(i.targetText||'–'):fmt(i,i.target)}</span><span class="small nowrap">${curPill(i,c)}</span>${stChip(c)}</summary>
       <dl class="mpg">${[['Indicator definition',d.join('\n')],...MP_COLS.map(col=>[col[0],mpVal(i,e,col)]),['Notes / flags',i.flag],['Data source',i._derived||i.dataSource]].filter(x=>x[1]).map(([k,v])=>`<dt>${k}</dt><dd style="white-space:pre-line">${esc(v)}</dd>`).join('')}</dl>
       <div style="padding:0 var(--space-5) var(--space-4)"><button class="btn" onclick="openInd('${i.id}')">${ic('iptt')} Open in IPTT</button></div></details>`}

const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const lcp=(a,b)=>{let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;return i};
const SKIP={'R1-15':'Zero-dose children immunised – the IPTT row holds the DHIS2 zero-dose count, not children immunised'};
function parseIPTT(X,ws){
  const rows=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  let hi=rows.findIndex(r=>r&&String(r[0]||'').trim().toLowerCase()==='indicators');
  const hdr=rows[hi]||[];const mcol={};
  hdr.forEach((v,ix)=>{let d=null;
    if(v instanceof Date)d=new Date(v.getTime()+12*3600e3);
    else if(typeof v==='number'&&v>40000&&v<60000){const o=X.SSF.parse_date_code(v);d=new Date(o.y,o.m-1,o.d)}
    else if(typeof v==='string'){const mm=/^([A-Za-z]{3})[a-z]*[\s\-\/]*(\d{2,4})$/.exec(v.trim());if(mm){const mi=M.findIndex(x=>x.toLowerCase()===mm[1].toLowerCase());let y=+mm[2];if(y<100)y+=2000;if(mi>=0)d=new Date(y,mi,15)}}
    if(d&&d.getFullYear()===YEAR&&!(d.getMonth()+1 in mcol))mcol[d.getMonth()+1]=ix});
  const val=(r,m)=>{const v=r[mcol[m]];return typeof v==='number'&&isFinite(v)?v:null};
  const blocks=[];let cur=null;
  for(let k=hi+1;k<rows.length;k++){const r=rows[k]||[];const a=String(r[0]||'').trim(),c=String(r[2]||'').trim().toLowerCase();
    if(a){cur={label:a.replace(/\s+/g,' '),total:r,num:null,den:null,count:null};blocks.push(cur);continue}
    if(!cur)continue;const dd=String(r[3]||'').trim().toLowerCase();
    if(c==='count'){cur.count=r;continue}
    if(!cur.num&&(c==='numerator'||/^(num|n)\s*[:.]/.test(dd)||dd==='numerator')){cur.num=r;cur.numLabel=String(r[3]||'').replace(/^(num(erator)?|n)\s*[:.]\s*/i,'').trim().slice(0,120);continue}
    if(cur.num&&!cur.den&&(c==='denominator'||/^(den|d)\s*[:.]/.test(dd)||dd==='denominator')){cur.den=r;cur.denLabel=String(r[3]||'').replace(/^(den(ominator)?|d)\s*[:.]\s*/i,'').trim().slice(0,120)}}
  const series=fn=>{const o={};for(let m=1;m<=12;m++)o[m]=fn(m);return o};
  const out={},unmatched=[],skipped=[];const ment=S.indAll.find(i=>/mentorship conducted/i.test(i.name));
  for(const b of blocks){const nb=norm(b.label);let best=null,bs=0,tie=false;
    for(const i of S.indAll){const sc=lcp(nb,norm(i.name));if(sc>bs){bs=sc;best=i;tie=false}else if(sc===bs&&best&&i.id!==best.id)tie=true}
    if(b.count&&ment&&!out[ment.id])out[ment.id]={code:ment.id,label:'Mentorships conducted',actuals:series(m=>val(b.count,m))};
    if(!best||tie||!(bs>=25||bs===nb.length||bs===norm(best.name).length)){if(!/^(intermediate|ir\s|overall goal|result)/i.test(b.label))unmatched.push(b.label.slice(0,80));continue}
    if(SKIP[best.id]){if(!skipped.includes(SKIP[best.id]))skipped.push(SKIP[best.id]);continue}
    const pctND=b.num&&b.den&&best.unit==='percent';
    const s=pctND?series(m=>{const n=val(b.num,m),d=val(b.den,m);return n!==null&&d?n/d:null}):series(m=>val(b.total,m));
    if(pctND&&!out[best.id]){out[best.id]={code:best.id,label:b.label,actuals:s,num:series(m=>val(b.num,m)),den:series(m=>val(b.den,m)),numLabel:b.numLabel,denLabel:b.denLabel};continue}
    if(out[best.id]&&best.agg==='sum')for(let m=1;m<=12;m++){const x=out[best.id].actuals[m],y=s[m];out[best.id].actuals[m]=x===null&&y===null?null:(x||0)+(y||0)}
    else if(!out[best.id])out[best.id]={code:best.id,label:b.label,actuals:s}}
  const anc=S.indAll.find(i=>/total number of women attending anc/i.test(i.name));let anchor=0;const lastNZ=a=>{let l=0;for(let m=1;m<=12;m++)if(a[m])l=m;return l};
  if(anc&&out[anc.id])anchor=lastNZ(out[anc.id].actuals);if(!anchor)for(const o of Object.values(out))anchor=Math.max(anchor,lastNZ(o.actuals));
  for(const o of Object.values(out)){const i=S.indAll.find(x=>x.id===o.code);const zeroIsBlank=i&&(i.freq==='survey'||i.unit==='score');
    for(let m=1;m<=12;m++){const v=o.actuals[m];if(v===0&&(m>anchor||zeroIsBlank))o.actuals[m]=null;if(v===undefined)o.actuals[m]=null;
      if(o.num){if(m>anchor&&!o.num[m]){o.num[m]=null;o.den[m]=null}if(o.den[m]===0)o.actuals[m]=null}}}
  const matches=Object.values(out).filter(o=>Object.values(o.actuals).some(v=>v!==null)).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}));
  return {matches,unmatched,skipped,anchor};
}
async function applyImport(){
  const pv=S.up.preview;if(!pv)return;S.up.busy=true;render();let ok=0,fail=0;const src=`${pv.file} (OHNEZ_IPTT sheet), imported ${iso(today())}`;
  for(const m of pv.matches){const a={};for(let k=1;k<=12;k++)a[k]=m.actuals[k]===undefined?null:m.actuals[k];const upd={actuals:a,dataSource:src};
    if(m.num){upd.num={};upd.den={};for(let k=1;k<=12;k++){upd.num[k]=m.num[k]??null;upd.den[k]=m.den[k]??null}if(m.numLabel)upd.numLabel=m.numLabel;if(m.denLabel)upd.denLabel=m.denLabel}
    try{await db.doc(dp('indicators',m.code)).update(upd);ok++}catch(e){fail++}}
  try{await db.doc(cfgPath()).update({lastImport:`${pv.file} – ${ok} indicators to ${M[pv.anchor-1]||''} ${YEAR}`})}catch(e){}
  if(pv.ref)try{await db.doc(dp('uploads',pv.ref)).update({status:fail?'Failed':'Applied',result:`${ok} indicators updated to ${M[pv.anchor-1]||''} ${YEAR}${fail?`, ${fail} failed`:''}`})}catch(e){}
  stamp();S.up={busy:false,preview:null,msg:`Update applied: ${ok} indicators now hold data to ${M[pv.anchor-1]||''} ${YEAR}${fail?` (${fail} could not be saved)`:''}.`};render();
}

const GOAL_LF='Overall Goal: Reduced maternal, neonatal, and child mortality, malnutrition and improved health and nutrition outcomes';
const lfNum=v=>{const n=Number(v);return v===null||v===undefined||v===''||isNaN(n)?null:n};
function lfRows(){return S.ind.slice().sort((a,b)=>((a.lf&&a.lf.row)||900+(a.order||0))-((b.lf&&b.lf.row)||900+(b.order||0)))}
function lfGap(i,c){const t=num(i.target);if(t===null||c.cur===null||c.cur===undefined)return {txt:'–',tone:''};
  if(i.direction==='decrease'){const d=c.cur-t;return d<=0?{txt:'Within target',tone:'t-good'}:{txt:fmt(i,d)+' over',tone:'t-bad'}}
  const d=t-c.cur;return d<=0?{txt:'Met (+'+fmt(i,-d)+')',tone:'t-good'}:{txt:fmt(i,d)+' to go',tone:''}}
function lfSheetNote(i){const l=i.lf||{};const pc=i.unit==='percent';const rb=lfNum(l.lfBase),rt=lfNum(l.lfTarget);const big=pc&&((rb||0)>1.5||(rt||0)>1.5);const sc=v=>v===null?null:big?v/100:v;
  const b=sc(rb),t=sc(rt);const d=(a,x)=>a!==null&&x!==null&&x!==undefined&&Math.abs(a-x)>Math.max(0.01*Math.abs(x),0.006);
  const out=[];if(d(b,num(i.baseline)))out.push('baseline '+fmt(i,b));if(d(t,num(i.target)))out.push('target '+fmt(i,t));return out.length?'Log Frame sheet shows '+out.join(' and ')+' – the hub uses the Total Reach values. Edit in the IPTT if needed.':''}

     <td class="num calc curc" ${S.canEdit?`title="Click to edit the current value" onclick="event.stopPropagation();editCur('${i.id}',this)"`:''}>${curPill(i,c)}${c.manual?' <span class="chip t-flag" title="Manually entered – clear to return to the calculated value">Manual</span>':''}${S.canEdit?'<span class="curpen" aria-hidden="true">✎</span>':''}${c.nd?`<div class="small muted">${Math.round(c.nsum).toLocaleString('en-GB')} / ${Math.round(c.dsum).toLocaleString('en-GB')}</div>`:''}</td>

function hubRemoteDb(call){

      async get(){const j=await call('hub_get',{path});return snap(id,!!j.exists,j.data)},
      async set(data){await call('hub_set',{path,data});notify([path])},
      async update(data){await call('hub_update',{path,data});notify([path])},
      async delete(){await call('hub_delete',{path});notify([path])},
      async acquire(){return{acquired:true}},
      collection(sub){return collRef(path+'/'+sub)},
      onSnapshot(next){const w=watch(async()=>{const s=await r.get();return[{cb:next,v:s},JSON.stringify([s.exists,s.data()])]});
        const l=ps=>{if(ps.includes('*')||ps.includes(path))w.go()};ls.add(l);w.go();return()=>{w.stop();ls.delete(l)}}};
    return r}
  function query(coll,where,orderBy,dir,lim){
    const q={
      where(f,op,v){return query(coll,where.concat([{field:f,op,value:v}]),orderBy,dir,lim)},
      orderBy(f,d){return query(coll,where,f,d||'asc',lim)},
      limit(n){return query(coll,where,orderBy,dir,n)},
      async get(){const j=await call('hub_query',{coll,where,orderBy:orderBy||undefined,dir,limit:lim||undefined});const docs=(j.docs||[]).map(d=>snap(d.id,true,d.data));
        return{docs,size:docs.length,empty:!docs.length,docChanges:()=>docs.map((doc,i)=>({type:'added',doc,oldIndex:-1,newIndex:i})),metadata:META}},
      onSnapshot(next){const w=watch(async()=>{const s=await q.get();return[{cb:next,v:s},JSON.stringify(s.docs.map(d=>[d.id,d.data()]))]});
        const l=ps=>{if(ps.includes('*')||ps.some(p=>p.split('/').slice(0,-1).join('/')===coll))w.go()};ls.add(l);w.go();return()=>{w.stop();ls.delete(l)}}};
    return q}

  return Object.freeze({doc:docRef,collection:collRef});
}
async function hubLink(local){
  let m=null;try{m=await claude.use('mcp')}catch(e){}
  if(!m)return local;
  const call=async(tool,args)=>{const p=hubPayload(await m.callTool(HUB_SITE,tool,args));if(p&&p.isError)throw{code:'tool_error',message:'Website error'};return p};
  let st;try{st=await call('hub_changes',{since:'9999'})}catch(e){console.warn('MEAL Hub website not linked:',e);return local}
  if(!st||typeof st.count!=='number')return local;
  if(local){
    let ok=false;try{ok=user?await user.canEdit():false}catch(e){}
    if(ok){try{
      const sy0=await call('hub_get',{path:'hub/sync'})||{};const done0=new Set((sy0.exists&&sy0.data&&sy0.data.backfilled)||[]);const counts={};for(const n of HUB_SYNC_COLS){if(done0.has(n)){counts[n]=1;continue}try{const q=await call('hub_query',{coll:n,limit:1});counts[n]=(q&&q.docs||[]).length}catch(e){counts[n]=null}}const sy=await call('hub_get',{path:'hub/sync'})||{};
      const done=new Set((sy.exists&&sy.data&&sy.data.backfilled)||[]);let copied=0;const newly=[];
      for(const n of HUB_SYNC_COLS){if(counts[n]!==0||done.has(n))continue;const s=await local.collection(n).get();if(!s.size)continue;
        const docs=s.docs.map(d=>({path:n+'/'+d.id,data:d.data()}));for(let i=0;i<docs.length;i+=40)await call('hub_import',{docs:docs.slice(i,i+40)});copied+=docs.length;newly.push(n)}
      const mark=[...new Set([...done,...HUB_SYNC_COLS.filter(n=>counts[n]>0),...newly])];
      if(mark.length!==done.size)await call('hub_set',{path:'hub/sync',data:{backfilled:mark,at:new Date().toISOString()}});
      if(copied)setTimeout(()=>{try{toast('Copied '+copied+' records to the website. Both now share one dataset.')}catch(e){}},1500);
    }catch(e){console.warn('MEAL Hub backfill skipped:',e)}}
  }
  hubMode='website';
  return hubRemoteDb(call);
}

/* generic edit dialog */
window.regEdit=function(k,id){
  const r=REG[k];const list=S[r.key]||[];const o=id?list.find(x=>x.id===id):Object.assign({id:nextId(list,r.prefix),date:iso(today())},r.defaults||{});if(!o)return;
  document.getElementById('dlgT').textContent=(id?r.label.replace(/s$/,'')+' ':'New entry ')+o.id;
  const fld=([n,l,t,opts])=>{const v=o[n]??'';
    if(t==='select')return `<label>${l}<select name="${n}" ${dis()}>${opt(opts.includes(String(v))?opts:[...opts,String(v)].filter((x,i,a)=>a.indexOf(x)===i),String(v)||opts[0])}</select></label>`;
    if(t==='textarea')return `<label class="full">${l}<textarea name="${n}" ${dis()}>${esc(v)}</textarea></label>`;
    if(t==='number')return `<label>${l}<input type="number" min="0" max="200" step="0.1" name="${n}" value="${esc(v)}" ${dis()}></label>`;
    if(opts==='hfs')return `<label>${l}<input type="text" name="${n}" list="regHfs" value="${esc(v)}" ${dis()}><datalist id="regHfs">${HFS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>`;
    return `<label>${l}<input type="${t}" name="${n}" value="${esc(v)}" ${dis()}></label>`};
  document.getElementById('dlgB').innerHTML=`<div class="form" id="regf">${r.fields.map(fld).join('')}</div>`;
  document.getElementById('dlgF').innerHTML=S.canEdit?`${id?`<button class="btn ghost" style="margin-right:auto" onclick="if(confirm('Delete ${o.id}?')){dlg.close();write(()=>db.doc(dp('${r.col}','${o.id}')).delete())}">Delete</button>`:''}<button class="btn" onclick="dlg.close()">Cancel</button><button class="btn primary" onclick="regSave('${k}','${o.id}')">Save</button>`:'<button class="btn" onclick="dlg.close()">Close</button>';
  dlg.showModal()};
window.regSave=function(k,id){const r=REG[k];const o=formData('#regf');if(!o[r.req]){alert('Please fill in: '+r.fields.find(f=>f[0]===r.req)[1]);return}
  if(o.status&&/Closed|Complete|Applied/.test(o.status)&&!o.closedDate)o.closedDate=iso(today());
  const prev=(S[r.key]||[]).find(x=>x.id===id)||{};o.id=id;dlg.close();write(()=>db.doc(dp(r.col,id)).set(Object.assign({},prev,o)))};
const addBtn=(k,txt)=>S.canEdit?`<button class="btn primary" onclick="regEdit('${k}')">${ic('plus')} ${txt}</button>`:'';
const emptyCard=(k,msg,txt)=>`<div class="card empty" style="padding:32px;text-align:center"><p style="margin:0 0 12px">${msg}</p>${addBtn(k,txt)}</div>`;
const statusChip=s=>chipT(/Closed|Complete|Applied/.test(s||'')?'good':/Delayed|Overdue/.test(s||'')?'bad':/Progress|Watch/.test(s||'')?'warn':'none',s||'Open');
const search=(k)=>`<input type="search" placeholder="Search…" aria-label="Search" value="${esc(S.f['q_'+k]||'')}" oninput="S.f['q_${k}']=this.value;clearTimeout(window._rq);window._rq=setTimeout(()=>{render();const e=document.querySelector('input[type=search]');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},250)" style="min-width:200px">`;
const match=(k,r)=>{const q=(S.f['q_'+k]||'').toLowerCase();return !q||JSON.stringify(r).toLowerCase().includes(q)};

/* ---- Data Quality ---- */
EXTRA_VIEWS.dqa=function(){
  const L=S.dqa;if(!L.length)return emptyCard('dqa','No data quality assessments recorded yet. Add one row per facility per RDQA round.','Add RDQA result');
  const rounds=[...new Set(L.map(x=>x.round).filter(Boolean))].sort();const sel=S.f.dqr&&rounds.includes(S.f.dqr)?S.f.dqr:rounds[rounds.length-1];
  const R=L.filter(x=>x.round===sel);const D=['completeness','timeliness','accuracy','consistency'];const m=D.map(d=>avg(R.map(x=>pct(x[d]))));
  const openA=L.filter(x=>isOpen(x)&&x.action).length,od=L.filter(overdue).length;
  let h=`<div class="toolbar"><select aria-label="Round" onchange="S.f.dqr=this.value;render()">${rounds.map(r=>`<option ${r===sel?'selected':''}>${esc(r)}</option>`).join('')}</select><span class="grow small muted">${R.length} of 7 facilities assessed in ${esc(sel)}</span>${addBtn('dqa','Add RDQA result')}</div>
  <div class="grid g-kpi" style="margin-bottom:24px">${D.map((d,i)=>kpi(toneP(m[i]),d[0].toUpperCase()+d.slice(1),fmtP(m[i]),'Average across facilities')).join('')}${kpi(od?'bad':openA?'warn':'good','Open DQ actions',openA,od?`<b>${od} overdue</b>`:'None overdue')}</div>
  <div class="card" style="margin-bottom:24px;padding:16px"><h3 style="margin:0 0 12px">Facility scores · ${esc(sel)}</h3><div class="tw"><table><thead><tr><th>Facility</th>${D.map(d=>`<th style="min-width:130px">${d[0].toUpperCase()+d.slice(1)}</th>`).join('')}<th>Overall</th></tr></thead><tbody>`;
  [...R].sort((a,b)=>(REG.dqa.score(b)||0)-(REG.dqa.score(a)||0)).forEach(x=>{const o=REG.dqa.score(x);h+=`<tr ${rowClick('dqa',x.id)}><td><b>${esc(x.facility)}</b><div class="small muted">${esc(x.area||'')}</div></td>${D.map(d=>`<td>${bar(pct(x[d]),toneP(pct(x[d])))}</td>`).join('')}<td>${chipT(toneP(o),fmtP(o))}</td></tr>`});
  h+=`</tbody></table></div></div>`;
  if(rounds.length>1){h+=`<div class="card" style="margin-bottom:24px;padding:16px"><h3 style="margin:0 0 12px">Trend across rounds (average overall score)</h3><div style="display:flex;align-items:flex-end;gap:16px;height:150px">`;
    rounds.forEach(rd=>{const v=avg(L.filter(x=>x.round===rd).map(REG.dqa.score));h+=`<div style="flex:1;text-align:center"><div class="small"><b>${fmtP(v)}</b></div><div style="height:${Math.round((v||0)*1.1)}px;background:var(--${toneP(v)==='good'?'good-ink':toneP(v)==='warn'?'warn-ink':'bad-ink'});border-radius:4px 4px 0 0;opacity:.8;transition:height .6s"></div><div class="small muted">${esc(rd)}</div></div>`});h+=`</div></div>`}
  h+=`<h3>Issues and actions</h3><div class="tw"><table><thead><tr><th>Ref</th><th>Round</th><th>Facility</th><th style="min-width:220px">Issue</th><th style="min-width:200px">Action</th><th>Responsible</th><th>Due</th><th>Status</th></tr></thead><tbody>`;
  L.filter(x=>x.issue||x.action).filter(x=>match('dqa',x)).forEach(x=>{h+=`<tr ${rowClick('dqa',x.id)}><td class="nowrap">${esc(x.id)}</td><td>${esc(x.round)}</td><td>${esc(x.facility)}</td><td class="small">${esc(x.issue)}</td><td class="small">${esc(x.action)}</td><td class="small">${esc(x.owner)}</td><td class="nowrap ${overdue(x)?'bad-t':''}">${esc(x.due||'')}${overdue(x)?' ⚠':''}</td><td>${statusChip(x.status)}</td></tr>`});
  return h+`</tbody></table></div>`};

/* ---- Field visits ---- */
EXTRA_VIEWS.visits=function(){
  const L=S.visits;if(!L.length)return emptyCard('visits','No monitoring visits logged yet.','Log a visit');
  const qs=[...new Set(L.filter(v=>v.date).map(v=>quarter(parse(v.date))))];if(!qs.includes(curQ()))qs.push(curQ());qs.sort();const sel=S.f.vq||curQ();
  const Q=L.filter(v=>v.date&&quarter(parse(v.date))===sel);const fac=HFS.filter(f=>!/Other/.test(f));
  const cov=fac.map(f=>[f,Q.filter(v=>(v.site||'').toLowerCase().includes(f.toLowerCase().split(' ')[0])).length]);const covered=cov.filter(c=>c[1]).length;
  const open=L.filter(v=>isOpen(v)&&v.followup).length,od=L.filter(overdue).length;const mx=Math.max(1,...cov.map(c=>c[1]));
  let h=`<div class="toolbar"><select aria-label="Quarter" onchange="S.f.vq=this.value;render()">${qs.map(q=>`<option ${q===sel?'selected':''}>${q}</option>`).join('')}</select>${search('visits')}<span class="grow"></span>${addBtn('visits','Log a visit')}</div>
  <div class="grid g-kpi" style="margin-bottom:24px">${kpi('none','Visits this quarter',Q.length,[...new Set(Q.map(v=>v.purpose))].filter(Boolean).length+' visit types')}${kpi(covered>=fac.length?'good':covered>=5?'warn':'bad','Facilities covered',covered+' / '+fac.length,'Each OHNEZ facility visited this quarter')}${kpi(od?'bad':open?'warn':'good','Open follow-ups',open,od?`<b>${od} overdue</b>`:'None overdue')}</div>
  <div class="card" style="margin-bottom:24px;padding:16px"><h3 style="margin:0 0 12px">Visits per facility · ${sel}</h3>${cov.map(([f,n])=>`<div style="display:grid;grid-template-columns:200px 1fr 30px;gap:10px;align-items:center;margin:6px 0"><span class="small">${esc(f)}</span><div style="height:12px;border-radius:999px;background:var(--surface-sunk,#eee);overflow:hidden"><div style="height:100%;width:${n/mx*100}%;background:${n?'var(--good-ink)':'transparent'};transition:width .6s"></div></div><b class="small">${n}</b></div>`).join('')}</div>
  <div class="tw"><table><thead><tr><th>Ref</th><th>Date</th><th>Site</th><th>Purpose</th><th style="min-width:220px">Key findings</th><th style="min-width:200px">Follow-up</th><th>Due</th><th>Status</th></tr></thead><tbody>`;
  L.filter(v=>match('visits',v)).forEach(v=>{h+=`<tr ${rowClick('visits',v.id)}><td class="nowrap">${esc(v.id)}</td><td class="nowrap">${esc(v.date)}</td><td>${esc(v.site)}</td><td class="small">${esc(v.purpose)}</td><td class="small">${esc(v.findings)}</td><td class="small">${esc(v.followup)}</td><td class="nowrap">${esc(v.due||'')}${overdue(v)?' ⚠':''}</td><td>${statusChip(v.status)}</td></tr>`});
  return h+`</tbody></table></div>`};

/* ---- Risks ---- */
EXTRA_VIEWS.risks=function(){
  const L=S.risks;if(!L.length)return emptyCard('risks','No risks or assumptions recorded yet. Start with the logframe assumptions and the risks raised at review meetings.','Add a risk');
  const A=L.filter(r=>r.status!=='Closed');const sc=REG.risks.score;const lvl=s=>s>=15?'bad':s>=8?'warn':'good';
  const hi=A.filter(r=>sc(r)>=15).length,me=A.filter(r=>sc(r)>=8&&sc(r)<15).length,lo=A.filter(r=>sc(r)<8).length;const due=A.filter(r=>r.review&&parse(r.review)<today()).length;
  let h=`<div class="toolbar">${search('risks')}<span class="grow"></span>${addBtn('risks','Add a risk')}</div><div class="grid g-kpi" style="margin-bottom:24px">${kpi(hi?'bad':'good','High (≥15)',hi,'Active risks')}${kpi(me?'warn':'good','Medium (8–14)',me,'Active risks')}${kpi('good','Low (<8)',lo,'Active risks')}${kpi(due?'warn':'good','Reviews overdue',due,'Past their review date')}</div>
  <div class="card" style="margin-bottom:24px;padding:16px"><h3 style="margin:0 0 12px">Risk matrix (active)</h3><div style="display:grid;grid-template-columns:auto repeat(5,minmax(52px,1fr));gap:4px;max-width:560px">`;
  for(let li=5;li>=1;li--){h+=`<div class="small muted" style="align-self:center;padding-right:6px">${li===5?'Likelihood 5':li}</div>`;for(let im=1;im<=5;im++){const cell=A.filter(r=>+r.likelihood===li&&+r.impact===im);const s=li*im;
    h+=`<div title="${cell.map(r=>esc(r.id+': '+r.risk)).join('\n')}" style="aspect-ratio:1.4;border-radius:6px;display:grid;place-items:center;font-weight:700;background:var(--${lvl(s)}-bg);color:var(--${lvl(s)}-ink);${cell.length?'box-shadow:inset 0 0 0 2px currentColor':''}">${cell.length||''}</div>`}}
  h+=`<div></div>${[1,2,3,4,5].map(i=>`<div class="small muted" style="text-align:center">${i===1?'Impact 1':i}</div>`).join('')}</div></div>
  <div class="tw"><table><thead><tr><th>Ref</th><th style="min-width:240px">Risk / assumption</th><th>Category</th><th>Result</th><th>Score</th><th style="min-width:220px">Mitigation</th><th>Owner</th><th>Review</th><th>Status</th></tr></thead><tbody>`;
  [...L].sort((a,b)=>sc(b)-sc(a)).filter(r=>match('risks',r)).forEach(r=>{const s=sc(r);h+=`<tr ${rowClick('risks',r.id)}><td class="nowrap">${esc(r.id)}</td><td>${esc(r.risk)}</td><td class="small">${esc(r.category)}</td><td class="small">${esc(r.result)}</td><td>${chipT(lvl(s),s+' · L'+(r.likelihood||'?')+'×I'+(r.impact||'?'))}</td><td class="small">${esc(r.mitigation)}</td><td class="small">${esc(r.owner)}</td><td class="nowrap">${esc(r.review||'')}</td><td>${statusChip(r.status||'Active')}</td></tr>`});
  return h+`</tbody></table></div>`};

/* ---- Evaluations ---- */
EXTRA_VIEWS.evals=function(){
  const L=S.evals;const seed=S.canEdit&&!L.length?`<button class="btn" onclick="regSeedEvals()">Add the standard OHNEZ schedule</button>`:'';
  if(!L.length)return `<div class="card empty" style="padding:32px;text-align:center"><p style="margin:0 0 12px">No evaluations or studies on the timeline yet.</p>${addBtn('evals','Add a study')} ${seed}</div>`;
  const ds=L.flatMap(x=>[x.start,x.end].filter(Boolean).map(parse));const mn=new Date(Math.min(...ds,today())),mxd=new Date(Math.max(...ds,today()));mn.setDate(1);mxd.setMonth(mxd.getMonth()+1,1);
  const span=mxd-mn||1;const X=d=>((parse(d)-mn)/span*100);const months=[];for(let d=new Date(mn);d<mxd;d.setMonth(d.getMonth()+1))months.push(new Date(d));
  const col=s=>s==='Complete'?'var(--good-ink)':s==='Delayed'?'var(--bad-ink)':s==='In progress'?'var(--warn-ink)':'var(--line-strong,#888)';

/* dark mode keeps the hero readable */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #top .topbar{background:linear-gradient(120deg,#0b2a52,#15508f 60%,#1d7894)}}
:root[data-theme="dark"] #top .topbar{background:linear-gradient(120deg,#0b2a52,#15508f 60%,#1d7894)}

@media (max-width:720px){#top .topbar{padding:16px 18px}#top .topbar h1{font-size:26px!important}#view .card.kpi .v{font-size:36px!important}}`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

/* count up KPI numbers and fade content in, only when the page (tab) changes */
let lastKey=null;
function countUp(root){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  root.querySelectorAll('.card.kpi .v').forEach(el=>{if(el.children.length)return;const raw=el.textContent.trim();const m=raw.match(/^(\d[\d,]*(?:\.\d+)?)(%?)$/);if(!m)return;
    const to=+m[1].replace(/,/g,''),suf=m[2],sep=/,/.test(m[1]),dec=(m[1].split('.')[1]||'').length;if(!to)return;const t0=performance.now(),d=850;
    const fmt=x=>(sep?Math.round(x).toLocaleString('en-GB'):x.toFixed(dec))+suf;
    const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(step);else el.textContent=raw};requestAnimationFrame(step)})}
const _render=render;render=function(){_render.apply(this,arguments);try{const v=document.getElementById('view');const key=(S.pid||'')+'/'+(S.tab||'');
  if(v&&key!==lastKey&&S.proj&&v.children.length&&!/Loading/.test(v.textContent.slice(0,40))){lastKey=key;v.classList.remove('ui-in');void v.offsetWidth;v.classList.add('ui-in');countUp(v);setTimeout(()=>v.classList.remove('ui-in'),900)}}catch(e){}};
})();
