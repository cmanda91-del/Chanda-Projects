<!doctype html><html><head><script src="/shim.js"></script><link rel="icon" href="data:,"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OHNEZ MEAL Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f4f4f2;--surface:#ffffff;--surface-alt:#f2f2f2;--surface-sunk:#ebebe8;--line:#e2e2de;--line-table:#999999;--line-strong:#7f7f7f;
  --ink:#141414;--ink-muted:#595959;--sci-red:#da291c;--red-ink:#b3261e;--red-soft:#fbe9e7;--on-red:#ffffff;
  --band-ir:#d9d9d9;--band-output:#f2dcdb;--flag-bg:#fde9d9;--input-bg:#fff2cc;
  --good-bg:#c6efce;--good-ink:#006100;--warn-bg:#ffeb9c;--warn-ink:#9c5700;--bad-bg:#ffc7ce;--bad-ink:#9c0006;--none-bar:#c9c9c4;
  --alert-bg:#f4b084;--focus:#000000;--shadow:0 1px 2px rgba(20,20,20,.05),0 4px 16px rgba(20,20,20,.04);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;
  --radius-sm:2px;--radius-md:4px;--radius-lg:8px;--radius-pill:999px;
  --font-sans:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0f0f0f;--surface:#181818;--surface-alt:#222222;--surface-sunk:#121212;--line:#2f2f2f;--line-table:#4a4a4a;--line-strong:#8a8a8a;
  --ink:#f2f2f2;--ink-muted:#b3b3b3;--red-ink:#ff7a6e;--red-soft:#3a1714;
  --band-ir:#3a3a3a;--band-output:#3d2422;--flag-bg:#4a2a26;--input-bg:#3d3415;
  --good-bg:#133d1f;--good-ink:#9be3ae;--warn-bg:#3f3205;--warn-ink:#f5cf5b;--bad-bg:#4a1219;--bad-ink:#ffb3bc;--none-bar:#4a4a4a;
  --alert-bg:#6b3a1a;--focus:#f2f2f2;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0f0f0f;--surface:#181818;--surface-alt:#222222;--surface-sunk:#121212;--line:#2f2f2f;--line-table:#4a4a4a;--line-strong:#8a8a8a;
  --ink:#f2f2f2;--ink-muted:#b3b3b3;--red-ink:#ff7a6e;--red-soft:#3a1714;
  --band-ir:#3a3a3a;--band-output:#3d2422;--flag-bg:#4a2a26;--input-bg:#3d3415;
  --good-bg:#133d1f;--good-ink:#9be3ae;--warn-bg:#3f3205;--warn-ink:#f5cf5b;--bad-bg:#4a1219;--bad-ink:#ffb3bc;--none-bar:#4a4a4a;
  --alert-bg:#6b3a1a;--focus:#f2f2f2;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--ink-muted)}.small{font-size:13px}.nowrap{white-space:nowrap}
.hide{display:none!important}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:var(--space-5) var(--space-3) var(--space-4)}
.brand{display:flex;align-items:center;gap:10px;padding:0 var(--space-2) var(--space-5);text-decoration:none;color:var(--ink)}
.brand-mark{width:30px;height:30px;border-radius:var(--radius-md);background:var(--sci-red);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px;flex:none}
.brand-mark i{background:var(--on-red);border-radius:1px;opacity:.95}.brand-mark i:nth-child(2){opacity:.55}.brand-mark i:nth-child(3){opacity:.55}
.brand b{font-size:16px;letter-spacing:.01em;display:block;line-height:1.1}.brand span{font-size:12px;color:var(--ink-muted)}
.side-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);padding:var(--space-3) var(--space-3) var(--space-2)}
.proj-pill{margin:0 var(--space-1) var(--space-2);padding:var(--space-3);border-radius:var(--radius-lg);background:var(--surface-alt)}
.proj-pill b{display:block;font-size:15px;line-height:1.2}.proj-pill span{font-size:12px;color:var(--ink-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px var(--space-3);border-radius:var(--radius-md);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;min-height:40px}
.nav a svg{width:18px;height:18px;flex:none;stroke:var(--ink-muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--surface-alt)}
.nav a[aria-current="page"]{background:var(--red-soft);color:var(--red-ink)}
.nav a[aria-current="page"] svg{stroke:var(--red-ink)}
.nav .count{margin-left:auto;font-size:12px;font-weight:700;min-width:22px;height:20px;padding:0 6px;border-radius:var(--radius-pill);background:var(--bad-bg);color:var(--bad-ink);display:inline-flex;align-items:center;justify-content:center}
.side-foot{margin-top:auto;padding:var(--space-3) var(--space-2) 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:var(--space-2)}
.main{min-width:0;padding:var(--space-5) var(--space-6) var(--space-6);max-width:1440px;width:100%}
.topbar{display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-5);align-items:flex-end;justify-content:space-between;margin-bottom:var(--space-5)}
.crumbs{font-size:13px;color:var(--ink-muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.crumbs a{color:var(--ink-muted);text-decoration:none}.crumbs a:hover{color:var(--red-ink);text-decoration:underline}
h1{margin:0;font-size:30px;line-height:1.12;letter-spacing:-.015em;font-weight:700}
.page-sub{color:var(--ink-muted);font-size:14px;margin-top:4px}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-2)}
.chips{display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:flex-end}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.card-pad{padding:var(--space-5)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3);padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:16px}
.card-h .small{color:var(--ink-muted)}
h2.sec{font-size:17px;margin:var(--space-6) 0 var(--space-3)}
.stack-v>*+*{margin-top:var(--space-5)}
.grid{display:grid;gap:var(--space-4)}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:var(--space-5)}
.g-res{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:700;white-space:nowrap;border:1px solid transparent;line-height:18px}
.t-good{background:var(--good-bg);color:var(--good-ink)}.t-warn{background:var(--warn-bg);color:var(--warn-ink)}.t-bad{background:var(--bad-bg);color:var(--bad-ink)}
.t-none{background:var(--surface-alt);color:var(--ink-muted);border-color:var(--line)}.t-alert{background:var(--alert-bg);color:var(--ink)}.t-flag{background:var(--flag-bg);color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:var(--radius-md);cursor:pointer;font-weight:700;min-height:38px;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-alt)}
.btn.primary{background:var(--sci-red);border-color:var(--sci-red);color:var(--on-red)}
.btn.primary:hover{filter:brightness(.94)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn[aria-busy="true"] svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn[aria-busy="true"] svg{animation:none}}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],select,textarea{background:var(--input-bg);border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:7px 10px;min-height:38px;max-width:100%}
input[readonly],select:disabled,input:disabled,textarea:disabled{background:var(--surface-alt);border-color:var(--line)}
textarea{width:100%;min-height:64px}
.empty{padding:var(--space-5);color:var(--ink-muted);font-style:italic;text-align:center}
.note{background:var(--flag-bg);padding:var(--space-2) var(--space-3);font-size:13px;border-radius:var(--radius-md);margin-top:var(--space-2)}
.banner{background:var(--input-bg);border:1px solid var(--line-strong);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);margin-bottom:var(--space-4);font-size:14px}
.toast{position:fixed;right:24px;bottom:24px;z-index:50;max-width:420px;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:var(--radius-lg);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;margin-bottom:var(--space-4)}
.toolbar .grow{flex:1 1 220px}
.lead{font-size:13px;color:var(--ink-muted);margin:0 0 var(--space-3);max-width:110ch}

/* ---------- KPI ---------- */
.kpi{padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:2px;min-height:118px}
.kpi .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);display:flex;align-items:center;gap:6px}
.kpi .l .dot{width:8px;height:8px}
.kpi.good .l .dot{color:var(--good-ink)}.kpi.warn .l .dot{color:var(--rag-y,#e6b800)}.kpi.bad .l .dot{color:var(--bad-ink)}.kpi.red .l .dot{color:var(--sci-red)}.kpi.none .l .dot{color:var(--none-bar)}
.kpi .v{font-size:36px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:6px}
.kpi .s{font-size:13px;color:var(--ink-muted);margin-top:auto}
.kpi .meter{height:4px;border-radius:var(--radius-pill);background:var(--surface-sunk);overflow:hidden;margin:8px 0 6px}
.kpi .meter i{display:block;height:100%;border-radius:var(--radius-pill)}

/* ---------- status bar (stacked) ---------- */
.sbar{display:flex;gap:2px;height:14px;border-radius:var(--radius-pill);overflow:hidden;background:var(--surface)}
.sbar span{display:block;height:100%;min-width:3px}
.sbar.lg{height:22px}
.s-good{background:var(--good-ink)}.s-warn{background:var(--rag-y,#e6b800)}.s-bad{background:var(--bad-ink)}.s-none{background:var(--none-bar)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-muted);margin-top:var(--space-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.hero{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:var(--space-6);align-items:center}
.hero-num{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hero-num small{font-size:20px;color:var(--ink-muted);font-weight:700}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:var(--space-4)}}

/* ---------- result cards ---------- */
.res{padding:var(--space-4) var(--space-5);cursor:pointer;display:flex;flex-direction:column;gap:var(--space-2);text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);width:100%}
.res:hover{border-color:var(--line-strong)}
.res .code{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red-ink)}
.res .name{font-weight:700;font-size:14.5px;line-height:1.3;min-height:38px}
.res .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-muted)}

/* ---------- lists ---------- */
.list{list-style:none;margin:0;padding:0}
.list li{padding:12px var(--space-5);border-bottom:1px solid var(--line);display:flex;gap:var(--space-3);justify-content:space-between;align-items:flex-start}
.list li:last-child{border-bottom:0}
.list li.click{cursor:pointer}.list li.click:hover{background:var(--surface-alt)}
.list .t{font-weight:700;font-size:14px}.list .d{font-size:13px;color:var(--ink-muted)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th{background:var(--surface-alt);color:var(--ink-muted);text-align:left;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:10px 12px;border-bottom:2px solid var(--sci-red);position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:not(.r-res):not(.r-out):nth-child(even) td{background:color-mix(in srgb,var(--surface-alt) 35%,var(--surface))}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.r-res td{background:var(--surface-sunk);font-weight:700;font-size:14px;padding-top:12px;padding-bottom:12px}
tr.r-res .rc{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-red);background:var(--sci-red);border-radius:var(--radius-sm);padding:1px 6px;margin-right:8px;vertical-align:1px}
tr.r-out td{font-style:italic;font-weight:700;color:var(--ink-muted);font-size:13px;background:var(--surface)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-alt)}
td.calc{background:color-mix(in srgb,var(--surface-alt) 55%,transparent)}
.bar{height:6px;background:var(--surface-sunk);border-radius:var(--radius-pill);overflow:hidden;width:84px;flex:none}
.bar i{display:block;height:100%;border-radius:var(--radius-pill)}
.pace{display:flex;gap:8px;align-items:center}
.cal td.m{text-align:center;padding:6px 4px;min-width:36px}
th.cur,td.cur{box-shadow:inset 0 0 0 2px var(--sci-red)}
.tick{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:700;font-size:12px;line-height:1;padding:0}
.tick.on{background:var(--good-bg);color:var(--good-ink);border-color:var(--good-ink)}
.tick.late{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-ink)}
.tick:disabled{cursor:default}

/* ---------- projects home ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:var(--space-5)}
.pcard{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);overflow:hidden;transition:border-color .15s}
.pcard:hover{border-color:var(--line-strong)}
.pcard .band{height:8px;background:var(--sci-red)}
.pcard .body{padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);flex:1}
.pcard h3{margin:0;font-size:20px;line-height:1.2}
.pcard .full{font-size:13px;color:var(--ink-muted);line-height:1.35}
.pcard .facts{display:flex;flex-wrap:wrap;gap:6px}
.pcard .stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:auto}
.pcard .stats div{padding:var(--space-3) var(--space-2);text-align:center;border-right:1px solid var(--line)}
.pcard .stats div:last-child{border-right:0}
.pcard .stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.pcard .stats span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:700}
.pcard.new{border:2px dashed var(--line-strong);box-shadow:none;background:transparent;align-items:center;justify-content:center;min-height:240px;cursor:pointer;gap:8px;font-weight:700;color:var(--ink-muted)}
.pcard.new:hover{color:var(--red-ink);border-color:var(--sci-red)}
.pcard.new .plus{font-size:34px;line-height:1}

/* ---------- upload ---------- */
.upload-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:var(--space-5);padding:var(--space-5)}
.drop{border:2px dashed var(--line-strong);border-radius:var(--radius-lg);background:var(--input-bg);padding:var(--space-5) var(--space-4);text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:160px;position:relative}
.drop.over{outline:3px solid var(--sci-red);outline-offset:-3px}
.drop b{font-size:16px}
.drop svg{width:28px;height:28px;stroke:var(--ink-muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.uplist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius-md);max-height:280px;overflow:auto}
.uplist li{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-size:14px}
.uplist li:last-child{border-bottom:0}
.preview{margin-top:var(--space-3);border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:var(--space-3);background:var(--surface)}
.preview .tw{box-shadow:none}
@media (max-width:860px){.upload-b{grid-template-columns:1fr}}

/* ---------- dialog / drawer ---------- */
dialog{border:0;padding:0;margin:0 0 0 auto;height:100vh;max-height:100vh;max-width:760px;width:min(760px,100%);background:var(--surface);color:var(--ink);border-radius:var(--radius-lg) 0 0 var(--radius-lg);box-shadow:-12px 0 48px rgba(0,0,0,.22);display:none;flex-direction:column}
dialog[open]{display:flex;animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
dialog::backdrop{background:rgba(10,10,10,.45)}
.dh{padding:var(--space-4) var(--space-5);display:flex;justify-content:space-between;gap:var(--space-3);align-items:flex-start;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:18px;line-height:1.3}
.dh .x{background:none;border:0;font-size:24px;cursor:pointer;line-height:1;min-width:36px;min-height:36px;border-radius:var(--radius-md);color:var(--ink-muted)}
.dh .x:hover{background:var(--surface-alt)}
.db{padding:var(--space-5);flex:1;overflow:auto}
.df{padding:var(--space-3) var(--space-5);border-top:1px solid var(--line);display:flex;gap:var(--space-2);justify-content:flex-end;align-items:center;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px;margin:var(--space-4) 0}
.meta dt{font-weight:700;color:var(--ink-muted)}.meta dd{margin:0}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--space-2)}
.months label{display:flex;flex-direction:column;font-size:12px;font-weight:700;color:var(--ink-muted);gap:3px}
.months label.due input{outline:2px solid var(--warn-ink)}
.months input{width:100%}
.ndt th,.ndt td{padding:6px 4px;text-align:center}.ndt td:first-child{text-align:left;white-space:nowrap;padding-left:10px}.ndt input{width:64px;min-height:32px;padding:4px 6px;text-align:right}.ndt td.due input{outline:2px solid var(--warn-ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--space-3)}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink-muted)}
.form .full{grid-column:1/-1}
.chart{position:relative;margin:var(--space-2) 0 var(--space-4)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}

:focus-visible{outline:2px solid var(--sci-red);outline-offset:2px;border-radius:4px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
.d2cell{border-radius:var(--r-xs);transition:background .3s var(--ease),border-color .3s var(--ease),box-shadow .16s var(--ease)}
.cl input[type=checkbox]{border-radius:6px;transition:background .16s var(--ease),border-color .16s var(--ease)}
/* visualizer bits */
.d2chip{border-radius:999px;box-shadow:0 1px 1px rgba(16,24,40,.04)}.d2cb{padding-left:12px}
.d2pop{border-radius:var(--r-md);box-shadow:0 12px 32px -8px rgba(16,24,40,.22),0 2px 6px rgba(16,24,40,.06);padding:6px;animation:pop .14s var(--ease)}
.d2pop button{border-radius:var(--r-xs)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.d2list{border-radius:var(--r-md)}.d2list button{border-radius:var(--r-xs)}.d2tree{border-radius:var(--r-md)}
.d2menu{border-radius:var(--r-lg);box-shadow:0 16px 48px -12px rgba(16,24,40,.3);animation:pop .16s var(--ease)}
.d2app{border-radius:var(--r-md);transition:background .14s var(--ease)}.d2ai{border-radius:12px}
.d2sv{border-radius:var(--r-lg)}.d2warn{border-radius:var(--r-md)}
.chart svg rect,.chart svg path.bar-a{shape-rendering:geometricPrecision}
/* drawer */
dialog{border-radius:var(--r-xl) 0 0 var(--r-xl);box-shadow:-20px 0 60px -10px rgba(16,24,40,.28)}
dialog::backdrop{background:rgba(16,24,40,.38);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.dh{border-radius:var(--r-xl) 0 0 0}.df{border-radius:0 0 0 var(--r-xl)}
.toast{border-radius:var(--r-md);box-shadow:0 12px 32px -8px rgba(16,24,40,.35);animation:pop .18s var(--ease)}
/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){.d2pop,.d2menu,.toast{animation:none}}
.tw td{vertical-align:middle}.mpt td,.lft td,.sar td{vertical-align:top}p.lead{max-width:none}
/* ---------- v1.2 aesthetics: tinted status cards, soft page wash, richer header band ---------- */
:root{--tint-good:#f1f9f1;--tint-warn:#fffbeb;--tint-bad:#fff5f5;--tint-blue:#f2f8fe;--tint-grey:#f8fafc;--wash:#eaf3fd;--th-grad:linear-gradient(180deg,#f3f8fd 0%,#eaf2fa 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tint-good:#15261b;--tint-warn:#28220f;--tint-bad:#2a1517;--tint-blue:#152536;--tint-grey:#18212b;--wash:#122233;--th-grad:linear-gradient(180deg,#1b2b3c 0%,#18263a 100%)}}
:root[data-theme="dark"]{--tint-good:#15261b;--tint-warn:#28220f;--tint-bad:#2a1517;--tint-blue:#152536;--tint-grey:#18212b;--wash:#122233;--th-grad:linear-gradient(180deg,#1b2b3c 0%,#18263a 100%)}
body{background:linear-gradient(180deg,var(--wash) 0px,var(--page) 380px) no-repeat,var(--page)}
.side{background:color-mix(in srgb,var(--surface) 88%,transparent)}
h1{font-size:30px;font-weight:500;letter-spacing:-.02em;color:var(--ink)}
.crumbs a{font-weight:500}
.topbar{margin-bottom:22px}
/* section headings */
h2.sec{font-size:17px;font-weight:500;gap:12px;margin:28px 0 14px}
h2.sec::before{width:8px;height:8px;border-radius:50%;background:var(--sci-red);box-shadow:0 0 0 4px var(--d2-blue100)}
.card-h h2{display:flex;align-items:center;gap:10px}
.card-h h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--d2-blue300);flex:none}
/* KPI tiles tinted by status */
.kpi{background:linear-gradient(180deg,var(--tint-grey) 0%,var(--surface) 70%)}
.kpi.good{background:linear-gradient(180deg,var(--tint-good) 0%,var(--surface) 70%)}
.kpi.warn{background:linear-gradient(180deg,var(--tint-warn) 0%,var(--surface) 70%)}
.kpi.bad{background:linear-gradient(180deg,var(--tint-bad) 0%,var(--surface) 70%)}
.kpi.red{background:linear-gradient(180deg,var(--tint-blue) 0%,var(--surface) 70%)}
.kpi .l{gap:10px}
.kpi .l .dot{width:10px;height:10px;box-shadow:0 0 0 5px color-mix(in srgb,currentColor 16%,transparent)}
.kpi .v{font-size:42px;font-weight:300;margin-top:10px}
.kpi .s{line-height:1.4}
/* overview banner */
.phead{background:radial-gradient(420px 220px at 92% -10%,rgba(144,202,249,.45),transparent 70%),radial-gradient(360px 200px at 70% 130%,rgba(197,227,252,.6),transparent 70%),linear-gradient(120deg,#f5fbff 0%,#e3f2fd 100%);border:1px solid var(--d2-blue100);box-shadow:var(--shadow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .phead{background:linear-gradient(120deg,#132638 0%,#183351 100%);border-color:#21405f}}
:root[data-theme="dark"] .phead{background:linear-gradient(120deg,#132638 0%,#183351 100%);border-color:#21405f}
.phead .chip{background:color-mix(in srgb,var(--surface) 80%,transparent)!important}
/* hero */
.hero2{background:radial-gradient(500px 240px at 0% 0%,var(--tint-blue),transparent 70%),var(--surface)}
.donut{width:168px;height:168px;box-shadow:0 0 0 8px var(--surface),0 6px 20px -8px rgba(16,24,40,.18)}
.donut>div{width:124px;height:124px}.donut b{font-size:32px;font-weight:400}
.hero-num{font-weight:300}
.sbar.lg{height:14px}.sbar{gap:3px}
/* result cards */
.res{background:linear-gradient(180deg,var(--tint-blue) 0%,var(--surface) 55%)}
.res .code{display:inline-flex;align-self:flex-start;padding:2px 10px;border-radius:999px;background:var(--d2-blue100);color:var(--d2-blue800);letter-spacing:.06em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .res .code{background:#1b3a5a;color:#cfe4fb}}:root[data-theme="dark"] .res .code{background:#1b3a5a;color:#cfe4fb}
/* steps */
.step{background:linear-gradient(180deg,var(--surface) 0%,var(--tint-grey) 100%)}
.step .n{width:30px;height:30px;box-shadow:0 0 0 4px var(--surface)}
/* tables */
.tw th{background:var(--th-grad)}
tr.r-res td{background:linear-gradient(90deg,var(--d2-blue100) 0%,var(--tint-blue) 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) tr.r-res td{background:#1c3349}}:root[data-theme="dark"] tr.r-res td{background:#1c3349}
tbody tr.click:hover td{background:var(--tint-blue)}
/* lists */
.list li{transition:background .14s var(--ease)}
.list li.click:hover{background:var(--tint-blue)}
/* toolbar + tabs */
.toolbar{background:color-mix(in srgb,var(--surface) 92%,transparent)}
.nav a[aria-current="page"]{background:linear-gradient(180deg,#e9f4fe 0%,var(--d2-blue100) 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav a[aria-current="page"]{background:#1b3a5a}}:root[data-theme="dark"] .nav a[aria-current="page"]{background:#1b3a5a}
/* visualizer canvas */
.d2canvas{background:radial-gradient(600px 200px at 50% 0%,var(--tint-blue),transparent 70%),var(--surface)}
.d2t h2{font-size:18px}


/* ---- v1.3 Data Visualizer gallery + GIS ---- */
:root{--map-land:#f4f1e8;--map-dot:#e6e0cf;--map-water:#dbe9f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--map-land:#1f2526;--map-dot:#2a3133;--map-water:#1b2a38}}
:root[data-theme="dark"]{--map-land:#1f2526;--map-dot:#2a3133;--map-water:#1b2a38}
.d2gal{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 10px}

.d2gb.on{background:linear-gradient(180deg,#e3effb,#d2e5f8);border-color:#8fbbe6;font-weight:600}
.d2gb.on svg{color:#14548f}
.d2gb:focus-visible{outline:2px solid #2f86cc;outline-offset:1px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .d2gb svg{color:#8fc3f0}:root:not([data-theme="light"]) .d2gb.on{background:#1d3550;border-color:#3d6c99}}
:root[data-theme="dark"] .d2gb svg{color:#8fc3f0}:root[data-theme="dark"] .d2gb.on{background:#1d3550;border-color:#3d6c99}
#d2tip{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;max-width:340px;padding:7px 10px;border-radius:8px;background:rgba(20,32,48,.94);color:#fff;font-size:12.5px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;transition:opacity .12s}
#d2tip.on{opacity:1}
#d2out [data-tip]{cursor:pointer}
#d2out .d2pop:hover,#d2out rect[data-tip]:hover,#d2out path[data-tip]:hover{filter:brightness(1.08) drop-shadow(0 2px 4px rgba(0,0,0,.18))}
/* entrance motion */
@keyframes d2grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes d2growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes d2pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes d2draw{from{stroke-dashoffset:2400}to{stroke-dashoffset:0}}
@keyframes d2fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.d2anim .d2grow{transform-box:fill-box;transform-origin:bottom;animation:d2grow .7s cubic-bezier(.2,.8,.2,1) both}
.d2anim .d2grow-x{transform-box:fill-box;transform-origin:left;animation:d2growx .7s cubic-bezier(.2,.8,.2,1) both}
.d2anim .d2pop{transform-box:fill-box;transform-origin:center;animation:d2pop .55s cubic-bezier(.2,.8,.2,1) both}
.d2anim .d2draw{stroke-dasharray:2400;animation:d2draw 1.3s ease-out both}
.d2anim .d2kc,.d2anim .d2sc,.d2anim .d2g,.d2anim .d2bl,.d2anim .d2mc{animation:d2fade .5s ease-out both}
.d2anim .d2kc:nth-child(2),.d2anim .d2g:nth-child(2),.d2anim .d2mc:nth-child(2),.d2anim .d2sc:nth-child(2){animation-delay:.05s}
.d2anim .d2kc:nth-child(3),.d2anim .d2g:nth-child(3),.d2anim .d2mc:nth-child(3),.d2anim .d2sc:nth-child(3){animation-delay:.1s}
.d2anim .d2kc:nth-child(n+4),.d2anim .d2g:nth-child(n+4),.d2anim .d2mc:nth-child(n+4),.d2anim .d2sc:nth-child(n+4){animation-delay:.15s}
@media (prefers-reduced-motion:reduce){.d2anim *{animation:none!important}}
.d2dash{display:inline-block;width:18px;height:0!important;border-top:2.5px dashed #1a237e;vertical-align:middle;background:none!important}
.d2tick{display:inline-block;width:3px!important;height:12px!important;background:var(--ink)!important;vertical-align:middle}

/* donut */

.d2dl i{width:12px;height:12px;border-radius:3px}.d2dl b{font-variant-numeric:tabular-nums}.d2dl li.z{opacity:.65}.d2dl li.z i{border:1.5px dashed var(--line-strong)}.d2dl em{font-style:normal;color:var(--ink-muted);text-align:right;font-variant-numeric:tabular-nums}
/* treemap / funnel labels */
.d2tml{font-size:14px;font-weight:600;fill:#fff}.d2tmv{font-size:13px;fill:#fff;opacity:.92}

.d2kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

.d2kh{font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:2px}.d2kh span{font-weight:400;color:var(--ink-muted);font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.d2kg{font-size:12.5px;color:var(--ink-muted)}.d2kg b.up,.up{color:#2e7d32}.d2kg b.dn,.dn{color:#c62828}
.d2kt{margin:auto -16px 0}.d2kt svg{display:block;width:100%;height:54px}
/* bullets */

.d2bn{display:flex;flex-direction:column;font-size:13px;line-height:1.25}.d2bn span{color:var(--ink-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.d2center{display:flex;justify-content:center}.d2radar svg{max-width:760px}
.d2lab{font-size:11.5px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px}

/* ---------- linked indicators: calculated live from other tracker data ---------- */
const OUTSIDE_PROJECT=['Eastern PHO','Ministry of Health'];

  const by=Object.fromEntries(raw.map(i=>[i.code,i]));const pm=periodMonth();
  return raw.map(i=>{if(!i.link)return i;const o=Object.assign({},i);const A={},N={},D={};

    if(i.link==='trainedHCW'){const {firstMonth}=trainingStats();const vals=Object.values(firstMonth);const last=Math.max(pm,...vals);

  if(nd)vals=nd.map(([m,n,d])=>[m,n/d]);else for(let m=1;m<=12;m++){const v=num(a[m]);if(v!==null)vals.push([m,v])}
  const r={vals,n:vals.length,last:vals.length?vals[vals.length-1][0]:0,cur:null,ach:null,pctAnnual:null,status:'nodata',label:'Awaiting data'};

  else if(vals.length){if(i.agg==='sum')r.cur=vals.reduce((s,x)=>s+x[1],0);else if(i.agg==='latest')r.cur=vals[vals.length-1][1];else r.cur=vals.reduce((s,x)=>s+x[1],0)/vals.length}

    if(i.partsAgg==='prepost'){const q=i.parts.filter(p=>num(p.pre)!==null&&num(p.post)!==null);const W=q.reduce((a,p)=>a+(num(p.n)||1),0);
      if(q.length){r.totPre=q.reduce((a,p)=>a+num(p.pre)*(num(p.n)||1),0)/W;r.totPost=q.reduce((a,p)=>a+num(p.post)*(num(p.n)||1),0)/W;r.totN=W;r.cur=Math.round((r.totPost-r.totPre)*100)/100;r.partsAvg=true;r.partsN=q.length}}
    else if(pv.length){let av=pv.reduce((a,p)=>a+num(p.value),0)/(i.partsAgg==='sum'?1:pv.length);if(i.unit==="count")av=Math.round(av);else if(i.unit!=="percent")av=Math.round(av*100)/100;r.cur=av;r.partsAvg=true;r.partsN=pv.length}}
  if(num(i.curOverride)!==null){r.cur=num(i.curOverride);r.manual=true;r.partsAvg=false}
  r.dq=[];const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if(nd){const ov=nd.filter(x=>x[1]>x[2]).map(x=>MN[x[0]-1]);if(ov.length)r.dq.push('Numerator exceeds denominator in '+ov.join(', ')+' – rate is above 100%; check the source registers.')}

  if(t!==null&&b!==null&&b>0&&i.freq!=='survey'){if(i.direction==='increase'&&t<b)r.dq.push('Target ('+fmt(i,t)+') is below baseline ('+fmt(i,b)+') for an indicator that should increase – confirm the target.');if(i.direction==='decrease'&&t>b)r.dq.push('Target is above baseline for an indicator that should decrease – confirm the target.')}
  if(i.freq==='monthly'&&!i.link&&t!==null&&t!==0){const pm=periodMonth();const miss=[];for(let m=1;m<=pm;m++)if(!vals.some(x=>x[0]===m))miss.push(MN[m-1]);if(miss.length&&vals.length)r.dq.push('No value for '+miss.join(', ')+(i.agg==='sum'?' – counted as zero in the pace calculation.':'.'))}
  if(i.freq==='survey'){r.status='survey';r.label='Baseline / endline';if(r.cur!==null&&t)r.pctAnnual=r.cur/t;return r}
  if(t===null||(t===0&&(b===null||b===0))){r.status='notarget';r.label='No target set';return r}
  if(r.partsAvg){r.ach=i.direction==='decrease'?(r.cur===0?2:t/r.cur):r.cur/t;r.pctAnnual=r.cur/t;r.label=r.ach>=cfg.green?RAG.g:r.ach>=cfg.amber?RAG.y:ragRed(i);r.status=r.ach>=cfg.green?'good':r.ach>=cfg.amber?'warn':'bad';return r} /* average of sub-targets: compared directly with the target */
  if(!vals.length&&r.cur===null)return r;

   ${S.canEdit?`<dt>Override current</dt><dd><span class="tgtw"><input id="curIn" type="number" step="any" min="0" inputmode="decimal" aria-label="Override current value${i.unit==='percent'?' (%)':''}" value="${num(i.curOverride)===null?'':(i.unit==='percent'?+(i.curOverride*100).toFixed(2):i.curOverride)}" placeholder="auto" oninput="previewEdits('${i.id}')">${i.unit==='percent'?'<span>%</span>':''}</span> <span class="small muted">leave blank to use the ${i.parts?'training average':'monthly values'}</span></dd>`:''}
   <dt>Responsible officer</dt><dd>${S.canEdit?`<select id="ownIn" aria-label="Responsible officer" style="max-width:100%">${opt(['',...new Set([...(i.owner&&!owners().includes(i.owner)?[i.owner]:[]),...owners()])],i.owner||'')}</select>`:esc(i.owner||'–')}</dd>

   <dt>Baseline</dt><dd>${i.baseline===null||i.baseline===undefined?'<span class="muted">Blank – not yet available</span>':fmt(i,i.baseline)}${i.baselineSource?`<div class="small muted">${esc(i.baselineSource)}</div>`:''}</dd>
   <dt>Y1 target</dt><dd>${i.targetRule?`<div class="small muted">Rule: ${esc(i.targetRule)}${i.targetPrev!==undefined&&i.targetPrev!==null?` (was ${fmt(i,i.targetPrev)})`:''}</div>`:''}${i.parts&&i.partsAgg!=='sum'&&i.parts.some(p=>p.target!=null)?`<span id="tgtAvg">${fmt(i,i.target)}</span> <span class="small muted">average of the training targets below</span>`:S.canEdit?`<span class="tgtw"><input id="tgtIn" type="number" step="any" min="0" inputmode="decimal" aria-label="Y1 target${pctU?' (%)':''}" value="${i.target===null||i.target===undefined?'':(pctU?+(i.target*100).toFixed(2):+(+i.target).toFixed(2))}" placeholder="${esc(i.targetText||'No target')}" oninput="previewEdits('${i.id}')">${pctU?'<span>%</span>':''}</span> <span class="small muted">${isLimit(i)?'ceiling for the year':'annual'} – status updates as you type; click Save to keep it</span>${i.targetPrev!==undefined?`<div class="small muted">Changed ${esc(i.targetEditedOn||'')} from ${i.targetPrev===null?'no target':fmt(i,i.targetPrev)}</div>`:''}`:(i.target===null?esc(i.targetText||'–'):fmt(i,i.target))}</dd>
   <dt>Definition</dt><dd>${esc(i.definition)}</dd><dt>Collection</dt><dd>${esc(i.freqText)}</dd><dt>Means of verification</dt><dd>${esc(i.mov)}</dd><dt>Data source</dt><dd>${esc(i.dataSource||'Manual entry')}</dd></dl>
   ${i.parts?partsTable(i,c):''}
   ${i._derived?`<div class="note" style="background:var(--good-bg);color:var(--good-ink)"><b>Connected:</b> ${esc(i._derived)}. Values update automatically – edit the source data instead.</div>`:''}
   ${i.flag?`<div class="note"><b>Data note:</b> ${esc(i.flag)}</div>`:''}
   ${pctU?`<h3 style="font-size:15px;margin:var(--space-5) 0 var(--space-2)">Monthly numerator and denominator <span class="muted small">(the % is calculated – ${esc(i.numLabel||'numerator')} ÷ ${esc(i.denLabel||'denominator')})</span></h3>
   <div class="tw" style="box-shadow:none"><table class="ndt"><thead><tr><th></th>${M.map(m=>`<th class="num">${m}</th>`).join('')}</tr></thead><tbody>
    <tr><td><b>Numerator</b></td>${M.map((m,k)=>`<td class="${k+1===dueM&&num((i.num||{})[k+1])===null?'due':''}"><input type="number" step="any" min="0" inputmode="decimal" aria-label="${m} numerator" data-n="${k+1}" value="${num((i.num||{})[k+1])??''}" ${dis()} oninput="ndPreview()"></td>`).join('')}</tr>
    <tr><td><b>Denominator</b></td>${M.map((m,k)=>`<td><input type="number" step="any" min="0" inputmode="decimal" aria-label="${m} denominator" data-d="${k+1}" value="${num((i.den||{})[k+1])??''}" ${dis()} oninput="ndPreview()"></td>`).join('')}</tr>
    <tr><td class="muted">%</td>${M.map((m,k)=>`<td class="num muted" data-p="${k+1}"></td>`).join('')}</tr></tbody></table></div>`
   :`<h3 style="font-size:15px;margin:var(--space-5) 0 var(--space-2)">Monthly values</h3>
   <div class="months">${M.map((m,k)=>{const v=num(a[k+1]);const sv=v===null?'':v;return `<label class="${k+1===dueM&&v===null&&i.freq==='monthly'?'due':''}">${m}${k+1===dueM?' · due':''}<input type="number" step="any" inputmode="decimal" data-m="${k+1}" value="${sv}" ${dis()}></label>`}).join('')}</div>`}`;
  if(i._derived)document.querySelectorAll('#dlgB input:not(#tgtIn):not(#curIn)').forEach(e=>e.disabled=true);
  document.getElementById('dlgF').innerHTML=i._derived?`<span class="small muted" style="margin-right:auto">Values are calculated automatically.</span><button class="btn" onclick="dlg.close()">Close</button>${S.canEdit?`<button class="btn primary" onclick="saveTarget('${i.id}')">Save target</button>`:''}`:S.canEdit?`<span class="small muted" style="margin-right:auto">Leave a month blank if not yet reported.</span><button class="btn ghost" onclick="editIndDetails('${i.id}')">✎ Edit indicator</button><button class="btn" onclick="dlg.close()">Cancel</button><button class="btn primary" onclick="saveInd('${i.id}')">Save</button>`:`<span class="small muted" style="margin-right:auto">View only.</span><button class="btn" onclick="dlg.close()">Close</button>`;
  dlg.showModal();wireChart();if(pctU)ndPreview();
}
function ndPreview(){document.querySelectorAll('#dlgB [data-p]').forEach(td=>{const m=td.dataset.p;const n=parseFloat(document.querySelector(`#dlgB [data-n="${m}"]`).value),d=parseFloat(document.querySelector(`#dlgB [data-d="${m}"]`).value);td.textContent=isFinite(n)&&isFinite(d)&&d>0?(+(n/d*100).toFixed(1))+'%':''})}
function partsTable(i,c){const tr=i.code==='R1-10'?trainedByCode():{};
  if(i.partsAgg==='prepost')return `<h3 style="font-size:15px;margin:var(--space-5) 0 var(--space-2)">By training <span class="muted small">(current = total post-test − total pre-test, weighted by participants)</span></h3>
  <div class="tw" style="box-shadow:none"><table class="ptab2"><thead><tr><th>Training</th><th class="num">n</th><th class="num">Pre-test %</th><th class="num">Post-test %</th><th class="num">Change (points)</th></tr></thead><tbody>${i.parts.map((p,k)=>`<tr><td><b>${esc(p.name)}</b> <span class="muted small">${esc(p.key)}</span></td>
   <td class="num"><span class="tgtw"><input type="number" step="1" min="0" data-pn="${k}" value="${p.n??''}" ${dis()} oninput="previewEdits('${i.id}')" aria-label="${esc(p.name)} participants" style="width:64px"></span></td>
   <td class="num"><span class="tgtw"><input type="number" step="any" min="0" max="100" data-ppre="${k}" value="${p.pre??''}" ${dis()} oninput="previewEdits('${i.id}')" aria-label="${esc(p.name)} pre-test"></span></td>
   <td class="num"><span class="tgtw"><input type="number" step="any" min="0" max="100" data-ppost="${k}" value="${p.post??''}" ${dis()} oninput="previewEdits('${i.id}')" aria-label="${esc(p.name)} post-test"></span></td>
   <td class="num calc" id="pst${k}">${p.pre!=null&&p.post!=null?(p.post-p.pre>=0?'+':'')+(p.post-p.pre).toFixed(1):'–'}</td></tr>`).join('')}
   <tr class="tot"><td><b>Total</b></td><td class="num" id="ppN">${c.totN??'–'}</td><td class="num" id="ppPre"><b>${c.totPre!=null?c.totPre.toFixed(1):'–'}</b></td><td class="num" id="ppPost"><b>${c.totPost!=null?c.totPost.toFixed(1):'–'}</b></td><td class="num" id="ppCh"><b>${c.cur!=null?(c.cur>=0?'+':'')+c.cur.toFixed(1):'–'}</b></td></tr></tbody></table></div>`;
  return `<h3 style="font-size:15px;margin:var(--space-5) 0 var(--space-2)">By ${esc(i.partsLabel||'training')} <span class="muted small">(current = ${i.partsAgg==='sum'?'sum':'average'} of the ${esc(i.partsLabel||'training')}s with a value)</span></h3>
  <div class="tw" style="box-shadow:none"><table class="ptab2"><thead><tr><th>${esc(i.partsLabel==='area'?'Mentorship area':i.partsLabel==='round'?'Round':'Training')}</th><th class="num">Target</th><th class="num">Current</th><th>Status</th></tr></thead><tbody>${c.parts.map((p,k)=>`<tr><td><b>${esc(p.name)}</b> <span class="muted small">${esc(p.key)}</span>${p.note?`<div class="small muted">${esc(p.note)}</div>`:''}${tr[p.key]!==undefined?`<div class="small muted">Trainings Tracker: ${tr[p.key]} HCWs (PHO/MoH excluded)</div>`:''}</td>
   <td class="num"><span class="tgtw"><input type="number" step="any" min="0" data-pt="${k}" value="${p.target??''}" ${dis()} oninput="previewEdits('${i.id}')" aria-label="${esc(p.name)} target"></span></td>
   <td class="num"><span class="tgtw"><input type="number" step="any" min="0" data-pv="${k}" value="${p.value??''}" ${dis()} oninput="previewEdits('${i.id}')" aria-label="${esc(p.name)} current" placeholder="–"></span></td>
   <td id="pst${k}">${p.v===null?'<span class="muted small">Not yet</span>':p.status==='notarget'?'<span class="muted small">Counted</span>':chip(TONE[p.status],pct(p.ach)+' of target')}</td></tr>`).join('')}</tbody></table></div>`}
function trainedByCode(){const o={};for(const t of S.trainings){const ids=new Set((t.participants||[]).filter(p=>p.pid&&!OUTSIDE_PROJECT.includes(p.facility)).map(p=>p.pid));o[t.code]=ids.size}return o}
function readEdits(i){const out={};const pc=i.unit==='percent'?100:1;const n=s=>s===''?null:Number(s);
  const tEl=document.getElementById('tgtIn');let tv=tEl?n(tEl.value.trim()):undefined;if(tv!==undefined&&tv!==null)tv/=pc;
  if(i.parts&&i.partsAgg==='prepost'){const P=i.parts.map((p,k)=>{const g=a=>n(document.querySelector(`[data-${a}="${k}"]`).value.trim());const pre=g('ppre'),post=g('ppost');const nn=g('pn');return Object.assign({},p,{n:nn,pre,post,value:pre!==null&&post!==null?Math.round((post-pre)*10)/10:null,note:pre!==null&&post!==null?`pre ${pre.toFixed(1)}% → post ${post.toFixed(1)}%${nn?` (n=${nn})`:''}`:(p.note||'')})});
    if(P.some(p=>[p.pre,p.post,p.n].some(v=>v!==null&&(!isFinite(v)||v<0)))){toast('Enter valid numbers');return null}out.parts=P}
  else if(i.parts){const P=i.parts.map((p,k)=>Object.assign({},p,{target:n(document.querySelector(`[data-pt="${k}"]`).value.trim()),value:n(document.querySelector(`[data-pv="${k}"]`).value.trim())}));
    if(P.some(p=>(p.target!==null&&(!isFinite(p.target)||p.target<0))||(p.value!==null&&(!isFinite(p.value)||p.value<0)))){toast('Enter valid numbers');return null}
    out.parts=P;if(i.partsAgg!=='sum'){const ts=P.filter(p=>p.target!==null);tv=ts.length?ts.reduce((a,p)=>a+p.target,0)/ts.length:tv}}
  if(tv!==undefined){if(tv!==null&&(!isFinite(tv)||tv<0)){toast('Enter a valid target');return null}
    const old=i.target===undefined?null:i.target;if(!(tv===old||(tv!==null&&old!==null&&Math.abs(tv-old)<1e-9)))Object.assign(out,{target:tv,targetText:tv===null?'':String(pc===100?+(tv*100).toFixed(2)+'%':+tv.toFixed(2)),targetPrev:old,targetEditedOn:iso(today())})}
  const oEl=document.getElementById('ownIn');if(oEl&&oEl.value!==(i.owner||''))out.owner=oEl.value;
  const cEl=document.getElementById('curIn');if(cEl){let cv=n(cEl.value.trim());if(cv!==null){if(!isFinite(cv)||cv<0){toast('Enter a valid current value');return null}cv/=pc}
    const oc=num(i.curOverride);if(cv!==oc)out.curOverride=cv}
  return out}
function readTarget(i){return readEdits(i)}
function previewEdits(id){const i=S.ind.find(x=>x.id===id);const e=readEdits(i);if(!e)return;const j=Object.assign({},i,e);const c=calc(j);
  document.getElementById('stPrev').innerHTML=stChip(c);document.getElementById('curPrev').innerHTML=curPill(j,c);
  if(i.partsAgg==='prepost'){const P=j.parts||[];P.forEach((p,k)=>{const el=document.getElementById('pst'+k);if(el)el.textContent=p.pre!=null&&p.post!=null?(p.post-p.pre>=0?'+':'')+(p.post-p.pre).toFixed(1):'–'});const f=v=>v==null?'–':v.toFixed(1);document.getElementById('ppN').textContent=c.totN??'–';document.getElementById('ppPre').innerHTML='<b>'+f(c.totPre)+'</b>';document.getElementById('ppPost').innerHTML='<b>'+f(c.totPost)+'</b>';document.getElementById('ppCh').innerHTML='<b>'+(c.cur==null?'–':(c.cur>=0?'+':'')+c.cur.toFixed(1))+'</b>';return}
  if(i.parts){const ta=document.getElementById('tgtAvg');if(ta)ta.textContent=fmt(j,j.target);(c.parts||[]).forEach((p,k)=>{const el=document.getElementById('pst'+k);if(el)el.innerHTML=p.v===null?'<span class="muted small">Not yet</span>':p.status==='notarget'?'<span class="muted small">Counted</span>':chip(TONE[p.status],pct(p.ach)+' of target')})}}
const tgtPreview=previewEdits;
function saveTarget(id){const i=S.ind.find(x=>x.id===id);const t=readTarget(i);if(t===null)return;dlg.close();if(Object.keys(t).length)write(()=>db.doc(dp('indicators',id)).update(t))}
function saveInd(id){const i=S.ind.find(x=>x.id===id);const T=readTarget(i);if(T===null)return;
  if(i.unit==='percent'){const N={},D={},A={};let bad=false;
    for(let m=1;m<=12;m++){const ns=document.querySelector(`#dlgB [data-n="${m}"]`).value.trim(),ds=document.querySelector(`#dlgB [data-d="${m}"]`).value.trim();
      N[m]=ns===''?null:Number(ns);D[m]=ds===''?null:Number(ds);if((N[m]===null)!==(D[m]===null))bad=true;A[m]=N[m]!==null&&D[m]?N[m]/D[m]:null}
    const blank=Object.values(N).every(v=>v===null)&&Object.values(D).every(v=>v===null);
    if(blank&&!(i.num||i.den)){dlg.close();if(Object.keys(T).length)write(()=>db.doc(dp('indicators',id)).update(T));return} /* rate entered without numerator/denominator: keep its values */
    if(bad&&!confirm('Some months have only a numerator or only a denominator – those months will not count. Save anyway?'))return;
    dlg.close();write(()=>db.doc(dp('indicators',id)).update(Object.assign({num:N,den:D,actuals:A},T)));return}
  const out={};document.querySelectorAll('#dlgB input[data-m]').forEach(el=>{const s=el.value.trim();out[el.dataset.m]=s===''?null:Number(s)});
  dlg.close();write(()=>db.doc(dp('indicators',id)).update(Object.assign({actuals:out},T)))}
function exportCsv(){
  const rows=[['Code','Result','Output','Indicator','Unit','Direction','Baseline','Target',...M,'Current','YTD numerator','YTD denominator','% of annual target','Status']];
  for(const i of S.ind){const c=calc(i);const a=i.actuals||{};const sc=v=>v===null||v===undefined?'':(i.unit==='percent'?+(v*100).toFixed(2):+(+v).toFixed(2));
    rows.push([i.code,i.result,i.output,i.name,i.unit,i.direction,i.baseline===null?i.baselineText:sc(i.baseline),i.target===null?i.targetText:sc(i.target),...M.map((_,k)=>sc(num(a[k+1]))),sc(c.cur),c.nd?c.nsum:'',c.nd?c.dsum:'',c.pctAnnual===null?'':Math.round(c.pctAnnual*100)+'%',c.label])}
  const csv=rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
  const name=(S.proj.name||'IPTT').replace(/[^A-Za-z0-9]+/g,'_')+'_IPTT_'+iso(today())+'.csv';
  if(downloads){downloads.save({filename:name,data:csv}).catch(()=>{})}else{const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const l=document.createElement('a');l.href=u;l.download=name;l.click()}
}

<script>
/* ---------- DHIS2-style apps menu + Data Visualizer ---------- */
ICON.viz='<rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="17" rx="1"/>';
TABS.splice(1,0,['viz','Data Visualizer']);
NAVG.forEach(g=>{const k=g[1].indexOf('iptt');if(k>=0)g[1].splice(k+1,0,'viz')});
TABHELP.viz='';
COLS.push(['datavalues','dvals',(a,b)=>(a.order||0)-(b.order||0)],['visualizations','vizs',(a,b)=>String(b.at||'').localeCompare(String(a.at||''))]);
S.dvals=S.dvals||[];S.vizs=S.vizs||[];

/* apps menu */
const APPS=[['overview','Dashboard','Project status at a glance'],['viz','Data Visualizer','Pivot tables and charts by data, period and org unit'],['iptt','Data Entry (IPTT)','Monthly indicator values, targets and status'],['sources','Import / Export','DHIS2 extracts, files and linked sources'],['lf','Logframe','Year 1 totals against targets'],['mealplan','MEAL Plan','Indicator reference sheet and theory of change'],['act','Work Plan','Activities by month'],['cal','MEAL Calendar','Recurring MEAL tasks'],['actions','Action Tracker','Follow-up actions from RDQA, SQA and reviews'],['frm','Feedback (FRM)','Complaints and feedback log'],['bm','Quality Benchmarks','Quarterly standards'],['checks','Checklists','Monthly routine and benchmark checks'],['ev','Evidence Readiness','Evidence for reporting'],['train','Trainings Tracker','Participants and pre/post scores'],['sar','Reports','Semi-annual report tables'],['notify','Messaging','WhatsApp alerts and weekly summaries']];
function toggleApps(force){const m=document.getElementById('d2menu');if(!m)return;const open=force!==undefined?force:m.hidden;m.hidden=!open;const b=document.getElementById('d2appsBtn');if(b)b.setAttribute('aria-expanded',String(open));if(open){const q=document.getElementById('d2appq');q.value='';renderApps('');q.focus()}}
function renderApps(q){const pid=S.pid||(S.projects[0]&&S.projects[0].id);const L=APPS.filter(a=>!q||(a[1]+' '+a[2]).toLowerCase().includes(q.toLowerCase()));
  document.getElementById('d2apl').innerHTML=!pid?'<div class="empty">Open a project first.</div>':L.length?L.map(([k,n,d])=>`<a href="#/${pid}/${k}" class="d2app" onclick="toggleApps(false)" title="${esc(d)}"><span class="d2ai">${ic(k)}</span><span class="d2an">${esc(n)}</span></a>`).join(''):'<div class="empty">No apps match.</div>'}
document.addEventListener('click',e=>{const m=document.getElementById('d2menu');if(m&&!m.hidden&&!e.target.closest('#d2menu,#d2appsBtn'))toggleApps(false)});

/* dimensions */
const D2PAL=['#2b6cb0','#2f9e6e','#e07b39','#8e5cc4','#d64d6f','#1aa3b5','#c99a1c','#5a6f8f','#7cae3c','#b4523a','#4f97e3','#a46fd1'];
const DV_TYPES=[['pivot','Pivot table'],['column','Column'],['stacked','Stacked column'],['bar','Bar'],['line','Line'],['single','Single value']];
const DIMN={dx:'Data',pe:'Period',ou:'Organisation unit'};
const REL=[['LAST_MONTH','Last month'],['LAST_3_MONTHS','Last 3 months'],['LAST_6_MONTHS','Last 6 months'],['MONTHS_THIS_YEAR','Months this year'],['THIS_QUARTER','This quarter'],['LAST_QUARTER','Last quarter'],['QUARTERS_THIS_YEAR','Quarters this year'],['THIS_YEAR','This year']];
const rng=(a,b)=>{const o=[];for(let k=Math.max(1,a);k<=b;k++)o.push(k);return o};
function dvInit(){if(S.dv)return;S.dv={type:'pivot',cols:['pe'],rows:['dx'],filters:['ou'],dx:['i:G-01','i:G-02','i:G-03','i:G-04','i:R1-08'],pe:['MONTHS_THIS_YEAR'],ou:['LUM'],legend:true,hideEmpty:false,name:'',id:null}}
function districtName(){return String((S.proj&&S.proj.location)||'District').split(',')[0].trim()}
function facilities(){const f=new Set(typeof FAC_GEO!=='undefined'?Object.keys(FAC_GEO):[]);(S.dvals||[]).forEach(d=>Object.keys(d.values||{}).forEach(k=>f.add(k)));const rank=n=>/hospital/i.test(n)?0:/rural health|rhc/i.test(n)?1:2;return [...f].sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b))}
const ouName=id=>id==='LUM'?districtName():id.replace(/^F:/,'');
function lastM(){let m=0;(S.dvals||[]).forEach(d=>Object.values(d.values||{}).forEach(o=>Object.keys(o).forEach(k=>{if(+k>m)m=+k})));S.ind.forEach(i=>{for(let k=12;k>m;k--)if(num((i.actuals||{})[k])!==null){m=k;break}});return Math.min(12,Math.max(1,m||periodMonth()))}
function peExpand(id){const lm=lastM(),q=Math.ceil(lm/3);

/* the app */
function vViz(){dvInit();const c=S.dv;const P=dvProblems();
  const dims=['dx','pe','ou'].map(d=>`<li><button type="button" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${d}')" onclick="dvDlg('${d}')"><span class="d2dot ${c[d].length?'on':''}"></span>${d==='ou'?'Org unit':DIMN[d]}<span class="small muted">${c[d].length||''}</span></button></li>`).join('');
  let out='';if(P.length)out=`<div class="d2warn">${P.map(esc).join('<br>')}</div>`;else out=dvRender();
  const legendKey=c.legend&&c.dx.some(x=>x.startsWith('i:'))?`<div class="d2key"><span class="small muted">Legend – by Year 1 target:</span>${chip('t-good','On track / Low')}${chip('t-warn','Needs attention')}${chip('t-orange','Moderate (deaths, LBW, MUAC)')}${chip('t-bad','Off track / High')}</div>`:'';
  return `<div class="d2dv ${c.hideDims?'nodims':''}">
   <aside class="d2side card"><div class="d2sh">Dimensions</div><ul class="d2dims">${dims}</ul>
    <div class="d2sh">Saved favourites</div><ul class="d2fav">${(S.vizs||[]).map(v=>`<li><button type="button" onclick="dvOpen('${v.id}')" title="${esc(v.name)}">${ic(v.type==='pivot'?'mealplan':'viz')}<span>${esc(v.name)}</span></button></li>`).join('')||'<li class="small muted" style="padding:6px 10px">None saved yet.</li>'}</ul></aside>
   <section class="d2main">
    <div class="d2bar2 card"><button class="btn ghost sm" onclick="dvSet('hideDims',!S.dv.hideDims)" title="${c.hideDims?'Show':'Hide'} the dimensions panel" aria-pressed="${!c.hideDims}">${c.hideDims?'☰ Dimensions':'‹ Hide'}</button><label class="d2type">${ic(c.type==='pivot'?'mealplan':'viz')}<select aria-label="Visualization type" onchange="dvPick(this.value)">${dvTypeOpts(c.type)}</select></label>
     <button class="btn primary" onclick="render();toast('Visualization updated')">Update</button>
     <details class="d2menu2"><summary class="btn ghost">File</summary><div class="d2pop"><button onclick="dvNew()">New</button><button onclick="dvOpenDlg()">Open…</button>${S.canEdit?`<button onclick="dvSave(false)">Save</button><button onclick="dvSave(true)">Save as…</button>${c.id?'<button onclick="dvDelete()">Delete</button>':''}`:''}</div></details>
     <details class="d2menu2"><summary class="btn ghost">Options</summary><div class="d2pop d2opts"><label><input type="checkbox" ${c.legend?'checked':''} onchange="dvSet('legend',this.checked)"> Colour values by target (legend)</label><label><input type="checkbox" ${c.hideEmpty?'checked':''} onchange="dvSet('hideEmpty',this.checked)"> Hide empty rows</label></div></details>
     <details class="d2menu2"><summary class="btn ghost">${ic('dl')} Download</summary><div class="d2pop"><button onclick="dvDownload('xlsx')">Excel (.xlsx)</button><button onclick="dvDownload('csv')">CSV</button></div></details>
     <span class="grow"></span><button class="btn ghost" onclick="dvSet('hidePanels',!S.dv.hidePanels)" aria-pressed="${!!c.hidePanels}" title="${c.hidePanels?'Show':'Hide'} the gallery and layout">${c.hidePanels?'☰ Layout':'⌃ Hide layout'}</button><button class="btn ghost" onclick="dvSwap()" title="Swap columns and rows">⇄ Swap</button><button class="btn ${c.focus?'primary':'ghost'}" onclick="dvFocus()" title="Focus on the visual (Esc to exit)">${c.focus?'✕ Exit focus':'⛶ Focus'}</button></div>
    ${c.hidePanels||c.focus?'':dvGallery()}<div class="d2layout card" ${c.hidePanels||c.focus?'hidden':''}>${dvArea('cols','Columns')}${dvArea('rows','Rows')}${dvArea('filters','Filter')}</div>
    <div class="card d2canvas"><div class="d2t"><h2>${esc(dvTitle())}</h2>${dvSub()?`<div class="small muted">${esc(dvSub())}</div>`:''}</div><div id="d2out" class="d2anim">${out}</div>${P.length?'':dvMissNote()}${legendKey}
     </div></div>
   </section></div>`}

/* dimension dialogs */
function dvDlg(d){S._sel=S.dv[d].slice();S._dim=d;S._grp=d==='dx'?(S._grp&&['ind','de'].includes(S._grp)?S._grp:'ind'):d==='pe'?'rel':'';S._q='';
  document.getElementById('dlgT').textContent=DIMN[d];
  const grp=d==='dx'?`<select id="dvg" aria-label="Data type" onchange="S._grp=this.value;dvList()"><option value="ind">Indicators (IPTT)</option><option value="de">Data elements (DHIS2)</option></select>`:d==='pe'?`<select id="dvg" aria-label="Period type" onchange="S._grp=this.value;dvList()"><option value="rel">Relative periods</option><option value="M">Monthly</option><option value="Q">Quarterly</option><option value="Y">Yearly</option></select>`:`<div class="d2lvl"><span class="small muted">Select a level:</span><button class="btn sm" onclick="S._sel=['LUM'];dvList()">District</button><button class="btn sm" onclick="S._sel=facilities().map(f=>'F:'+f);dvList()">Facility</button></div>`;
  document.getElementById('dlgB').innerHTML=d==='ou'?`${grp}<ul class="d2tree" id="dvav"></ul><p class="small muted">${facilities().length?facilities().length+' facilities from the DHIS2 export. IPTT indicators are district-level only.':'No facility data loaded yet.'}</p>`
   :`<div class="d2xfer"><div class="d2xa"><div class="d2xh">${grp}<input type="search" id="dvq" placeholder="Search" aria-label="Search" oninput="S._q=this.value;dvList()"></div><ul class="d2list" id="dvav"></ul><button class="btn sm" onclick="dvAll()">Select all</button></div>
     <div class="d2xa"><div class="d2xh"><b>Selected</b><button class="btn sm ghost" onclick="S._sel=[];dvList()">Deselect all</button></div><ul class="d2list sel" id="dvsel"></ul><span class="small muted">Click an item to add or remove it. Order here is the order in the table.</span></div></div>`;
  const g=document.getElementById('dvg');if(g&&g.tagName==='SELECT')g.value=S._grp;
  document.getElementById('dlgF').innerHTML=`<button class="btn" onclick="dlg.close()">Hide</button><button class="btn primary" onclick="dvApply()">Update</button>`;
  dlg.showModal();dvList()}
function dvAvail(){const d=S._dim,g=S._grp;
  if(d==='dx')return g==='de'?(S.dvals||[]).map(x=>({id:'d:'+x.id,name:x.name,sub:x.domain})):S.ind.map(i=>({id:'i:'+i.id,name:i.code+' '+i.name,sub:i.result}));
  if(g==='rel')return REL.map(([k,l])=>({id:k,name:l}));if(g==='M')return rng(1,12).map(m=>({id:'M'+m,name:peName('M'+m)}));if(g==='Q')return rng(1,4).map(q=>({id:'Q'+q,name:peName('Q'+q)}));return [{id:'Y',name:String(YEAR)}]}
const dvLabel=id=>S._dim==='dx'?((dxItem(id)||{}).name||id):S._dim==='pe'?peName(id):ouName(id);
function dvList(){const d=S._dim;
  if(d==='ou'){const fs=facilities();const row=(id,name,lvl)=>`<li class="lv${lvl}"><label><input type="checkbox" ${S._sel.includes(id)?'checked':''} onchange="dvTog('${id.replace(/'/g,"\\'")}')"> ${esc(name)}</label></li>`;
    document.getElementById('dvav').innerHTML=row('LUM',districtName(),0)+fs.map(f=>row('F:'+f,f,1)).join('');return}
  const q=(S._q||'').toLowerCase();const L=dvAvail().filter(x=>!S._sel.includes(x.id)&&(!q||(x.name+' '+(x.sub||'')).toLowerCase().includes(q)));
  document.getElementById('dvav').innerHTML=L.map(x=>`<li><button type="button" onclick="dvTog('${x.id.replace(/'/g,"\\'")}')">${esc(x.name)}${x.sub?`<span>${esc(x.sub)}</span>`:''}</button></li>`).join('')||'<li class="small muted" style="padding:8px">Nothing to add.</li>';
  document.getElementById('dvsel').innerHTML=S._sel.map(id=>`<li><button type="button" onclick="dvTog('${id.replace(/'/g,"\\'")}')">${esc(dvLabel(id))}<span aria-hidden="true">×</span></button></li>`).join('')||'<li class="small muted" style="padding:8px">Nothing selected.</li>'}
function dvTog(id){const k=S._sel.indexOf(id);if(k>=0)S._sel.splice(k,1);else S._sel.push(id);dvList()}
function dvAll(){const q=(S._q||'').toLowerCase();dvAvail().filter(x=>!q||x.name.toLowerCase().includes(q)).forEach(x=>{if(!S._sel.includes(x.id))S._sel.push(x.id)});dvList()}
function dvApply(){S.dv[S._dim]=S._sel.slice();dlg.close();render()}

/* favourites */
function dvNew(){S.dv=null;dvInit();render()}
function dvCfg(){const c=S.dv;return {type:c.type,cols:c.cols,rows:c.rows,filters:c.filters,dx:c.dx,pe:c.pe,ou:c.ou,legend:c.legend,hideEmpty:c.hideEmpty}}
async function dvSave(asNew){const c=S.dv;let name=c.name;
  if(asNew||!c.id){document.getElementById('dlgT').textContent='Save visualization';document.getElementById('dlgB').innerHTML=`<div class="form"><label class="full">Name<input type="text" id="dvname" value="${esc(name||dvTitle())}"></label></div>`;
    document.getElementById('dlgF').innerHTML=`<button class="btn" onclick="dlg.close()">Cancel</button><button class="btn primary" onclick="dvSave2(true)">Save</button>`;dlg.showModal();return}
  dvSave2(false)}
async function dvSave2(asNew){const c=S.dv;if(asNew){const n=document.getElementById('dvname').value.trim();if(!n){toast('Enter a name');return}c.name=n;dlg.close()}
  let by='';try{by=user?await user.id():''}catch(e){}const doc=Object.assign(dvCfg(),{name:c.name,at:new Date().toISOString(),by});
  write(async()=>{if(asNew||!c.id){const r=await db.collection(cp('visualizations')).add(doc);c.id=r.id}else await db.doc(dp('visualizations',c.id)).set(doc);toast('Saved “'+c.name+'”');render()})}
function dvOpen(id){const v=(S.vizs||[]).find(x=>x.id===id);if(!v)return;S.dv=Object.assign({},v,{id:v.id,name:v.name});if(dlg.open)dlg.close();render()}
function dvOpenDlg(){document.getElementById('dlgT').textContent='Open a visualization';
  document.getElementById('dlgB').innerHTML=(S.vizs||[]).length?`<ul class="list">${S.vizs.map(v=>`<li class="click" onclick="dvOpen('${v.id}')"><div><div class="t">${esc(v.name)}</div><div class="d">${esc((DV_TYPES.find(t=>t[0]===v.type)||['',''])[1])} · saved ${esc(String(v.at||'').slice(0,10))}</div></div></li>`).join('')}</ul>`:'<div class="empty">No saved visualizations yet. Build one and choose File → Save.</div>';
  document.getElementById('dlgF').innerHTML='<button class="btn" onclick="dlg.close()">Close</button>';dlg.showModal()}
function dvDelete(){const c=S.dv;if(!c.id||!confirm('Delete “'+c.name+'”?'))return;const id=c.id;write(async()=>{await db.doc(dp('visualizations',id)).delete();dvNew()})}
function dvDownload(kind){const A=dvAoa();const name=(dvTitle().replace(/[^A-Za-z0-9]+/g,'_').slice(0,60)||'visualization')+'_'+iso(today());
  if(kind==='xlsx'){saveXlsx(name+'.xlsx',[{name:'Data',aoa:[[dvTitle()],[dvSub()],...A],cols:A[0].map((_,k)=>k?14:44)}]);return}
  const csv=A.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
  if(downloads)downloads.save({filename:name+'.csv',data:csv}).catch(()=>{});else{const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const l=document.createElement('a');l.href=u;l.download=name+'.csv';l.click()}}
</script>

<script>
/* ---------- DATA ENTRY form (DHIS2 Data Entry style) + indicator details editing ---------- */
APPS.splice(APPS.findIndex(a=>a[0]==='iptt'),1,['iptt','Data Entry','Enter monthly values and edit indicators']);
function ipttMode(){const m=S.f.ipm||'table';return `<div class="seg" role="group" aria-label="IPTT view"><button class="btn ${m==='form'?'primary':''}" onclick="S.f.ipm='form';render()">${ic('checks')} Data entry form</button><button class="btn ${m==='table'?'primary':''}" onclick="S.f.ipm='table';render()">${ic('iptt')} Indicator table</button></div>`}
function entryRows(){const f=S.f;return S.ind.filter(i=>i.freq!=='survey'&&(!f.eres||i.result===f.eres))}
function vEntry(){
  const f=S.f;const lm=lastM();const m=f.em||Math.max(1,Math.min(12,periodMonth()||lm));const L=entryRows();
  const isEnt=i=>i.unit==='percent'&&(i.num||i.den||i.numLabel)?num((i.num||{})[m])!==null&&num((i.den||{})[m])!==null:num((i.actuals||{})[m])!==null;
  const editable=i=>S.canEdit&&!i._derived;const done=L.filter(isEnt).length;
  let h=`<div class="toolbar">${ipttMode()}</div>
  <section class="card d2de"><div class="d2deh">
    <label>Organisation unit<span class="d2fix">${esc(districtName())}</span></label>
    <label>Data set<span class="d2fix">${esc(S.proj.name)} – IPTT (monthly)</span></label>
    <label>Period<span class="d2per"><button class="btn sm" ${m<=1?'disabled':''} onclick="S.f.em=${m-1};render()" aria-label="Previous month">‹</button><select aria-label="Period" onchange="S.f.em=+this.value;render()">${M.map((x,k)=>`<option value="${k+1}" ${k+1===m?'selected':''}>${x} ${YEAR}</option>`).join('')}</select><button class="btn sm" ${m>=12?'disabled':''} onclick="S.f.em=${m+1};render()" aria-label="Next month">›</button></span></label>
    <label>Section<select aria-label="Section" onchange="S.f.eres=this.value;render()"><option value="">All sections</option>${visRes().map(r=>`<option ${f.eres===r?'selected':''}>${r}</option>`).join('')}</select></label>
    <div class="d2prog">${prog(done,L.length)}<span class="small muted">values entered for ${M[m-1]}</span></div></div>
   ${S.canEdit?`<p class="d2tip small">Type a value and press Tab or Enter – each cell saves on its own (green = saved). Percentage indicators take a numerator and denominator; the rate is calculated. Leave a cell blank if not reported.</p>`:'<div class="banner" style="margin:12px 16px">View only – entering data needs edit access.</div>'}
   <div class="tw d2form" style="border:0;box-shadow:none;border-radius:0"><table><thead><tr><th>Code</th><th style="min-width:260px">Indicator</th><th class="num">${M[m-1]} value</th><th class="num">Numerator</th><th class="num">Denominator</th><th class="num">${m>1?M[m-2]:'Prev.'}</th><th class="num">Y1 target</th><th>Status (YTD)</th><th></th></tr></thead><tbody>`;
  let lr='';
  for(const i of L){const c=calc(i);if(i.result!==lr){lr=i.result;h+=`<tr class="r-res"><td colspan="9"><span class="rc">${esc(i.result)}</span>${esc(resName(i.result))}</td></tr>`}
    const pc=i.unit==='percent';const nd=pc&&(i.num||i.den||i.numLabel);const ed=editable(i);const dis=ed?'':'disabled';
    const v=num((i.actuals||{})[m]),pv=m>1?num((i.actuals||{})[m-1]):null;
    const inp=(kind,val,lab)=>`<input type="number" step="any" min="0" inputmode="decimal" class="d2cell" id="e-${kind}-${i.id}" value="${val===null?'':(kind==='v'&&pc?+(val*100).toFixed(2):val)}" aria-label="${esc(i.code+' '+lab+' '+M[m-1])}" ${dis} onchange="saveCell('${i.id}',${m},'${kind}',this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">`;
    h+=`<tr><td class="muted">${esc(i.code)}</td><td>${esc(i.name)}${i.direction==='decrease'?' <span class="chip t-none">↓ lower is better</span>':''}${i._derived?' <span class="chip t-good" title="'+esc(i._derived)+'">Linked</span>':''}${nd?`<div class="small muted">${esc(i.numLabel||'Numerator')} ÷ ${esc(i.denLabel||'Denominator')}</div>`:''}</td>
     <td class="num">${nd?`<span class="d2pct" id="e-p-${i.id}">${v===null?'–':fmt(i,v)}</span>`:inp('v',v,'value')}${pc&&!nd?'<span class="small muted"> %</span>':''}</td>
     <td class="num">${nd?inp('n',num((i.num||{})[m]),'numerator'):''}</td><td class="num">${nd?inp('d',num((i.den||{})[m]),'denominator'):''}</td>
     <td class="num muted">${pv===null?'–':fmt(i,pv)}</td><td class="num">${i.target===null||i.target===undefined?esc(i.targetText||'–'):fmt(i,i.target)}</td><td>${stChip(c)}</td>
     <td class="nowrap">${S.canEdit&&!i._derived?`<button class="btn sm ghost" onclick="editIndDetails('${i.id}')" title="Edit indicator name, definition, baseline, target and settings">✎ Edit</button>`:''}<button class="btn sm ghost" onclick="openInd('${i.id}')">Details</button></td></tr>`}
  if(!L.length)h+='<tr><td colspan="9" class="empty">No indicators in this section.</td></tr>';
  return h+`</tbody></table></div></section>`}
async function saveCell(id,m,kind,el){const i=S.ind.find(x=>x.id===id);if(!i)return;const s=el.value.trim();let v=s===''?null:Number(s);
  if(v!==null&&(!isFinite(v)||v<0)){el.classList.add('bad');toast('Enter a number of 0 or more');return}
  const pc=i.unit==='percent';const upd={};
  if(kind==='v'){if(v!==null&&pc)v/=100;upd.actuals=Object.assign({},i.actuals||{},{[m]:v})}
  else{const N=Object.assign({},i.num||{}),D=Object.assign({},i.den||{});if(kind==='n')N[m]=v;else D[m]=v;const n=num(N[m]),d=num(D[m]);
    upd.num=N;upd.den=D;upd.actuals=Object.assign({},i.actuals||{},{[m]:n!==null&&d?n/d:null});const p=document.getElementById('e-p-'+id);if(p)p.textContent=n!==null&&d?fmt(i,n/d):'–';
    if(n!==null&&d!==null&&n>d)toast(`${i.code}: numerator is larger than the denominator – check the registers.`)}
  el.classList.remove('bad','ok');el.classList.add('saving');
  try{await db.doc(dp('indicators',id)).update(upd);Object.assign(i,upd);el.classList.remove('saving');el.classList.add('ok');stamp()}
  catch(e){el.classList.remove('saving');el.classList.add('bad');toast('Could not save: '+(e&&e.code==='invalid_argument'?'you need edit access.':(e&&e.message)||e))}}
function editIndDetails(id){const i=S.ind.find(x=>x.id===id);if(!i)return;const pc=i.unit==='percent';const sc=v=>v===null||v===undefined?'':(pc?+(v*100).toFixed(2):v);
  document.getElementById('dlgT').textContent='Edit indicator '+i.code;
  document.getElementById('dlgB').innerHTML=`<div class="form" id="idf">
   <label class="full">Indicator name<input type="text" name="name" value="${esc(i.name)}"></label>
   <label class="full">Definition<textarea name="definition">${esc(i.definition||'')}</textarea></label>
   <label>Unit<select name="unit">${opt(['count','percent','score'],i.unit||'count')}</select></label>
   <label>Better when<select name="direction"><option value="increase" ${i.direction!=='decrease'?'selected':''}>Higher is better</option><option value="decrease" ${i.direction==='decrease'?'selected':''}>Lower is better</option></select></label>
   <label>Year total is the<select name="agg"><option value="sum" ${i.agg==='sum'?'selected':''}>Sum of months</option><option value="average" ${i.agg==='average'?'selected':''}>Average of months</option><option value="latest" ${i.agg==='latest'?'selected':''}>Latest month</option></select></label>
   <label>Frequency<select name="freq">${opt(['monthly','quarterly','semi-annual','annual','survey'],i.freq||'monthly')}</select></label>
   <label>Baseline${pc?' (%)':''}<input type="number" step="any" name="baseline" value="${sc(i.baseline)}"></label>
   <label>Year 1 target${pc?' (%)':''}<input type="number" step="any" name="target" value="${sc(i.target)}"></label>
   <label class="full">Numerator (percentages)<input type="text" name="numLabel" value="${esc(i.numLabel||'')}"></label>
   <label class="full">Denominator (percentages)<input type="text" name="denLabel" value="${esc(i.denLabel||'')}"></label>
   <label>Responsible officer<select name="owner">${opt(['',...new Set([...(i.owner&&!owners().includes(i.owner)?[i.owner]:[]),...owners()])],i.owner||'')}</select></label>
   <label>Collection<input type="text" name="freqText" value="${esc(i.freqText||'')}"></label>
   <label class="full">Means of verification<input type="text" name="mov" value="${esc(i.mov||'')}"></label>
   <label class="full">Data source<input type="text" name="dataSource" value="${esc(i.dataSource||'')}"></label>
   <label class="full">Data note / flag<textarea name="flag">${esc(i.flag||'')}</textarea></label></div>`;
  document.getElementById('dlgF').innerHTML=`<button class="btn" onclick="dlg.close()">Cancel</button><button class="btn primary" onclick="saveIndDetails('${id}')">Save indicator</button>`;
  if(!dlg.open)dlg.showModal()}
function saveIndDetails(id){const i=S.ind.find(x=>x.id===id);const o=formData('#idf');if(!o.name){toast('Enter the indicator name');return}
  const pc=o.unit==='percent';const nv=s=>{if(s==='')return null;const n=Number(s);return isFinite(n)?(pc?n/100:n):undefined};
  const b=nv(o.baseline),t=nv(o.target);if(b===undefined||t===undefined){toast('Baseline and target must be numbers');return}
  const upd={name:o.name,definition:o.definition,unit:o.unit,direction:o.direction,agg:o.agg,freq:o.freq,baseline:b,baselineText:b===null?'':String(pc?+(b*100).toFixed(2)+'%':b),target:t,numLabel:o.numLabel,denLabel:o.denLabel,owner:o.owner,freqText:o.freqText,mov:o.mov,dataSource:o.dataSource,flag:o.flag};
  if(t!==num(i.target)){upd.targetPrev=i.target===undefined?null:i.target;upd.targetEditedOn=iso(today());upd.targetText=t===null?'':String(pc?+(t*100).toFixed(2)+'%':t)}
  dlg.close();write(()=>db.doc(dp('indicators',id)).update(upd))}
</script>
<script>
/* keep focus while typing in the data entry form: defer live re-renders until the cell is left */
const _renderBase=render;render=function(){const a=document.activeElement;if(a&&a.classList&&a.classList.contains('d2cell')){S._deferR=true;return}S._deferR=false;_renderBase()};
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('d2cell'))setTimeout(()=>{const a=document.activeElement;if(S._deferR&&!(a&&a.classList&&a.classList.contains('d2cell')))render()},50)});
</script>

<script>
/* ---------- TOTAL REACH (women & children), live from the IPTT indicators ---------- */
ICON.reach='<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M14 20c.3-2.6 1.6-4.5 4-4.5 2.2 0 3 1.4 3 4.5"/>';
TABS.splice(TABS.findIndex(t=>t[0]==='viz')+1,0,['reach','Total Reach']);
NAVG.forEach(g=>{const k=g[1].indexOf('viz');if(k>=0)g[1].splice(k+1,0,'reach')});
TABHELP.reach='Women and children reached in Year 1 – monthly values pulled live from the IPTT indicators, against the Year 1 targets in the Log Frame Total Reach tab.';
APPS.splice(APPS.findIndex(a=>a[0]==='viz')+1,0,['reach','Total Reach','Women and children reached against targets']);
function reachRows(){const R=S.reach||{groups:[]};return (R.groups||[]).map(g=>({name:g.name,rows:(g.rows||[]).map(r=>{const i=S.indAll.find(x=>x.code===r.code);const v=M.map((_,k)=>i?num((i.actuals||{})[k+1]):null);
  const n=v.filter(x=>x!==null).length;const tot=v.reduce((a,x)=>a+(x||0),0);return Object.assign({},r,{i,v,n,tot,proj:n?tot/n*12:null})})}))}
function vReach(){
  if(S.reach===undefined){S.reach=null;if(db)db.doc(dp('meta','reach')).get().then(s=>{S.reach=s.exists?s.data():{groups:[]};render()}).catch(()=>{S.reach={groups:[]};render()});}
  if(!S.reach)return '<div class="empty">Loading total reach…</div>';
  const G=reachRows();if(!G.length)return '<div class="card empty">No total reach set-up for this project.</div>';
  const nf=v=>v===null||v===undefined||isNaN(v)?'–':(+v).toLocaleString('en-GB',{maximumFractionDigits:1});
  const tone=(tot,t,n)=>{if(!t||!n)return '';const r=tot/(t*n/12);return r>=S.cfg.green?'lg-good':r>=S.cfg.amber?'lg-warn':'lg-bad'};
  const sumG=g=>{const v=M.map((_,k)=>g.rows.reduce((a,r)=>r.v[k]===null?a:(a===null?0:a)+r.v[k],null));const n=Math.max(0,...g.rows.map(r=>r.n));const o={v,n,tot:g.rows.reduce((a,r)=>a+r.tot,0)};['target','baseline','proj10','targetY2'].forEach(k=>o[k]=g.rows.reduce((a,r)=>a+(num(r[k])||0),0));o.proj=g.rows.reduce((a,r)=>a+(r.proj||0),0);return o};
  const all=G.map(sumG);const grand={v:M.map((_,k)=>all.reduce((a,s)=>s.v[k]===null?a:(a===null?0:a)+s.v[k],null)),n:Math.max(...all.map(s=>s.n)),tot:all.reduce((a,s)=>a+s.tot,0)};['target','baseline','proj10','targetY2','proj'].forEach(k=>grand[k]=all.reduce((a,s)=>a+s[k],0));
  const lm=Math.max(0,...G.flatMap(g=>g.rows.map(r=>{let l=0;r.v.forEach((x,k)=>{if(x!==null)l=k+1});return l})));
  const kp=(lbl,s)=>`<div class="card kpi ${tone(s.tot,s.target,s.n)==='lg-good'?'good':tone(s.tot,s.target,s.n)==='lg-warn'?'warn':'bad'}"><div class="l"><span class="dot"></span>${esc(lbl)} reached</div><div class="v">${nf(s.tot)}</div><div class="meter"><i style="width:${s.target?Math.min(100,s.tot/s.target*100):0}%;background:var(--sci-red)"></i></div><div class="s">${s.target?Math.round(s.tot/s.target*100):0}% of the Year 1 target (${nf(s.target)}) · projected ${nf(s.proj)}</div></div>`;
  let h=`<div class="grid g-kpi" style="margin-bottom:var(--space-5)">${G.map((g,k)=>kp(g.name,all[k])).join('')}${kp('Total',grand)}</div>
  <div class="toolbar"><span class="grow small muted">Months to ${lm?M[lm-1]:'–'} ${YEAR}. Monthly values come straight from the IPTT indicators (filled from the Log Frame Service Delivery tab and DHIS2); targets, baseline and Year 2 targets from the Log Frame Total Reach tab. Colours compare the total with the share of the target due.</span><button class="btn" onclick="exportReach()">${ic('dl')} Download (.xlsx)</button></div>
  <div class="tw d2pt reach"><table><thead><tr><th style="min-width:300px">Indicator</th><th class="num">Target Y1</th><th class="num">Total Y1</th>${M.map((m,k)=>`<th class="num ${k+1>lm?'muted':''}">${m}</th>`).join('')}<th class="num">% of target</th><th class="num">Baseline Y0</th><th class="num">Projected Y1</th><th class="num">Target Y2</th></tr></thead><tbody>`;
  const row=(lbl,s,cls,click)=>`<tr class="${cls||''}" ${click||''}><th class="d2rh" scope="row">${lbl}</th><td class="num d2tg">${nf(s.target)}</td><td class="num d2tt ${tone(s.tot,s.target,s.n)}"><b>${nf(s.tot)}</b></td>${s.v.map(x=>`<td class="num">${nf(x)}</td>`).join('')}<td class="num">${s.target?Math.round(s.tot/s.target*100)+'%':'–'}</td><td class="num">${nf(s.baseline)}</td><td class="num">${nf(s.proj)}</td><td class="num">${nf(s.targetY2)}</td></tr>`;
  G.forEach((g,k)=>{h+=`<tr class="r-res"><td colspan="19"><span class="rc">${esc(g.name)}</span>Total reach – ${esc(g.name.toLowerCase())}</td></tr>`;
    g.rows.forEach(r=>{const diff=r.i&&num(r.i.target)!==null&&Math.abs(num(r.i.target)-r.target)>0.5;
      h+=row(`<span class="muted small">${esc(r.code)}</span> ${esc(r.label)}${!r.i?' <span class="chip t-bad">Indicator not found</span>':''}${diff?` <span class="chip t-flag" title="The IPTT target for ${esc(r.code)} is ${fmt(r.i,r.i.target)}; the Total Reach tab uses ${nf(r.target)}">IPTT target differs</span>`:''}`,r,'click',r.i?`onclick="openInd('${r.i.id}')"`:'')});
    h+=row(`<b>Sub-total ${esc(g.name.toLowerCase())}</b>`,all[k],'reach-sub')});
  h+=row('<b>Total reach (women and children)</b>',grand,'reach-tot');
  return h+`</tbody></table></div><p class="small muted" style="margin-top:10px">Projected Y1 = total so far ÷ months reported × 12. Source: ${esc(S.reach.source||'')}.</p>`}
function exportReach(){const G=reachRows();const A=[['OHNEZ Total Reach – women and children ('+iso(today())+')'],['Group','Code','Indicator','Target Y1','Total Y1',...M,'Baseline Y0','Projected 10%','Projected Y1','Target Y2']];
  G.forEach(g=>g.rows.forEach(r=>A.push([g.name,r.code,r.label,r.target,r.tot,...r.v.map(x=>x===null?'':x),r.baseline,r.proj10,r.proj===null?'':Math.round(r.proj),r.targetY2])));
  saveXlsx('OHNEZ_Total_Reach_'+iso(today())+'.xlsx',[{name:'Total Reach',aoa:A,cols:[10,8,60,...M.map(()=>7),10,10,10,10,10,10]}])}
</script>
