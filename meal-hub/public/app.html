 score:'<rect x="3" y="5" width="8" height="14" rx="1.5"/><rect x="13" y="5" width="8" height="14" rx="1.5"/><path d="M5 15l2-2 2 1M15 15l2-3 2 1"/>',gatable:'<path d="M3 6h18M3 12h18M3 18h18"/><path d="M13 6h6M13 12h3M13 18h5" stroke-width="3"/>',map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>'};
function dvGallery(){const c=S.dv;return `<div class="card d2gal" role="toolbar" aria-label="Visualization gallery">${DV_GROUPS.map(([g,ks])=>`<div class="d2gg"><span class="d2gl">${g}</span><div class="d2gt">${ks.map(k=>`<button type="button" class="d2gb ${c.type===k?'on':''}" onclick="dvPick('${k}')" title="${esc(dvTypeName(k))}" aria-pressed="${c.type===k}"><svg viewBox="0 0 24 24" aria-hidden="true">${GIC[k]}</svg><span>${esc(dvTypeName(k).replace(/ \(.*\)$/,''))}</span></button>`).join('')}</div></div>`).join('')}</div>`}

  if(['kpi','score','gauge','bullet'].includes(k)){if(!c.rows.includes('dx')){['cols','rows','filters'].forEach(a=>c[a]=c[a].filter(x=>x!=='dx'));c.rows.unshift('dx')}}

ICON.map='<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>';
/* ---- shared helpers ---- */
const CLSF={'lg-good':'#43a047','k-low':'#43a047','lg-warn':'#f2b705','k-mod':'#fb8c00','lg-bad':'#e53935','k-high':'#e53935'};
const pal=k=>k<D2PAL.length?D2PAL[k]:`hsl(${Math.round((k*137.508)%360)},52%,${k%2?44:54}%)`;
const tipA=s=>` data-tip="${esc(s)}"`;
function dvMat(){const c=S.dv;const all=[...c.cols,...c.rows];const cat=all.includes('pe')?'pe':(c.rows[0]||c.cols[0]||'pe');const ser=all.find(d=>d!==cat);
  const CI=dvItems(cat),SI=ser?dvItems(ser):[{id:'_',name:dvItems('dx').length===1?dvItems('dx')[0].name:''}];
  const V=SI.map(s=>CI.map(k=>{const parts=[Object.assign({dim:cat},k)];if(ser)parts.push(Object.assign({dim:ser},s));return cellVal(parts)}));
  const pctAx=dvItems('dx').every(x=>x.x.kind==='ind'&&x.x.i.unit==='percent');
  const ax=v=>pctAx?Math.round(v*100)+'%':Math.abs(v)>=1000?(v/1000).toLocaleString('en-GB',{maximumFractionDigits:1})+'k':String(Math.round(v*10)/10);
  return {c,cat,ser,CI,SI,V,pctAx,ax}}
function dvAgg(){const dxs=dvItems('dx');const cand=['ou','dx','pe'].filter(d=>dvItems(d).length>1);const dim=cand.find(d=>d==='dx'||dxs.length===1)||'dx';
  return {dim,items:dvItems(dim).map(it=>{const cv=cellVal([Object.assign({dim},it)]);return {id:it.id,name:it.name,v:cv.v,dx:cv.dx,cls:cv.cls,months:cv.months}})}}
function tgtExp(dx,months,ous){if(!dx||dx.kind!=='ind')return null;if(ous&&!(ous.length===1&&ous[0]==='LUM'))return null;const t=num(dx.i.target);if(t===null)return null;if(isLimit(dx.i))return t;const n=new Set(months).size;return dx.i.agg==='sum'&&dx.i.unit!=='percent'?t*Math.min(n,12)/12:t}
const allOus=()=>dvItems('ou').map(x=>x.id);
const selMonths=()=>[...new Set(dvItems('pe').flatMap(p=>peMonths(p.id)))].sort((a,b)=>a-b);
function monthSeries(dx,ous){const lm=lastM();return rng(1,lm).map(m=>dvValue(dx,[m],ous))}
function spark(vals,w,h,col,fill,ghost){const v=vals.map(x=>x===null||x===undefined?null:+x);const nn=v.filter(x=>x!==null);if(nn.length<(ghost?1:2))return `<svg class="d2spk" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"></svg>`;
  const rg=ghost?ghost.filter(x=>x!==null&&x!==undefined).map(Number):nn;const mx=Math.max(...rg),mn=Math.min(0,...rg);const X=k=>2+(w-4)*k/Math.max(1,v.length-1),Y=x=>h-3-(h-6)*(x-mn)/((mx-mn)||1);let d='';let first=null,last=null;
  v.forEach((x,k)=>{if(x===null)return;d+=(d?'L':'M')+X(k).toFixed(1)+','+Y(x).toFixed(1);if(first===null)first=k;last=k});
  let gh='';if(ghost){const gv=ghost.map(x=>x===null||x===undefined?null:+x);const gmx=mx,gmn=mn;let gd='';gv.forEach((x,k)=>{if(x===null)return;gd+=(gd?'L':'M')+X(k).toFixed(1)+','+(h-3-(h-6)*(x-gmn)/((gmx-gmn)||1)).toFixed(1)});gh=`<path d="${gd}" fill="none" stroke="var(--line-strong)" stroke-width="1.4" stroke-dasharray="3 3" opacity=".7"/>`}
  return `<svg class="d2spk" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${gh}${fill?`<path d="${d}L${X(last).toFixed(1)},${h}L${X(first).toFixed(1)},${h}Z" fill="${col}" opacity=".14"/>`:''}<path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(last)}" cy="${Y(v[last])}" r="2.6" fill="${col}"/></svg>`}
function last2(tr){let a=-1,b=-1;for(let k=tr.length-1;k>=0;k--){if(tr[k]!==null&&tr[k]!==undefined){if(a<0)a=k;else{b=k;break}}}return {a,b,cur:a<0?null:tr[a],prev:b<0?null:tr[b]}}
function dvStatusTxt(cls){return {'lg-good':'On track','k-low':'Low','lg-warn':'Needs attention','k-mod':'Moderate','lg-bad':'Off track','k-high':'High'}[cls]||''}
function axes(W,H,L,T,pw,ph,mx,ax,horiz){let g='';for(let k=0;k<=5;k++){const v=mx*k/5;if(horiz){const x=L+pw*k/5;g+=`<line class="grid-l" x1="${x}" x2="${x}" y1="${T}" y2="${T+ph}"/><text class="axis" x="${x}" y="${T+ph+18}" text-anchor="middle">${ax(v)}</text>`}else{const y=T+ph*(1-k/5);g+=`<line class="grid-l" x1="${L}" x2="${L+pw}" y1="${y}" y2="${y}"/><text class="axis" x="${L-8}" y="${y+4}" text-anchor="end">${ax(v)}</text>`}}return g}
function catLabels(CI,L,T,pw,ph,band,rot){return CI.map((k,ix)=>{const t=k.name.length>26?k.name.slice(0,25)+'…':k.name;const x=L+band*(ix+.5);return rot?`<text class="axis" transform="translate(${x},${T+ph+14}) rotate(-35)" text-anchor="end">${esc(t)}</text>`:`<text class="axis" x="${x}" y="${T+ph+18}" text-anchor="middle">${esc(t)}</text>`}).join('')}
const legendRow=(SI,ser,extra)=>ser||extra?`<div class="d2leg">${ser?SI.map((s,k)=>`<span><i style="background:${pal(k)}"></i>${esc(s.name)}</span>`).join(''):''}${extra||''}</div>`:'';
const svgWrap=(W,H,inner,cls)=>`<div class="chart d2chart ${cls||''}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(dvTitle())}">${inner}</svg></div>`;

/* ---- Power BI style ---- */
function dvAreaC(){const {CI,SI,V,ax,ser}=dvMat();let mx=0;V.forEach(r=>r.forEach(x=>{if(x.v!==null)mx=Math.max(mx,x.v)}));if(!mx)return noData;mx=niceMax(mx*1.08);
  const W=1180,H=440,L=58,T=16,B=CI.length>8||CI.some(k=>k.name.length>9)?78:40,pw=W-L-20,ph=H-T-B,band=pw/Math.max(1,CI.length);let defs='',m='';
  V.forEach((row,s)=>{const col=pal(s);defs+=`<linearGradient id="ag${s}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".38"/><stop offset="1" stop-color="${col}" stop-opacity=".02"/></linearGradient>`;
    const pts=row.map((x,k)=>x.v===null?null:[L+band*(k+.5),T+ph*(1-x.v/mx)]).filter(Boolean);if(!pts.length)return;const d=pts.map((p,k)=>(k?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('');
    m+=`<path d="${d}L${pts[pts.length-1][0]},${T+ph}L${pts[0][0]},${T+ph}Z" fill="url(#ag${s})"/><path class="d2draw" d="${d}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round"/>`;
    row.forEach((x,k)=>{if(x.v===null)return;m+=`<circle class="d2pop" cx="${L+band*(k+.5)}" cy="${T+ph*(1-x.v/mx)}" r="4.5" fill="var(--surface)" stroke="${col}" stroke-width="2.2"${tipA((ser?SI[s].name+' · ':'')+CI[k].name+': '+fmtV(x.dx,x.v))}/>`})});
  return svgWrap(W,H,`<defs>${defs}</defs>${axes(W,H,L,T,pw,ph,mx,ax)}${m}${catLabels(CI,L,T,pw,ph,band,B>50)}`)+legendRow(SI,ser)}
function dvCombo(){const {CI,SI,V,ax,ser,cat}=dvMat();let mx=0;const tg=V.map(row=>row.map(x=>tgtExp(x.dx,x.months||[],allOus())));
  V.forEach((r,s)=>r.forEach((x,k)=>{if(x.v!==null)mx=Math.max(mx,x.v);if(tg[s][k]!==null)mx=Math.max(mx,tg[s][k])}));if(!mx)return noData;mx=niceMax(mx*1.08);
  const W=1180,H=440,L=58,T=16,B=CI.length>8||CI.some(k=>k.name.length>9)?78:40,pw=W-L-20,ph=H-T-B,band=pw/Math.max(1,CI.length);const n=SI.length,bw=Math.min(44,band*.7/n);let m='',ln='';
  CI.forEach((_,k)=>V.forEach((row,s)=>{const x=row[k];if(x.v===null)return;const xx=L+band*(k+.5)+(s-(n-1)/2)*bw-bw/2,y=T+ph*(1-x.v/mx);const fill=S.dv.legend&&x.cls?CLSF[x.cls]:pal(s);
    m+=`<rect class="d2grow" x="${xx}" y="${y}" width="${Math.max(.6,bw-3)}" height="${T+ph-y}" rx="3" fill="${fill}" opacity=".9"${tipA((ser?SI[s].name+' · ':'')+CI[k].name+': '+fmtV(x.dx,x.v)+(tg[s][k]!==null?' (target pace '+fmtV(x.dx,tg[s][k])+')':'')+(x.cls?' – '+dvStatusTxt(x.cls):''))}/>`}));
  tg.forEach((row,s)=>{const pts=row.map((t,k)=>t===null?null:[L+band*(k+.5),T+ph*(1-t/mx)]).filter(Boolean);if(!pts.length)return;
    ln+=`<path class="d2draw" d="${pts.map((p,k)=>(k?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('')}" fill="none" stroke="${n>1?pal(s):'#1a237e'}" stroke-width="2.2" stroke-dasharray="7 5"/>`;pts.forEach(p=>{ln+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${n>1?pal(s):'#1a237e'}"/>`})});
  const hasT=tg.some(r=>r.some(x=>x!==null));

function dvDonut(){const {items}=dvAgg();const it=items.filter(x=>x.v!==null&&x.v>0);const zero=items.filter(x=>x.v===0);if(!it.length)return noData;const tot=it.reduce((a,b)=>a+b.v,0);const pct=it[0].dx&&it[0].dx.kind==='ind'&&it[0].dx.i.unit==='percent';

    const sym=/hospital/i.test(f.g.type||f.name)?`<rect x="${x-4}" y="${y-1.2}" width="8" height="2.4" fill="#fff"/><rect x="${x-1.2}" y="${y-4}" width="2.4" height="8" fill="#fff"/>`:'';
    g+=`<g class="d2fac${sel?' sel':''}" onclick="dvMapSel('${f.name.replace(/'/g,"\\'")}')"${tipA(f.name+': '+(f.v===null?'no value':fmtV(dx,f.v))+(f.g.verify?' – location to verify':''))}><circle class="d2pop" cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="${col}" stroke="${f.v===null?'#888':'#fff'}" stroke-width="${sel?4:2}" ${f.v===null?'stroke-dasharray="3 2"':''}/><circle cx="${x}" cy="${y}" r="5.5" fill="${/hospital/i.test(f.name)?'#d74554':'#123e66'}" stroke="#fff" stroke-width="1.4"/>${sym}
      ${Lr.lab?`<text class="d2ml" x="${x+r+5}" y="${y-2}">${esc(shortF(f.name))}${f.g.verify?' ⚠':''}</text><text class="d2ml v" x="${x+r+5}" y="${y+13}">${f.v===null?'–':esc(fmtV(dx,f.v))}</text>`:''}</g>`});
  /* scale bar + north arrow */
  const want=W/5/kmPx;const nice=[1,2,5,10,20,25,50,100].reduce((a,b)=>Math.abs(b-want)<Math.abs(a-want)?b:a);const sw=nice*kmPx;
  g+=`<g class="d2sb" transform="translate(${W-sw-28},${H-34})"><rect x="0" y="0" width="${sw/2}" height="6" fill="#333"/><rect x="${sw/2}" y="0" width="${sw/2}" height="6" fill="#fff" stroke="#333"/><text x="0" y="-5">0</text><text x="${sw}" y="-5" text-anchor="end">${nice} km</text></g>

    ${sel?`<div class="d2msh">Selected facility</div><div class="d2minfo"><b>${esc(sel.name)}</b><div class="small muted">${esc(sel.g.type||'')}${sel.g.code?' · '+esc(sel.g.code):''}</div>${sel.g.missing?'<div class="small">No GPS yet – add it in Data Sources → Map layers.</div>':`<div class="small">${Math.abs(sel.g.lat).toFixed(4)}°S, ${sel.g.lon.toFixed(4)}°E</div>`}${sel.g.verify?`<div class="small warnc">⚠ ${esc(sel.g.verify)}</div>`:''}
      <div class="d2mv">${sel.v===null?'–':esc(fmtV(dx,sel.v))}</div>${spark(sel.tr,220,48,'#2f86cc',true)}<div class="small muted">Jan–${M[lm-1]} monthly</div><div class="small muted">Source: ${esc(sel.g.src||'')}</div>${sel.g.code?`<a class="small" href="https://navigator.ext.pdu.gov.zm/Locations/Location/${esc(sel.g.code)}" target="_blank" rel="noopener">MoH navigator record ↗</a>`:''}<button class="btn sm ghost" onclick="dvMapSel('')">Clear</button></div>`:''}
    <div class="d2msh">Ranking</div><ol class="d2rank">${F.slice().sort((a,b)=>(b.v??-1)-(a.v??-1)).map(f=>`<li><button type="button" onclick="dvMapSel('${f.name.replace(/'/g,"\\'")}')" class="${c.mapSel===f.name?'on':''}"><span>${esc(shortF(f.name))}${f.g.missing?' <em>no GPS</em>':''}</span><b>${f.v===null?'–':esc(fmtV(dx,f.v))}</b></button></li>`).join('')}</ol></aside>`;
  const play=`<div class="d2tc"><button class="btn sm ${S._mapT?'primary':''}" onclick="dvPlay()" aria-label="${S._mapT?'Pause':'Play'} through months">${S._mapT?'❚❚ Pause':'▶ Play months'}</button><input type="range" min="0" max="${lm}" value="${c.mapM||0}" aria-label="Month" oninput="dvStop();S.dv.mapM=+this.value;dvMapRefresh()"><span class="d2tcl">${c.mapM?M[c.mapM-1]+' '+YEAR:'All selected periods ('+ms.length+' months)'}</span></div>`;
  return `<div class="d2map ${c.mapNoSide?'noside':''}" id="d2map"><div class="d2mapc"><button type="button" class="d2mtog" onclick="S.dv.mapNoSide=!S.dv.mapNoSide;dvMapRefresh()" title="${c.mapNoSide?'Show':'Hide'} the layers panel">${c.mapNoSide?'‹ Layers':'Hide layers ›'}</button><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Facility map of ${esc(dx.name)}"><defs>${defs}<pattern id="d2land" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="var(--map-land)"/><circle cx="1" cy="1" r=".6" fill="var(--map-dot)"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#d2land)"/>${g}</svg>${legend}</div>${side}</div>${play}
   ${dvMapTable()}${miss.length?`<p class="small d2miss">Not on the map – no published GPS found: <b>${miss.map(f=>esc(f.name)).join(', ')}</b>. ${S.canEdit?'Add coordinates in Data Sources → Map layers.':''}</p>`:''}
   `}

  return `<details class="d2mt" open><summary>All ${dxs.length} selected data item${dxs.length>1?'s':''} by facility <span class="small muted">(${c.mapM?M[c.mapM-1]+' '+YEAR:'selected periods'})</span></summary><div class="tw"><table><thead><tr><th>Facility</th>${dxs.map((x,i)=>`<th class="num ${i===Math.min(c.mapDx||0,dxs.length-1)?'on':''}" title="${esc(x.name)}"><button type="button" onclick="S.dv.mapDx=${i};dvMapRefresh()">${esc(x.x.short)}</button></th>`).join('')}</tr></thead><tbody>${fs.map(f=>`<tr><th scope="row">${esc(shortF(f))}</th>${dxs.map(x=>{const v=dvValue(x.x,ms,['F:'+f]);return `<td class="num">${v===null?'<span class="muted">–</span>':esc(fmtV(x.x,v))}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></details>`}

(function(){const tip=document.createElement('div');tip.id='d2tip';tip.setAttribute('role','tooltip');document.body.appendChild(tip);
  document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('#d2out [data-tip]');if(!t){tip.classList.remove('on');return}tip.textContent=t.getAttribute('data-tip');tip.classList.add('on');
    const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.transform=`translate(${x}px,${y}px)`});

/* ---- Data Sources: map layers (GIS) ---- */
function vGeoSrc(){const G=facGeo();const fs=facilities().length?facilities():Object.keys(FAC_GEO);const b=geoBoundary();
  return `<section class="card card-pad d2geo" style="margin-top:var(--space-5)"><h2 style="margin:0 0 4px;font-size:17px">Map layers (GIS)</h2>
   <p class="lead" style="margin-bottom:var(--space-4)">Facility locations and boundaries used by the <b>Facility map</b> in the Data Visualizer. Coordinates for all seven supported facilities come from the <b>HF Rapid Assessment Dashboard</b> (Coordinates sheet, Lumezi Health Zone)${S.geo&&S.geo.importedAt?', imported '+esc(S.geo.importedAt):''}; they agree with the Ministry of Health Facility Navigator to within about 200 m. Only the seven project-supported facilities are mapped.</p>
   <div class="tw"><table><thead><tr><th>Facility</th><th class="num">Latitude</th><th class="num">Longitude</th><th>Source / status</th></tr></thead><tbody>${fs.map(f=>{const g=G[f]||{missing:true};const id=f.replace(/[^A-Za-z]/g,'');
     return `<tr><td>${esc(f)}${g.code?`<div class="small muted">${esc(g.code)}</div>`:''}</td><td class="num">${S.canEdit?`<input type="number" step="any" class="d2cell" id="glat-${id}" value="${g.missing?'':g.lat}" placeholder="-12.5" aria-label="${esc(f)} latitude">`:g.missing?'–':g.lat}</td><td class="num">${S.canEdit?`<input type="number" step="any" class="d2cell" id="glon-${id}" value="${g.missing?'':g.lon}" placeholder="33.0" aria-label="${esc(f)} longitude">`:g.missing?'–':g.lon}</td>
      <td>${g.missing?'<span class="chip t-bad">No GPS found</span>':g.edited?'<span class="chip t-good">Entered in the hub</span>':g.verify?'<span class="chip t-orange">Verify</span>':g.src===HFRA?'<span class="chip t-good">HF Rapid Assessment</span>':'<span class="chip t-warn">Navigator · not confirmed</span>'} ${g.code?`<a class="small" href="https://navigator.ext.pdu.gov.zm/Locations/Location/${esc(g.code)}" target="_blank" rel="noopener">navigator ↗</a>`:''}${g.verify?`<div class="small muted">${esc(g.verify)}</div>`:''}</td></tr>`}).join('')}</tbody></table></div>
   ${S.canEdit?`<div style="display:flex;gap:var(--space-3);margin-top:var(--space-3);flex-wrap:wrap"><button class="btn primary" onclick="geoSaveFac()">Save coordinates</button><span class="small muted" style="align-self:center">Decimal degrees – latitudes south of the equator are negative (e.g. −12.54, 33.04).</span></div>`:''}
   <h3 style="margin:var(--space-5) 0 6px;font-size:15px">District boundary</h3>
   <p class="small muted" style="margin:0 0 10px">${b?`Loaded: <b>${esc(S.geo.boundaryName||'boundary')}</b> – ${geoRings(b).reduce((a,r)=>a+r.length,0).toLocaleString('en-GB')} points, imported ${esc(String(S.geo.boundaryAt||'').slice(0,10))}.`:'No boundary loaded yet.'} Download the Zambia district (ADM2) boundaries as a zipped shapefile or GeoJSON – for example from geoBoundaries (ZMB, ADM2) or HDX (Zambia subnational administrative boundaries) – and import the file here. Only shapes near the supported facilities are kept, simplified for speed.</p>
   ${S.canEdit?`<label class="btn"><input type="file" accept=".zip,.geojson,.json" hidden onchange="geoImport(this.files[0]);this.value=''">${ic('upload')} Import shapefile (.zip) or GeoJSON</label>${b?' <button class="btn ghost" onclick="geoClearB()">Remove boundary</button>':''}`:''}</section>`}
async function geoPut(o){const cur=Object.assign({},S.geo||{},o);await db.doc(dp('meta','geo')).set(cur);S.geo=cur}
function geoSaveFac(){const G=facGeo();const fs=facilities().length?facilities():Object.keys(FAC_GEO);const fac=Object.assign({},(S.geo&&S.geo.fac)||{});let bad='';
  fs.forEach(f=>{const id=f.replace(/[^A-Za-z]/g,'');const la=document.getElementById('glat-'+id),lo=document.getElementById('glon-'+id);if(!la||!lo)return;const a=la.value.trim(),o=lo.value.trim();
    if(a===''&&o===''){delete fac[f];return}const A=Number(a),O=Number(o);if(!isFinite(A)||!isFinite(O)||A<-18.5||A>-8||O<21.5||O>34){bad=f;return}
    const g=G[f]||{};if(!g.edited&&!g.missing&&Math.abs(A-g.lat)<1e-6&&Math.abs(O-g.lon)<1e-6)return;fac[f]={lat:A,lon:O,src:'Entered in the hub',at:iso(today())}});
  if(bad){toast(bad+': enter a location inside Zambia (latitude −8 to −18.5, longitude 21.5 to 34)');return}write(async()=>{await geoPut({fac});toast('Coordinates saved');render()})}
function geoClearB(){if(!confirm('Remove the district boundary layer?'))return;write(async()=>{await geoPut({boundary:'',boundaryName:'',boundaryAt:''});render()})}
async function loadShp(){if(window.shp)return window.shp;for(const u of ['https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js','https://unpkg.com/shpjs@4.0.4/dist/shp.min.js']){try{await new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s)});if(window.shp)return window.shp}catch(e){}}throw new Error('could not load the shapefile reader – export the layer as GeoJSON instead')}
function dpSimplify(pts,tol){if(pts.length<4)return pts;const sq=(p,a,b)=>{let x=a[0],y=a[1],dx=b[0]-x,dy=b[1]-y;if(dx||dy){const t=((p[0]-x)*dx+(p[1]-y)*dy)/(dx*dx+dy*dy);if(t>1){x=b[0];y=b[1]}else if(t>0){x+=dx*t;y+=dy*t}}dx=p[0]-x;dy=p[1]-y;return dx*dx+dy*dy};
  const keep=new Uint8Array(pts.length);keep[0]=keep[pts.length-1]=1;const st=[[0,pts.length-1]];while(st.length){const [a,b]=st.pop();let mx=0,ix=-1;for(let i=a+1;i<b;i++){const d=sq(pts[i],pts[a],pts[b]);if(d>mx){mx=d;ix=i}}if(mx>tol*tol){keep[ix]=1;st.push([a,ix],[ix,b])}}return pts.filter((_,i)=>keep[i])}
async function geoImport(file){if(!file)return;try{toast('Reading '+file.name+'…');let gj;
    if(/\.zip$/i.test(file.name)){const shp=await loadShp();gj=await shp(await file.arrayBuffer());if(Array.isArray(gj))gj={type:'FeatureCollection',features:gj.flatMap(x=>x.features||[])}}
    else gj=JSON.parse(await file.text());
    const feats=gj.type==='FeatureCollection'?gj.features:gj.type==='Feature'?[gj]:[{type:'Feature',properties:{},geometry:gj}];
    const P=Object.values(facGeo()).filter(g=>!g.missing);const la=P.map(g=>g.lat).concat(DIST_PT.lat),lo=P.map(g=>g.lon).concat(DIST_PT.lon);const bb=[Math.min(...lo)-.35,Math.min(...la)-.35,Math.max(...lo)+.35,Math.max(...la)+.35];
    const near=feats.filter(f=>{const R=geoRings(f.geometry);return R.some(r=>r.some(p=>p[0]>=bb[0]&&p[0]<=bb[2]&&p[1]>=bb[1]&&p[1]<=bb[3]))});
    if(!near.length){toast('No shapes in this file are near the supported facilities – check it covers Eastern Province, Zambia (WGS84 longitude/latitude).');return}
    let tol=.0008,out;const simp=t=>near.map(f=>({type:'Feature',properties:{name:(f.properties||{}).shapeName||(f.properties||{}).ADM2_EN||(f.properties||{}).NAME_2||(f.properties||{}).name||''},geometry:{type:'MultiLineString',coordinates:geoRings(f.geometry).map(r=>dpSimplify(r,t).map(p=>[+(+p[0]).toFixed(4),+(+p[1]).toFixed(4)])).filter(r=>r.length>2)}}));
    do{out=simp(tol);tol*=1.8}while(out.reduce((a,f)=>a+f.geometry.coordinates.reduce((b,r)=>b+r.length,0),0)>5000&&tol<.2);
    const names=[...new Set(out.map(f=>f.properties.name).filter(Boolean))];const name=(names.length?names.slice(0,4).join(', ')+(names.length>4?' +'+(names.length-4):''):'')+' – '+file.name;
    write(async()=>{await geoPut({boundary:JSON.stringify({type:'FeatureCollection',features:out}),boundaryName:name,boundaryAt:new Date().toISOString()});toast('Boundary imported: '+near.length+' shape(s)');render()})}
  catch(e){toast('Could not import: '+((e&&e.message)||e))}}
</script>

  const vs=rng(1,lastM()).map(m=>dvValue(dx,[m],ous));return {dx,vs}}).filter(x=>(!ss.dataOnly||x.vs.some(v=>v!==null))&&(!ss.st||calc(x.dx.i).status===ss.st))}

function ssRefresh(){const o=document.getElementById('ssout');if(!o)return;const L=lastM();const K=ssK();o.innerHTML=ssSlide(ssItems(),K);ssFit();
  const r=document.querySelector('.ssbar input[type=range]');if(r)r.value=K===null?0:K+1;const b=document.querySelectorAll('.ssctl .btn');if(b.length===3){b[0].disabled=K===0;b[2].disabled=K!==null&&K>=L-1;b[1].textContent=S._ssT?'❚❚ Pause':'▶ Play';b[1].classList.toggle('primary',!!S._ssT)}}
function ssItem(n){const ss=S.ss;S._ssPaused=false;if(ss.view==='result'){const R=ssResList();ss.ri=Math.max(0,Math.min(R.length-1,ss.ri+n))}else if(ss.view==='ind'){const I=ssIndList();ss.ii=Math.max(0,Math.min(I.length-1,ss.ii+n))}const t=S._ssT;ssStop();ss.k=t?0:null;render();if(t)ssPlay(true)}
function ssStep(n){ssStop();const L=lastM();const k=S.ss.k===null?(n>0?-1:L):S.ss.k;S.ss.k=Math.max(0,Math.min(L-1,k+n));ssRefresh()}
function ssStop(){if(S._ssT){clearInterval(S._ssT);S._ssT=null}S._ssHold=null}
function ssHasNext(){const ss=S.ss;if(ss.view==='grid')return false;const N=ss.view==='result'?ssResList().length:ssIndList().length;return (ss.view==='result'?ss.ri:ss.ii)<N-1}
function ssAdvance(){const ss=S.ss;if(ss.view==='result')ss.ri++;else ss.ii++;ss.k=0;S._ssHold=null;render()}
function ssPlay(keep){if(S._ssT&&!keep){ssStop();ssRefresh();return}ssStop();const L=lastM();S._ssHold=null;
  if(S.ss.k===null)S.ss.k=0;else if(S.ss.k>=L-1){if(ssHasNext()){ssAdvance()}else S.ss.k=0}
  S._ssT=setInterval(()=>{if(S.tab!=='show'||!document.getElementById('ssout')){ssStop();return}const ss=S.ss;
    if(ss.k>=lastM()-1){if(!ssHasNext()||!ss.chain){ssStop();ssRefresh();return}
      if(ss.end==='pause'){ssStop();S._ssPaused=true;ssRefresh();return}
      if(ss.end==='hold'){if(!S._ssHold){S._ssHold=Date.now()+5000;return}if(Date.now()<S._ssHold)return}
      ssAdvance();return}
    ss.k++;ssRefresh()},S.ss.speed||2000);S._ssPaused=false;ssRefresh()}

/* maximize: fit the whole slide into the window without scrolling */
function ssFit(){const out=document.getElementById('ssout');const on=!!(S.ss&&S.ss.focus&&S.tab==='show');document.body.classList.toggle('ssfit',on);if(!out)return;
  if(!on){out.style.height='';const g=out.querySelector('.ssgrid');if(g){g.classList.remove('tiny');g.style.gridTemplateColumns='';g.style.gridAutoRows='';g.style.removeProperty('--s')}return}
  const top=out.getBoundingClientRect().top+scrollY;const H=Math.max(240,innerHeight-top-10);out.style.height=H+'px';
  const note=out.querySelector('.ssnote');const nh=note?note.offsetHeight+8:0;
  const big=out.querySelector('.ssbig');
  if(big){big.style.height=(H-nh)+'px';const ch=big.querySelector('.d2chart');if(ch){const r=ch.getBoundingClientRect();if(r.width>50&&r.height>50){const ar=r.height/r.width;if(!S._ssAR||Math.abs(ar-S._ssAR)/S._ssAR>.04){S._ssAR=ar;out.innerHTML=ssSlide(ssItems(),ssK());const b2=out.querySelector('.ssbig');if(b2)b2.style.height=(H-nh)+'px'}}}return}
  const g=out.querySelector('.ssgrid');if(!g)return;const head=out.querySelector('.sshead');const gh=H-nh-(head?head.offsetHeight+10:0);const W=g.clientWidth;const cards=g.querySelectorAll('.d2mc');const n=cards.length;if(!n)return;
  const gap=10;let best=null;for(let c=1;c<=n;c++){const rows=Math.ceil(n/c);const cw=(W-(c-1)*gap)/c,chh=(gh-(rows-1)*gap)/rows;if(chh<40)continue;const sc=Math.min(cw/1.45,chh);if(!best||sc>best.sc)best={c,rows,cw,ch:chh,sc}}
  if(!best){const c=Math.ceil(Math.sqrt(n*1.6));best={c,rows:Math.ceil(n/c),ch:Math.max(40,(gh-(Math.ceil(n/c)-1)*gap)/Math.ceil(n/c))}}
  g.style.gridTemplateColumns=`repeat(${best.c},minmax(0,1fr))`;g.style.gridAutoRows=Math.floor(best.ch)+'px';const sv=Math.max(.42,Math.min(1.25,best.ch/210));g.style.setProperty('--s',sv.toFixed(3));g.classList.toggle('tiny',sv<.62)}
addEventListener('resize',()=>{if(S.tab==='show'&&S.ss&&S.ss.focus){S._ssAR=null;ssRefresh()}});
function ssFocus(on){const want=on===undefined?!S.ss.focus:on;S.ss.focus=want;S._ssAR=null;render();scrollTo({top:0});
  try{if(want){const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().then(()=>{S._ssFS=true}).catch(()=>{})}
    else if(document.fullscreenElement&&document.exitFullscreen){S._ssFS=false;document.exitFullscreen().catch(()=>{})}}catch(e){}}
function ssFull(){ssFocus(true)}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&S._ssFS){S._ssFS=false;if(S.ss&&S.ss.focus)ssFocus(false)}else if(S.tab==='show'&&S.ss&&S.ss.focus){S._ssAR=null;setTimeout(ssRefresh,60)}});
document.addEventListener('keydown',e=>{if(S.tab!=='show'||!S.ss||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName||'')||(typeof dlg!=='undefined'&&dlg.open))return;
  if(e.key==='ArrowRight'){ssStep(1);e.preventDefault()}else if(e.key==='ArrowLeft'){ssStep(-1);e.preventDefault()}else if(e.key===' '){ssPlay();e.preventDefault()}else if((e.key==='ArrowDown'||e.key==='PageDown')&&S.ss.view!=='grid'){ssItem(1);e.preventDefault()}else if((e.key==='ArrowUp'||e.key==='PageUp')&&S.ss.view!=='grid'){ssItem(-1);e.preventDefault()}else if(e.key==='Escape'&&S.ss.focus){ssFocus(false)}});
</script>

<script>
/* ---------- grouped navigation: tabs organised into drop-down groups ---------- */
const NAVGRP=[['Plan',['mealplan','lf','act','cal']],['Data',['iptt','sources','reach']],['Analyse',['viz','show']],['Quality',['checks','bm','ev']],['Act & account',['actions','frm','notify']],['Learn & report',['train','sar']]];
renderSide=function(){const p=S.proj;const el=document.getElementById('side');
  if(!p){el.innerHTML=`<nav class="gnav" aria-label="Workspace"><a class="gtab on" href="#/">${ic('home')}All projects</a></nav>`;return}
  const od=S.actions.filter(isOverdue).length;const miss=S.ind.filter(missing).length;const badge={actions:od,iptt:miss,notify:(S.loaded&&S.staff.length&&weeklyDue())?1:0};
  const lab=k=>(TABS.find(t=>t[0]===k)||[k,k])[1];const has=k=>TABS.some(t=>t[0]===k);
  const used=new Set(['overview',...NAVGRP.flatMap(g=>g[1])]);const groups=NAVGRP.map(([g,ks])=>[g,ks.filter(has)]);const extra=TABS.map(t=>t[0]).filter(k=>!used.has(k));if(extra.length)groups.push(['More',extra]);
  let h=`<nav class="gnav" aria-label="${esc(p.name)}"><a class="gtab ${S.tab==='overview'?'on':''}" href="#/${p.id}/overview" ${S.tab==='overview'?'aria-current="page"':''}>${ic('overview')}Overview</a>`;
  groups.forEach(([g,ks],gi)=>{if(!ks.length)return;const act=ks.includes(S.tab);const n=ks.reduce((a,k)=>a+(badge[k]||0),0);
    h+=`<div class="gdd"><button type="button" class="gtab ${act?'on':''}" aria-haspopup="true" aria-expanded="false" onclick="gnavOpen(${gi},event)">${ic(act?S.tab:ks[0])}<span>${esc(g)}${act?`<em> · ${esc(lab(S.tab))}</em>`:''}</span>${n?`<span class="count">${n}</span>`:''}<i class="gcar" aria-hidden="true">▾</i></button>
     <div class="gmenu" id="gm${gi}" hidden role="menu">${ks.map(k=>`<a role="menuitem" href="#/${p.id}/${k}" class="${S.tab===k?'on':''}" ${S.tab===k?'aria-current="page"':''} onclick="gnavClose()">${ic(k)}<span>${esc(lab(k))}</span>${badge[k]?`<span class="count">${badge[k]}</span>`:''}</a>`).join('')}</div></div>`});
  h+=`<span class="gsp"></span><label class="gjump"><select aria-label="Go to page" onchange="if(this.value)location.hash='#/${p.id}/'+this.value"><option value="">Go to…</option><option value="overview">Overview</option>${groups.map(([g,ks])=>`<optgroup label="${esc(g)}">${ks.map(k=>`<option value="${k}" ${S.tab===k?'selected':''}>${esc(lab(k))}</option>`).join('')}</optgroup>`).join('')}</select></label></nav>`;
  el.innerHTML=h};
function gnavClose(){document.querySelectorAll('.gmenu').forEach(m=>{m.hidden=true});document.querySelectorAll('.gdd>.gtab').forEach(b=>b.setAttribute('aria-expanded','false'))}
function gnavOpen(i,e){e&&e.stopPropagation();const m=document.getElementById('gm'+i);const was=!m.hidden;gnavClose();if(!was){m.hidden=false;m.previousElementSibling.setAttribute('aria-expanded','true');const r=m.getBoundingClientRect();m.classList.toggle('right',r.right>innerWidth-8);const f=m.querySelector('a');if(f&&e&&e.detail===0)f.focus()}}
document.addEventListener('click',e=>{if(!e.target.closest('.gdd'))gnavClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.gmenu:not([hidden])'))gnavClose()});
addEventListener('hashchange',gnavClose);
</script>

<script>

NAVG.forEach(g=>{const k=g[1].indexOf('show');if(k>=0)g[1].splice(k+1,0,'base')});
NAVGRP.forEach(g=>{const k=g[1].indexOf('show');if(k>=0)g[1].splice(k+1,0,'base')});
TABHELP.base='';
APPS.splice(APPS.findIndex(a=>a[0]==='show')+1,0,['base','Baseline Assessment','HF rapid assessment – equipment, medicines, workforce, IPC, gaps']);
const BS_SECS=[['summary','Summary'],['equipment','Equipment'],['medicines','Medicines & diagnostics'],['nutrition','Nutrition supplies'],['workforce','Workforce'],['training','Training & mentoring'],['ipc','IPC & safety'],['gaps','Gaps & actions'],['partners','Partners']];
const BSC={yes:'#43a047',no:'#e53935',na:'#c9d1d9',a:'#2b6cb0',b:'#2f9e6e',c:'#e07b39',d:'#8e5cc4'};
function bsInit(){if(!S.bs)S.bs={sec:'summary',scope:'sup',mode:'section',k:0,focus:false,speed:7000};
  if(S.hfra===undefined){S.hfra=null;if(db)db.doc(dp('meta','hfra')).get().then(s=>{S.hfra=s.exists?s.data():{};if(S.tab==='base')render()}).catch(()=>{S.hfra={};if(S.tab==='base')render()})}}
const bsHub=n=>n==='Lumezi Hospital'?'Lumezi Mission Hospital':n.replace(/ HP$/,' Health Post').replace(/ RHC$/,' Rural Health Centre');
function bsAllF(){return ((S.hfra||{}).facilities||[]).map(f=>f.name)}
function bsSupported(){const hub=new Set(facilities());return bsAllF().filter(n=>hub.has(bsHub(n)))}
function bsF(){const sc=S.bs.scope;if(sc==='all')return bsAllF();if(sc==='sup')return bsSupported();return bsAllF().includes(sc)?[sc]:bsSupported()}
const bsFac=n=>((S.hfra||{}).facilities||[]).find(f=>f.name===n)||{};
const bsRow=(arr,n)=>(arr||[]).find(r=>r.name===n)||{};
const bsPct=v=>v===null||v===undefined||isNaN(v)?'–':Math.round(v*100)+'%';
const bsNum=v=>v===null||v===undefined||isNaN(v)?'–':(+v).toLocaleString('en-GB',{maximumFractionDigits:1});
const bsTone=v=>v===null||v===undefined?'#9aa5b1':v>=.8?'#43a047':v>=.5?'#f2b705':'#e53935';
/* building blocks */
function bsKpi(label,val,sub,tone){return `<div class="bskpi" style="--t:${tone||'var(--brand-2)'}"><div class="bskl">${esc(label)}</div><div class="bskv">${val}</div>${sub?`<div class="bsks">${sub}</div>`:''}</div>`}
function bsBars(rows,o){o=o||{};const mx=o.max||Math.max(1,...rows.map(r=>r.v||0));return `<div class="bsbars">${rows.map(r=>`<div class="bsbr"><span class="bsbl" title="${esc(r.label)}" ${bsAllF().includes(r.label)?`data-fac="${esc(r.label)}"`:''}>${esc(r.label)}</span><span class="bsbt"><i style="width:${r.v===null||r.v===undefined?0:Math.max(1.5,100*r.v/mx).toFixed(1)}%;background:${r.col||bsTone(o.pct?r.v:null)}"></i></span><b>${r.txt!==undefined?r.txt:(o.pct?bsPct(r.v):bsNum(r.v))}</b></div>`).join('')}</div>`}
function bsStack(rows,keys){const mx=Math.max(1,...rows.map(r=>keys.reduce((a,k)=>a+(r[k[0]]||0),0)));return `<div class="bsbars">${rows.map(r=>{const t=keys.reduce((a,k)=>a+(r[k[0]]||0),0);return `<div class="bsbr"><span class="bsbl">${esc(r.label)}</span><span class="bsbt stack">${keys.map(k=>`<i style="width:${(100*(r[k[0]]||0)/mx).toFixed(1)}%;background:${k[2]}" title="${esc(k[1]+': '+(r[k[0]]||0))}"></i>`).join('')}</span><b>${bsNum(t)}</b></div>`}).join('')}</div><div class="bsleg">${keys.map(k=>`<span><i style="background:${k[2]}"></i>${esc(k[1])}</span>`).join('')}</div>`}
function bsMatrix(items,rows,F,o){o=o||{};const sc=F.map(f=>{const r=rows[f]||[];const ok=r.filter(v=>v===1).length,app=r.filter(v=>v===0||v===1).length;return app?ok/app:null});
  const col=items.map((_,j)=>{const v=F.map(f=>(rows[f]||[])[j]).filter(v=>v===0||v===1);return v.length?v.filter(x=>x===1).length/v.length:null});
  return `<div class="tw bsmx"><table><thead><tr><th>Facility</th>${items.map(it=>`<th class="c"><span>${esc(it)}</span></th>`).join('')}<th class="num">${esc(o.scoreLabel||'Available')}</th></tr></thead><tbody>${F.map((f,i)=>`<tr><th scope="row" data-fac="${esc(f)}">${esc(f)}</th>${items.map((it,j)=>{const v=(rows[f]||[])[j];return `<td class="c ${v===1?'y':v===0?'n':'x'}" title="${esc(f+' – '+it+': '+(v===1?'Yes':v===0?'No':'N/A'))}">${v===1?'✓':v===0?'✗':'–'}</td>`}).join('')}<td class="num"><b style="color:${bsTone(sc[i])}">${bsPct(sc[i])}</b></td></tr>`).join('')}</tbody>
   <tfoot><tr><th>% of facilities</th>${col.map(v=>`<td class="c"><b style="color:${bsTone(v)}">${bsPct(v)}</b></td>`).join('')}<td></td></tr></tfoot></table></div>`}
const bsH=(t,s)=>`<div class="bsh"><h3>${esc(t)}</h3>${s?`<span class="small muted">${esc(s)}</span>`:''}</div>`;

/* sections */
function bsSummary(F){const H=S.hfra;const fs=F.map(bsFac);const wf=F.map(f=>bsRow(H.workforce,f));const tw=wf.reduce((a,r)=>a+(r.total||0),0),tm=wf.reduce((a,r)=>a+(r.mentored||0),0);
  const pop=fs.reduce((a,f)=>a+(typeof f.pop==='number'?f.pop:0),0);const avg=k=>{const v=fs.map(f=>f[k]).filter(x=>typeof x==='number');return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  const noPiped=fs.filter(f=>!/piped/i.test(f.water||'')).length;const types=['Hospital','RHC','HP'].map(t=>[t,fs.filter(f=>f.type===t).length]).filter(x=>x[1]).map(x=>x[1]+' '+x[0]).join(' · ');
  const kp=`<div class="bskpis">${bsKpi('Facilities assessed',F.length,types)}${bsKpi('Health workers',bsNum(tw),'on the staff roster')}${bsKpi('Catchment population',bsNum(pop),fs.some(f=>typeof f.pop!=='number')?'hospital catchment not reported':'')}${bsKpi('Equipment available',bsPct(avg('equip')),'average score',bsTone(avg('equip')))}${bsKpi('Medicines available',bsPct(avg('meds')),'average score',bsTone(avg('meds')))}${bsKpi('No piped water',noPiped,'facilities',noPiped?'#e53935':'#43a047')}${bsKpi('HCWs mentored',bsPct(tw?tm/tw:null),tm+' of '+tw,bsTone(tw?tm/tw:null))}</div>`;
  const sc=bsH('Equipment and medicine scores')+`<div class="bsbars two">${fs.map(f=>`<div class="bsbr"><span class="bsbl">${esc(f.name)}</span><span class="bsbt dual"><i style="width:${(100*(f.equip||0)).toFixed(0)}%;background:${BSC.a}" title="Equipment ${bsPct(f.equip)}"></i><i style="width:${(100*(f.meds||0)).toFixed(0)}%;background:${BSC.b}" title="Medicines ${bsPct(f.meds)}"></i></span><b>${bsPct(f.equip)} · ${bsPct(f.meds)}</b></div>`).join('')}</div><div class="bsleg"><span><i style="background:${BSC.a}"></i>Equipment</span><span><i style="background:${BSC.b}"></i>Medicines</span></div>`;
  const ut=bsH('Water and power')+`<div class="tw"><table><thead><tr><th>Facility</th><th>Type</th><th class="num">Catchment</th><th class="num">Beds</th><th>Water</th><th>Power</th></tr></thead><tbody>${fs.map(f=>`<tr><th scope="row">${esc(f.name)}</th><td>${esc(f.type||'')}</td><td class="num">${bsNum(f.pop)}</td><td class="num">${bsNum(f.beds)}</td><td><span class="bstag ${/piped/i.test(f.water||'')?'ok':/none/i.test(f.water||'')?'bad':'warn'}">${esc(f.water||'–')}</span></td><td><span class="bstag ${/non-func/i.test(f.power||'')?'bad':/grid/i.test(f.power||'')?'ok':'warn'}">${esc(f.power||'–')}</span></td></tr>`).join('')}</tbody></table></div>`;
  return kp+bsGrid(sc,ut)}
function bsAvail(items,rows,F){return items.map((it,j)=>{const v=F.map(f=>(rows[f]||[])[j]).filter(v=>v===0||v===1);return {label:it,v:v.length?v.filter(x=>x===1).length/v.length:null}}).sort((a,b)=>(a.v??2)-(b.v??2))}
function bsEquip(F){const E=S.hfra.equipment;return bsGrid(bsH('Equipment by facility','✓ available · ✗ missing')+bsMatrix(E.items,E.rows,F,{scoreLabel:'Score'}),bsH('Most often missing','share of facilities with each item')+bsBars(bsAvail(E.items,E.rows,F),{pct:true,max:1}))}
function bsMeds(F){const G=S.hfra.medicines;return bsGrid(bsH(G[0].name)+bsMatrix(G[0].items,G[0].rows,F),bsH(G[1].name)+bsMatrix(G[1].items,G[1].rows,F),bsH('Availability across facilities','N/A excluded')+bsBars(bsAvail([...G[0].items,...G[1].items],Object.fromEntries(F.map(f=>[f,[...(G[0].rows[f]||[]),...(G[1].rows[f]||[])]])),F),{pct:true,max:1}))}
function bsNutr(F){const G=S.hfra.medicines[2];return bsGrid(bsH(G.name)+bsMatrix(G.items,G.rows,F),bsH('Availability across facilities','N/A excluded')+bsBars(bsAvail(G.items,G.rows,F),{pct:true,max:1}))}
function bsWork(F){const H=S.hfra;const wf=F.map(f=>Object.assign({label:f},bsRow(H.workforce,f)));const cad={};F.forEach(f=>Object.entries((H.cadres||{})[f]||{}).forEach(([k,v])=>{k=k.replace(/\./g,'').replace(/\s+/g,' ').trim();cad[k]=(cad[k]||0)+v}));
  const cr=Object.entries(cad).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([k,v],i)=>({label:k,v,col:pal(i)}));
  return bsGrid(bsH('Staff by sex')+bsStack(wf,[['female','Female','#d64d6f'],['male','Male','#2b6cb0']]),bsH('Employment')+bsStack(wf,[['grz','GRZ employed','#2f9e6e'],['vol','Volunteers','#c99a1c']]),bsH('Mentoring rate','HCWs mentored ÷ HCWs on roster')+bsBars(wf.map(r=>({label:r.label,v:r.total?Math.min(1,r.mentored/r.total):null,txt:(r.mentored??'–')+' / '+(r.total??'–')})),{pct:true,max:1}),bsH('Cadre mix','from the staff roster')+bsBars(cr))}
function bsTrain(F){const H=S.hfra;const tr=F.map(f=>Object.assign({label:f},bsRow(H.training,f)));const pr=p=>/critical/i.test(p||'')?'#e53935':/high/i.test(p||'')?'#ef8f00':'#2b6cb0';
  return bsGrid(bsH('Trained, oriented and mentored HCWs')+bsStack(tr,[['trained','Trained','#2b6cb0'],['oriented','Oriented','#1aa3b5'],['mentored','Mentored','#2f9e6e']]),
   bsH('Training coverage by discipline','all 13 assessed facilities')+bsBars((H.disciplines||[]).map(d=>({label:d.name,v:d.cov,col:pr(d.priority),txt:(d.n??0)+' HCWs · '+bsPct(d.cov)})),{max:Math.max(.1,...(H.disciplines||[]).map(d=>d.cov||0))})+`<div class="bsleg"><span><i style="background:#e53935"></i>Critical gap</span><span><i style="background:#ef8f00"></i>High priority</span><span><i style="background:#2b6cb0"></i>Medium</span></div>`,
   bsH('Facility notes')+`<ul class="bsnotes">${tr.map(r=>`<li><b>${esc(r.label)}</b> ${esc(r.note||'')}</li>`).join('')}</ul>`)}
function bsIpc(F){const G=S.hfra.ipc;return bsGrid(bsH(G[0].name,'by service area')+bsMatrix(G[0].items,G[0].rows,F,{scoreLabel:'Compliant'}),bsH(G[1].name,'by service area')+bsMatrix(G[1].items,G[1].rows,F,{scoreLabel:'Compliant'}),bsH(G[2].name)+bsMatrix(G[2].items,G[2].rows,F))}
const BS_THEMES=[['Water',/water|piped/i],['Equipment',/equipment|bed|scale|couch|fridge|tools/i],['Medicines & commodities',/drug|medicine|stock|commodit|rutf|antibiotic|supplement|feed|mnp/i],['Skills & HR',/skill|capacity|\bhr\b|human|staff/i],['IPC & waste',/waste|handwash|ipc/i],['Power',/power|solar/i],['Infrastructure & space',/roof|infrastructure|space|rehabilit|ward/i],['Registers & data',/register|data/i]];
function bsGaps(F){const H=S.hfra;const g=F.map(f=>bsRow(H.gaps,f));const th=BS_THEMES.map(([t,re],i)=>({label:t,v:g.filter(r=>re.test(r.gaps||'')).length,col:pal(i),txt:g.filter(r=>re.test(r.gaps||'')).length+' of '+g.length}));
  return bsGrid(bsH('Most common gaps','facilities mentioning each theme')+bsBars(th.sort((a,b)=>b.v-a.v),{max:Math.max(1,g.length)}),`<div class="bsgaps">${g.map(r=>`<div class="bsgc"><div class="bsgn">${esc(r.name)}<span class="small muted"> ${esc(r.type||'')}</span></div><div class="bsgk"><b>Gaps</b> ${esc(r.gaps||'–')}</div><div class="bsga"><b>Actions</b> ${esc(r.actions||'–')}</div></div>`).join('')}</div>`)}
function bsPartners(F){const P=(S.hfra.partners||[]).filter(p=>F.includes(p.facility));const none=F.filter(f=>!P.some(p=>p.facility===f));
  return bsGrid(bsH('Partner support',P.length+' active partner link'+(P.length===1?'':'s'))+bsBars([{label:'Facilities with a partner',v:F.length-none.length,col:'#2f9e6e'},{label:'Facilities without a partner',v:none.length,col:'#e53935'}],{max:Math.max(1,F.length)})+(P.length?`<div class="tw"><table><thead><tr><th>Partner</th><th>Facility</th><th>Focus</th><th>Activities</th></tr></thead><tbody>${P.map(p=>`<tr><th scope="row" title="${esc(p.full||'')}">${esc(p.org)}</th><td>${esc(p.facility)}</td><td>${esc(p.focus||'')}</td><td>${esc(p.activities||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">No partner support recorded for these facilities.</p>'),
   bsH('Facilities without partner support')+(none.length?`<ul class="bsnotes">${none.map(f=>`<li><b>${esc(f)}</b> ${esc(bsRow(S.hfra.gaps,f).actions||'')}</li>`).join('')}</ul>`:'<p class="small muted">All facilities have partner support.</p>'))}
function bsFacility(f){const H=S.hfra;const x=bsFac(f),w=bsRow(H.workforce,f),t=bsRow(H.training,f),g=bsRow(H.gaps,f);const P=(H.partners||[]).filter(p=>p.facility===f);
  const miss=(items,row)=>items.filter((_,j)=>(row||[])[j]===0);const em=miss(H.equipment.items,H.equipment.rows[f]);const mm=miss([...H.medicines[0].items,...H.medicines[1].items],[...(H.medicines[0].rows[f]||[]),...(H.medicines[1].rows[f]||[])]);const nm=miss(H.medicines[2].items,H.medicines[2].rows[f]);
  const comp=gr=>{const r=gr.rows[f]||[];const a=r.filter(v=>v===0||v===1);return a.length?a.filter(v=>v===1).length/a.length:null};
  const tags=l=>l.length?l.map(i=>`<span class="bstag bad">${esc(i)}</span>`).join(' '):'<span class="bstag ok">None missing</span>';
  return `<div class="bskpis">${bsKpi('Type',esc(x.type||'–'))}${bsKpi('Catchment population',bsNum(x.pop))}${bsKpi('Health workers',bsNum(w.total),(w.female??'–')+' female · '+(w.male??'–')+' male')}${bsKpi('Equipment',bsPct(x.equip),'score',bsTone(x.equip))}${bsKpi('Medicines',bsPct(x.meds),'score',bsTone(x.meds))}${bsKpi('Waste separation',bsPct(comp(H.ipc[0])),'service areas',bsTone(comp(H.ipc[0])))}${bsKpi('Handwashing',bsPct(comp(H.ipc[1])),'service areas',bsTone(comp(H.ipc[1])))}</div>`+
   bsGrid(bsH('Missing equipment')+tags(em)+bsH('Missing medicines & diagnostics')+tags(mm)+bsH('Missing nutrition supplies')+tags(nm),
     bsH('Utilities and people')+`<div class="bsfl"><div><b>Water</b> <span class="bstag ${/piped/i.test(x.water||'')?'ok':/none/i.test(x.water||'')?'bad':'warn'}">${esc(x.water||'–')}</span></div><div><b>Power</b> <span class="bstag ${/non-func/i.test(x.power||'')?'bad':/grid/i.test(x.power||'')?'ok':'warn'}">${esc(x.power||'–')}</span></div><div><b>Trained / oriented / mentored</b> ${bsNum(t.trained)} / ${bsNum(t.oriented)} / ${bsNum(t.mentored)}</div><div><b>Partner</b> ${P.length?P.map(p=>esc(p.org+' – '+(p.focus||''))).join('; '):'None'}</div>${w.cadres?`<div><b>Cadres</b> ${esc(w.cadres)}</div>`:''}</div>`,
     bsH('Key gaps')+`<p class="bsp">${esc(g.gaps||'–')}</p>`+bsH('Recommended actions')+`<p class="bsp">${esc(g.actions||'–')}</p>`)}
const BS_FN={summary:bsSummary,equipment:bsEquip,medicines:bsMeds,nutrition:bsNutr,workforce:bsWork,training:bsTrain,ipc:bsIpc,gaps:bsGaps,partners:bsPartners};
/* slides */
function bsSlides(){const b=S.bs;if(b.mode==='facility')return bsF().map(f=>['f',f]);return BS_SECS.map(s=>['s',s[0]])}
function bsSlideHtml(){const b=S.bs;const F=bsF();const L=bsSlides();const k=Math.max(0,Math.min(L.length-1,b.mode==='facility'?b.k:BS_SECS.findIndex(s=>s[0]===b.sec)));const [t,id]=L[k]||['s','summary'];
  const scopeTxt=b.scope==='sup'?'7 supported facilities':b.scope==='all'?'All 13 assessed facilities':b.scope;
  const title=t==='f'?id:(BS_SECS.find(s=>s[0]===id)||['',''])[1];const body=t==='f'?bsFacility(id):BS_FN[id](F);
  return `<div class="bsslide" key="${t+id}"><div class="bshead"><div><div class="ssbc">Baseline · HF rapid assessment · ${esc(S.hfra.date||'')}</div><div class="ssttl">${esc(title)}</div><div class="small muted">${t==='f'?esc(bsFac(id).type||''):esc(scopeTxt)} · slide ${k+1} of ${L.length}</div></div></div>${body}</div>`}
function vBase(){bsInit();const b=S.bs;document.body.classList.toggle('d2focus',!!b.focus);if(S.hfra===null)return '<div class="empty">Loading baseline assessment…</div>';if(!S.hfra.facilities)return '<div class="card empty">No baseline assessment loaded.</div>';
  const all=bsAllF(),sup=bsSupported();const L=bsSlides();const k=b.mode==='facility'?Math.min(b.k,L.length-1):BS_SECS.findIndex(s=>s[0]===b.sec);
  const bar=`<div class="card ssbar bsbar"><div class="ssviews" role="group" aria-label="Slideshow by"><button class="btn sm ${b.mode==='section'?'primary':''}" onclick="bsMode('section')">By section</button><button class="btn sm ${b.mode==='facility'?'primary':''}" onclick="bsMode('facility')">By facility</button></div>
   <div class="ssctl"><button class="btn" onclick="bsStep(-1)" aria-label="Previous slide" ${k<=0?'disabled':''}>‹</button><button class="btn ${S._bsT?'primary':''}" onclick="bsPlay()">${S._bsT?'❚❚ Pause':'▶ Slideshow'}</button><button class="btn" onclick="bsStep(1)" aria-label="Next slide" ${k>=L.length-1?'disabled':''}>›</button></div>
   ${b.mode==='section'?`<select class="bspick" aria-label="Section" onchange="bsStop();S.bs.sec=this.value;render()">${BS_SECS.map(([v,n])=>`<option value="${v}" ${b.sec===v?'selected':''}>${n}</option>`).join('')}</select>`:`<select class="bspick" aria-label="Facility" onchange="bsStop();S.bs.k=+this.value;render()">${L.map((s,i)=>`<option value="${i}" ${i===k?'selected':''}>${esc(s[1])}</option>`).join('')}</select>`}
   <div class="ssopt"><select aria-label="Facilities" onchange="bsStop();S.bs.scope=this.value;S.bs.k=0;render()"><option value="sup" ${b.scope==='sup'?'selected':''}>7 supported facilities</option><option value="all" ${b.scope==='all'?'selected':''}>All 13 assessed</option><optgroup label="One facility">${all.map(f=>`<option ${b.scope===f?'selected':''}>${esc(f)}</option>`).join('')}</optgroup></select>
    <select aria-label="Sort facilities" onchange="S.bs.sort=this.value;S.bs.k=0;render()">${[['listed','Order: as assessed'],['ready','Order: readiness'],['name','Order: A–Z']].map(([v,n])=>`<option value="${v}" ${(b.sort||'listed')===v?'selected':''}>${n}</option>`).join('')}</select>
    <select aria-label="Speed" onchange="S.bs.speed=+this.value;if(S._bsT){bsStop();bsPlay()}">${[[4000,'Fast'],[7000,'Normal'],[12000,'Slow']].map(([v,n])=>`<option value="${v}" ${b.speed===v?'selected':''}>${n}</option>`).join('')}</select></div>
   <button class="btn ssfs ${b.focus?'primary':''}" onclick="bsFocus()">${b.focus?'✕ Exit':'⛶ Full screen'}</button></div>`;
  setTimeout(bsFit,0);return bar+`<div id="bsout">${bsSlideHtml()}</div>`}
function bsMode(m){bsStop();S.bs.mode=m;S.bs.k=0;render()}
function bsStep(n){const b=S.bs;const L=bsSlides();if(b.mode==='facility')b.k=Math.max(0,Math.min(L.length-1,b.k+n));else{const i=BS_SECS.findIndex(s=>s[0]===b.sec);b.sec=BS_SECS[Math.max(0,Math.min(BS_SECS.length-1,i+n))][0]}const t=S._bsT;render();if(t&&!S._bsT)bsPlay()}
function bsStop(){if(S._bsT){clearInterval(S._bsT);S._bsT=null}}
function bsPlay(){if(S._bsT){bsStop();render();return}S._bsT=setInterval(()=>{if(S.tab!=='base'){bsStop();return}const b=S.bs;const L=bsSlides();const k=b.mode==='facility'?b.k:BS_SECS.findIndex(s=>s[0]===b.sec);
  if(k>=L.length-1){if(b.mode==='facility')b.k=0;else b.sec=BS_SECS[0][0]}else{if(b.mode==='facility')b.k++;else b.sec=BS_SECS[k+1][0]}render()},S.bs.speed||7000);render()}
function bsFocus(on){const want=on===undefined?!S.bs.focus:on;S.bs.focus=want;render();scrollTo({top:0});
  try{if(want){const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().then(()=>{S._bsFS=true}).catch(()=>{})}else if(document.fullscreenElement&&document.exitFullscreen){S._bsFS=false;document.exitFullscreen().catch(()=>{})}}catch(e){}}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&S._bsFS){S._bsFS=false;if(S.bs&&S.bs.focus)bsFocus(false)}else if(S.tab==='base')setTimeout(bsFit,80)});
/* full screen: scale the slide so all of it is visible */
function bsFit(){const out=document.getElementById('bsout');const on=!!(S.bs&&S.bs.focus&&S.tab==='base');document.body.classList.toggle('bsfit',on);if(!out)return;const sl=out.querySelector('.bsslide');if(!sl)return;
  sl.style.transform='';sl.style.width='';out.style.height='';if(!on)return;const top=out.getBoundingClientRect().top+scrollY;const H=Math.max(240,innerHeight-top-8);out.style.height=H+'px';
  const h=sl.scrollHeight;const s=Math.min(1,H/h);if(s<1){sl.style.width=(100/s)+'%';sl.style.transform=`scale(${s})`;const h2=sl.scrollHeight;const s2=Math.min(1,H/h2);sl.style.width=(100/s2)+'%';sl.style.transform=`scale(${s2})`}}
addEventListener('resize',()=>{if(S.tab==='base')bsFit()});
document.addEventListener('keydown',e=>{if(S.tab!=='base'||!S.bs||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName||'')||(typeof dlg!=='undefined'&&dlg.open))return;
  if(e.key==='ArrowRight'){bsStep(1);e.preventDefault()}else if(e.key==='ArrowLeft'){bsStep(-1);e.preventDefault()}else if(e.key===' '){bsPlay();e.preventDefault()}else if(e.key==='Escape'&&S.bs.focus){bsFocus(false)}});
</script>

<script>
/* ---------- Baseline Assessment v2: readiness scorecard, comparison, key findings, drill-down ---------- */
const BS_DOM=[['equip','Equipment'],['meds','Maternal medicines'],['diag','Diagnostics'],['nutr','Nutrition supplies'],['waste','Waste separation'],['hand','Handwashing'],['ppe','PPE'],['mentor','Mentoring'],['water','Water'],['power','Power']];
BS_SECS.splice(1,0,['scorecard','Readiness scorecard']);BS_SECS.push(['compare','Compare facilities']);
function bsAvailF(gr,f){const r=((gr||{}).rows||{})[f]||[];const a=r.filter(v=>v===0||v===1);return a.length?a.filter(v=>v===1).length/a.length:null}
function bsDom(f){const H=S.hfra,x=bsFac(f),w=bsRow(H.workforce,f);const wat=x.water||'',pw=x.power||'';
  const o={equip:typeof x.equip==='number'?x.equip:bsAvailF(H.equipment,f),meds:typeof x.meds==='number'?x.meds:bsAvailF(H.medicines[0],f),diag:bsAvailF(H.medicines[1],f),nutr:bsAvailF(H.medicines[2],f),
    waste:bsAvailF(H.ipc[0],f),hand:bsAvailF(H.ipc[1],f),ppe:bsAvailF(H.ipc[2],f),mentor:w.total?Math.min(1,w.mentored/w.total):null,
    water:/piped ✓/i.test(wat)?1:/borehole ✓/i.test(wat)?.5:/piped/i.test(wat)?.75:0,power:/non-func/i.test(pw)?0:/grid/i.test(pw)?1:/solar/i.test(pw)?.5:0};
  const v=BS_DOM.map(d=>o[d[0]]).filter(x=>x!==null&&x!==undefined);o.ready=v.length?v.reduce((a,b)=>a+b,0)/v.length:null;return o}
function bsAvgDom(F){const o={};[...BS_DOM.map(d=>d[0]),'ready'].forEach(k=>{const v=F.map(f=>bsDom(f)[k]).filter(x=>x!==null&&x!==undefined);o[k]=v.length?v.reduce((a,b)=>a+b,0)/v.length:null});return o}
const bsIsFac=n=>bsAllF().includes(n);
/* sort facilities */
const _bsF=bsF;bsF=function(){const F=_bsF();const s=(S.bs||{}).sort||'listed';if(s==='ready')return F.slice().sort((a,b)=>(bsDom(b).ready||0)-(bsDom(a).ready||0));if(s==='name')return F.slice().sort((a,b)=>a.localeCompare(b));return F};
/* radar */
function bsRadar(series,labels,size){const W=size||420,H=W*.9,cx=W/2,cy=H/2+4,R=Math.min(W,H)/2-86,n=labels.length;const P=(k,f)=>[cx+R*f*Math.sin(2*Math.PI*k/n),cy-R*f*Math.cos(2*Math.PI*k/n)];let g='';
  [.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${labels.map((_,k)=>P(k,f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`});
  labels.forEach((l,k)=>{const [x,y]=P(k,1),[lx,ly]=P(k,1.2);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/><text class="axis" x="${lx}" y="${ly+4}" text-anchor="${Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end'}">${esc(l)}</text>`});
  series.forEach(s=>{const pts=s.vals.map((v,k)=>P(k,v===null||v===undefined?0:v));g+=`<polygon class="d2pop" points="${pts.map(p=>p.join(',')).join(' ')}" fill="${s.col}" fill-opacity="${s.dash?0:.16}" stroke="${s.col}" stroke-width="2.2" ${s.dash?'stroke-dasharray="6 4"':''}/>`+pts.map((p,k)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${s.col}"><title>${esc(s.name+' – '+labels[k]+': '+bsPct(s.vals[k]))}</title></circle>`).join('')});
  return `<div class="bsradar"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Readiness profile">${g}</svg><div class="bsleg">${series.map(s=>`<span><i style="background:${s.col}"></i>${esc(s.name)}</span>`).join('')}</div></div>`}
/* readiness map of facilities with GPS */
function bsMap(F){const pts=F.map(f=>{const g=(typeof facGeo==='function'?facGeo():{})[bsHub(f)];return g&&!g.missing?{f,lat:g.lat,lon:g.lon,r:bsDom(f).ready}:null}).filter(Boolean);if(pts.length<2)return '';
  const W=520,H=360,pad=40;const la=pts.map(p=>p.lat),lo=pts.map(p=>p.lon);const kx=Math.cos(((Math.min(...la)+Math.max(...la))/2)*Math.PI/180);const sx=(Math.max(...lo)-Math.min(...lo))*kx||.1,sy=(Math.max(...la)-Math.min(...la))||.1;const sc=Math.min((W-2*pad)/sx,(H-2*pad)/sy);
  const X=p=>W/2+(p.lon-(Math.min(...lo)+Math.max(...lo))/2)*kx*sc,Y=p=>H/2-(p.lat-(Math.min(...la)+Math.max(...la))/2)*sc;
  return `<svg class="bsmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Facility readiness map"><rect width="${W}" height="${H}" rx="12" fill="var(--map-land)"/>${pts.map(p=>`<g data-fac="${esc(p.f)}" class="bsmp"><circle cx="${X(p)}" cy="${Y(p)}" r="${6+10*(p.r||0)}" fill="${bsTone(p.r)}" fill-opacity=".85" stroke="#fff" stroke-width="2"><title>${esc(p.f+' – readiness '+bsPct(p.r))}</title></circle><text class="d2ml bsml" x="${X(p)+9+10*(p.r||0)}" y="${Y(p)+4}">${esc(p.f.replace(/ (HP|RHC)$/,''))} ${bsPct(p.r)}</text></g>`).join('')}</svg>`}
/* readiness scorecard */
function bsScorecard(F){const D=F.map(f=>Object.assign({f},bsDom(f)));const rk=D.slice().sort((a,b)=>(b.ready||0)-(a.ready||0));const av=bsAvgDom(F);
  const heat=`<div class="tw bshm"><table><thead><tr><th>Facility</th>${BS_DOM.map(d=>`<th class="c"><span>${esc(d[1])}</span></th>`).join('')}<th class="num">Readiness</th></tr></thead><tbody>${rk.map(r=>`<tr><th scope="row" data-fac="${esc(r.f)}">${esc(r.f)}</th>${BS_DOM.map(d=>{const v=r[d[0]];return `<td class="c hmc" style="${v===null||v===undefined?'':`background:color-mix(in srgb,${bsTone(v)} 26%,var(--surface));color:color-mix(in srgb,${bsTone(v)} 70%,#000)`}" title="${esc(r.f+' – '+d[1]+': '+bsPct(v))}">${bsPct(v)}</td>`}).join('')}<td class="num"><b style="color:${bsTone(r.ready)}">${bsPct(r.ready)}</b></td></tr>`).join('')}</tbody>
    <tfoot><tr><th>Average</th>${BS_DOM.map(d=>`<td class="c"><b style="color:${bsTone(av[d[0]])}">${bsPct(av[d[0]])}</b></td>`).join('')}<td class="num"><b>${bsPct(av.ready)}</b></td></tr></tfoot></table></div>`;
  let cmp='';if(S.bs.scope==='all'){const sup=bsSupported(),oth=bsAllF().filter(f=>!sup.includes(f));const a=bsAvgDom(sup),o=bsAvgDom(oth);
    cmp=bsH('Supported vs other facilities','average by domain')+`<div class="bsbars two">${[...BS_DOM,['ready','Readiness']].map(d=>`<div class="bsbr"><span class="bsbl">${esc(d[1])}</span><span class="bsbt dual"><i style="width:${(100*(a[d[0]]||0)).toFixed(0)}%;background:${BSC.a}"></i><i style="width:${(100*(o[d[0]]||0)).toFixed(0)}%;background:#9aa5b1"></i></span><b>${bsPct(a[d[0]])} · ${bsPct(o[d[0]])}</b></div>`).join('')}</div><div class="bsleg"><span><i style="background:${BSC.a}"></i>7 supported</span><span><i style="background:#9aa5b1"></i>${oth.length} others</span></div>`}
  return bsGrid(bsH('Readiness by domain','% – click a facility for its profile')+heat,bsH('Readiness ranking','average of the 10 domains')+bsBars(rk.map(r=>({label:r.f,v:r.ready})),{pct:true,max:1})+bsH('Weakest domains','average across facilities')+bsBars(BS_DOM.map(d=>({label:d[1],v:av[d[0]]})).sort((a,b)=>(a.v??2)-(b.v??2)),{pct:true,max:1}),
    (bsMap(F)?bsH('Readiness map','bubble size and colour = readiness')+bsMap(F):'')+cmp+bsH('How readiness is scored')+`<p class="small muted" style="margin:0">Average of 10 domains, each 0–100%: equipment and maternal-medicine scores from the assessment; diagnostics, nutrition supplies and PPE = share of applicable items available; waste separation and handwashing = share of service areas compliant; mentoring = HCWs mentored ÷ HCWs on roster; water = piped 100%, borehole working 50%, none/broken 0%; power = grid 100%, solar 50%, non-functional 0%. Calculated in the hub.</p>`)}
/* compare two facilities */
function bsCompare(F){const b=S.bs;const all=bsAllF();if(!b.cmpA||!all.includes(b.cmpA))b.cmpA=F[0];if(!b.cmpB||!all.includes(b.cmpB))b.cmpB=F.find(f=>f!==b.cmpA)||F[0];
  const A=bsDom(b.cmpA),B=bsDom(b.cmpB),av=bsAvgDom(F);const sel=(k,v)=>`<select aria-label="Facility ${k}" onchange="S.bs.cmp${k}=this.value;bsRe()">${all.map(f=>`<option ${f===v?'selected':''}>${esc(f)}</option>`).join('')}</select>`;
  const rows=[...BS_DOM,['ready','Readiness']].map(d=>{const a=A[d[0]],c=B[d[0]];const df=a!==null&&c!==null&&a!==undefined&&c!==undefined?Math.round((a-c)*100):null;return `<tr><th scope="row">${esc(d[1])}</th><td class="num"><span class="bscb"><i style="width:${(100*(a||0)).toFixed(0)}%;background:${BSC.a}"></i></span><b>${bsPct(a)}</b></td><td class="num"><span class="bscb"><i style="width:${(100*(c||0)).toFixed(0)}%;background:${BSC.c}"></i></span><b>${bsPct(c)}</b></td><td class="num ${df===null||df===0?'muted':df>0?'up':'dn'}">${df===null?'–':(df>0?'+':'')+df+' pts'}</td></tr>`}).join('');
  return `<div class="bscmpsel"><span class="bsdot" style="background:${BSC.a}"></span>${sel('A',b.cmpA)}<b>vs</b><span class="bsdot" style="background:${BSC.c}"></span>${sel('B',b.cmpB)}</div>`+
   bsGrid(bsH('Readiness profile','dashed = average of selected scope')+bsRadar([{name:b.cmpA,vals:BS_DOM.map(d=>A[d[0]]),col:BSC.a},{name:b.cmpB,vals:BS_DOM.map(d=>B[d[0]]),col:BSC.c},{name:'Average',vals:BS_DOM.map(d=>av[d[0]]),col:'#9aa5b1',dash:true}],BS_DOM.map(d=>d[1]),460),
     bsH('Domain by domain')+`<div class="tw bscmp"><table><thead><tr><th>Domain</th><th class="num">${esc(b.cmpA)}</th><th class="num">${esc(b.cmpB)}</th><th class="num">Difference</th></tr></thead><tbody>${rows}</tbody></table></div>`)}

  const dn=`<div class="card bsc bsdns4">${[['Facility types',bsDonut(ty,F.length,'facilities')],['Water source',bsDonut(wat,F.length,'facilities')],['Power',bsDonut(pw,F.length,'facilities')],['Health workers',bsDonut([{label:'Female',v:T('female'),col:'#d64d6f'},{label:'Male',v:T('male'),col:'#2b6cb0'}],T('total'),'HCWs')]].map(([t,d])=>`<div>${bsH(t)}${d}</div>`).join('')}</div>`;

function bsNotes(F){const H=S.hfra;const n=[];F.forEach(f=>{const x=bsFac(f),w=bsRow(H.workforce,f),t=bsRow(H.training,f);
  if(typeof x.staff==='number'&&typeof w.total==='number'&&x.staff!==w.total)n.push([f,'Staff count',`Summary sheet ${x.staff} vs Workforce sheet ${w.total} (the hub uses ${w.total}).`]);
  if(typeof t.staff==='number'&&typeof t.mentored==='number'&&t.mentored>t.staff)n.push([f,'Mentoring',`Training sheet shows ${t.mentored} mentored out of ${t.staff} staff (${Math.round(100*t.mentored/t.staff)}%).`]);
  if(typeof x.female==='number'&&typeof x.male==='number'&&typeof x.staff==='number'&&x.female+x.male!==x.staff)n.push([f,'Sex split',`Summary sheet: ${x.female} female + ${x.male} male ≠ ${x.staff} staff.`]);
  if(typeof x.pop!=='number')n.push([f,'Catchment','Catchment population not reported.']);
  const ipc=bsRow(H.workforce,f);if(H.ipc[0].rows[f]&&H.ipc[0].rows[f].filter(v=>v===1).length>6)n.push([f,'Waste separation',`${H.ipc[0].rows[f].filter(v=>v===1).length} compliant areas recorded against 6 standard areas (includes SBCU and theatre).`])});
  return bsGrid(bsH('Points to verify in the assessment file',n.length+' found')+(n.length?`<div class="tw"><table><thead><tr><th>Facility</th><th>Item</th><th>What differs</th></tr></thead><tbody>${n.map(r=>`<tr><th scope="row" data-fac="${esc(r[0])}">${esc(r[0])}</th><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">No inconsistencies found.</p>'),
    bsH('Source')+`<div class="bsfl"><div><b>File</b> ${esc(H.source||'')}</div><div><b>Assessment</b> ${esc(H.title||'')} · ${esc(H.date||'')}</div><div><b>Sheets used</b> Summary, Equipment, Medicines, Workforce (counts and cadres only), Training, IPC & Safety, Gaps & Actions, Partners</div><div><b>Not stored</b> Staff names from the roster</div></div>`)}
BS_FN.notes=bsNotes;

<script>
/* ---------- clickable alerts: go to the place that needs attention and highlight it ---------- */
function hlIds(kind){const st=s=>S.ind.filter(i=>calc(i).status===s).map(i=>i.id);
  return {missing:()=>S.ind.filter(missing).map(i=>i.id),bad:()=>st('bad'),warn:()=>st('warn'),notarget:()=>st('notarget'),flag:()=>S.ind.filter(i=>i.flag).map(i=>i.id),
    overdue:()=>S.actions.filter(isOverdue).map(a=>a.id),open:()=>S.actions.filter(a=>a.status==='Open'||a.status==='In progress').map(a=>a.id),nocontact:()=>S.actions.filter(a=>(a.status==='Open'||a.status==='In progress')&&!(a.whatsapp||staffNum(a.owner))).map(a=>a.id),
    frm:()=>(S.frm||[]).filter(f=>f.status!=='Closed'&&frmSla(f).overdue).map(f=>f.id),frmopen:()=>(S.frm||[]).filter(f=>f.status!=='Closed').map(f=>f.id),
    wp:()=>(S.act||[]).filter(a=>wpState(a)==='Not updated'||wpState(a)==='Behind schedule').map(a=>a.id),staff:()=>(S.staff||[]).filter(x=>!waNum(x.whatsapp)).map(x=>x.id),
    train:()=>(S.trainings||[]).filter(t=>!t.date).map(t=>t.id)}[kind]||(()=>[])}
function hlGo(kind){const ids=hlIds(kind)();const ld=cycle().latestDue;const mm=inYear(ld)?M[ld.getMonth()]:'latest';
  const D={missing:['iptt',`${ids.length} indicator${ids.length===1?'':'s'} missing ${mm} data`,()=>{S.f.ipm='table';S.f.st='missing'}],bad:['iptt',`${ids.length} off-track indicator${ids.length===1?'':'s'}`,()=>{S.f.ipm='table';S.f.st='bad'}],
    warn:['iptt',`${ids.length} indicator${ids.length===1?'':'s'} needing attention`,()=>{S.f.ipm='table';S.f.st='warn'}],notarget:['iptt',`${ids.length} indicator${ids.length===1?'':'s'} without a target`,()=>{S.f.ipm='table';S.f.st='notarget'}],
    flag:['iptt',`${ids.length} indicator${ids.length===1?'':'s'} to verify`,()=>{S.f.ipm='table';S.f.st='flag'}],overdue:['actions',`${ids.length} overdue action${ids.length===1?'':'s'}`,()=>{S.f.ast='Overdue'}],
    open:['actions',`${ids.length} open action${ids.length===1?'':'s'}`,()=>{S.f.ast=''}],nocontact:['actions',`${ids.length} open action${ids.length===1?'':'s'} without a contact`,()=>{S.f.ast=''}],
    frm:['frm',`${ids.length} feedback case${ids.length===1?'':'s'} past response time`,()=>{}],frmopen:['frm',`${ids.length} open feedback case${ids.length===1?'':'s'}`,()=>{}],wp:['act',`${ids.length} activit${ids.length===1?'y':'ies'} behind or not updated`,()=>{}],
    staff:['notify',`${ids.length} staff without a WhatsApp number`,()=>{}],weekly:['notify','Weekly summary due',()=>{}],train:['train',`${ids.length} training${ids.length===1?'':'s'} without a date`,()=>{}],
    due:['iptt','Enter this month\'s values',()=>{S.f.ipm='form';const c=cycle();S.f.em=c.nextPer.getMonth()+1}]}[kind];
  if(!D)return;S.f.res='';S.f.q='';D[2]();S.hl={kind,tab:D[0],ids,label:D[1],scrolled:false};if(S.tab===D[0])render();else go(D[0])}
function hlClear(){if(S.hl&&S.hl.tab==='iptt')S.f.st='';if(S.hl&&S.hl.tab==='actions')S.f.ast='';S.hl=null;render()}
function hlApply(){const h=S.hl;if(!h)return;if(h.tab!==S.tab){S.hl=null;return}const v=document.getElementById('view');if(!v)return;
  if(!v.querySelector('.hlbar'))v.insertAdjacentHTML('afterbegin',`<div class="hlbar" role="status"><span class="hldot"></span><b>${esc(h.label)}</b>${h.ids.length?'<span class="small">highlighted below</span>':''}<button class="btn sm" onclick="hlClear()">✕ Clear</button></div>`);
  let first=null;h.ids.forEach(id=>{v.querySelectorAll(`[onclick*="'${id}'"]`).forEach(el=>{const row=el.closest('tr,li,.card,.wp-row')||el;row.classList.add('hl');if(!first)first=row})});
  if(first&&!h.scrolled){h.scrolled=true;setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'center'}),60)}}
const _renderHl=render;render=function(){_renderHl();try{hlApply()}catch(e){}};
/* alert counts in the navigation open the matching list */
const BADGE_KIND={iptt:'missing',actions:'overdue',notify:'weekly'};
document.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('.gnav .count');if(!c)return;const a=c.closest('a[href]');let k=a?(a.getAttribute('href').split('/').pop()):null;
  if(!k){const gm=c.closest('.gdd');const links=gm?[...gm.querySelectorAll('.gmenu a')].filter(x=>x.querySelector('.count')):[];if(links.length===1)k=links[0].getAttribute('href').split('/').pop()}
  if(k&&BADGE_KIND[k]){e.preventDefault();e.stopPropagation();gnavClose();hlGo(BADGE_KIND[k])}},true);
</script>

<script>
/* ---------- ACTIONS ---------- */
function vActions(){
  const all=S.actions;const k=s=>all.filter(a=>a.status===s).length;const closed=k('Closed');const od=all.filter(isOverdue).length;
  const f=S.f;const facs=[...new Set(all.map(a=>a.facility).filter(Boolean))].sort();const srcs=[...new Set(all.map(a=>a.source).filter(Boolean))].sort();
  let L=[...all];if(f.afac)L=L.filter(a=>a.facility===f.afac);if(f.asrc)L=L.filter(a=>a.source===f.asrc);
  if(f.ast==='Overdue')L=L.filter(isOverdue);else if(f.ast)L=L.filter(a=>a.status===f.ast);
  if(f.aq)L=L.filter(a=>(a.finding+' '+a.action+' '+a.id).toLowerCase().includes(f.aq.toLowerCase()));
  let h=`<div class="grid g-kpi" style="margin-bottom:var(--space-5)">
   <div class="card kpi none"><div class="l"><span class="dot"></span>Total</div><div class="v">${all.length}</div><div class="s">${all.length?Math.round(closed/all.length*100):0}% closed</div></div>
   <div class="card kpi bad"><div class="l"><span class="dot"></span>Open</div><div class="v">${k('Open')}</div><div class="s">${k('In progress')} in progress</div></div>
   <div class="card kpi red"><div class="l"><span class="dot"></span>Overdue</div><div class="v">${od}</div><div class="s">past deadline, not closed</div></div>
   <div class="card kpi good"><div class="l"><span class="dot"></span>Closed</div><div class="v">${closed}</div><div class="s">${k('Cancelled')} cancelled</div></div></div>
  <div class="toolbar"><select aria-label="Status" onchange="S.f.ast=this.value;render()">${opt(['','Open','In progress','Overdue','Closed','Cancelled'],f.ast||'').replace('>—<','>All statuses<')}</select>
   <select aria-label="Source" onchange="S.f.asrc=this.value;render()">${opt(['',...srcs],f.asrc||'').replace('>—<','>All sources<')}</select>
   <select aria-label="Facility" onchange="S.f.afac=this.value;render()">${opt(['',...facs],f.afac||'').replace('>—<','>All facilities<')}</select>
   <input class="grow" type="search" placeholder="Search findings and actions…" aria-label="Search actions" value="${esc(f.aq||'')}" oninput="S.f.aq=this.value;clearTimeout(window._q);window._q=setTimeout(()=>{render();const e=document.querySelector('.toolbar input[type=search]');e.focus();e.setSelectionRange(e.value.length,e.value.length)},250)">
   ${S.canEdit?`<button class="btn primary" onclick="editAction()">${ic('plus')} New action</button>`:''}</div>
  <div class="tw"><table><thead><tr><th>ID</th><th>Raised</th><th>Source</th><th style="min-width:240px">Finding</th><th style="min-width:220px">Action agreed</th><th>Owner</th><th>Deadline</th><th>Status</th><th class="num">Days open</th><th>Notify</th></tr></thead><tbody>`;
  if(!L.length)h+=`<tr><td colspan="10" class="empty">${all.length?'No actions match these filters.':'No actions logged yet.'}</td></tr>`;
  for(const a of L.sort((x,y)=>(x.id<y.id?1:-1))){const o=isOverdue(a);const dOpen=a.raised?days(parse(a.raised),a.closedDate?parse(a.closedDate):today()):'';
    const short=t=>{t=String(t||'');return t.length>170?esc(t.slice(0,170))+'…':esc(t)};
    h+=`<tr class="click" onclick="editAction('${a.id}')"><td><b>${esc(a.id)}</b></td><td class="nowrap">${esc(a.raised)}</td><td>${esc(a.source)}${a.facility?'<div class="small muted">'+esc(a.facility)+'</div>':''}</td><td class="small">${short(a.finding)}</td><td class="small">${short(a.action)}</td><td class="small">${esc(a.owner)}</td><td class="nowrap">${esc(a.deadline)||'<span class="muted">–</span>'}</td><td>${chip(o?'t-bad':statusTone(a.status),o?'Overdue':a.status)}</td><td class="num calc">${dOpen}</td><td class="nowrap">${waNum(a.whatsapp||staffNum(a.owner))?`<button class="btn sm" title="Send WhatsApp update to ${esc(a.owner||'')}" onclick="event.stopPropagation();sendActionWa('${a.id}')">${ic('send')} Send</button>`:`<span class="small muted" title="Add the owner's WhatsApp number in Notifications or on the action">No number</span>`}</td></tr>`}
  return h+`</tbody></table></div>`;
}
function staffNum(role){const st=(S.staff||[]).find(x=>x.role===role);return st&&st.whatsapp?st.whatsapp:''}
function actOwnerChanged(sel){const w=document.querySelector('#af [name=whatsapp]');if(w&&(w.dataset.auto==='1'||!w.value.trim())){w.value=staffNum(sel.value);w.dataset.auto='1'}}
function actionMsg(a){const o=isOverdue(a);return [`*OHNEZ MEAL Hub – action update*`,`*${a.id}*${a.facility?' · '+a.facility:''}${a.source?' · '+a.source:''}`,'',a.finding?`*Finding:* ${String(a.finding).slice(0,400)}`:'',`*Action agreed:* ${String(a.action||'').slice(0,400)}`,`*Owner:* ${a.owner||'–'}`,`*Deadline:* ${a.deadline||'–'}${o?' – OVERDUE':''}`,`*Status:* ${o?'Overdue':a.status||'Open'}`,'','Please update progress and evidence of closure in the MEAL Hub Action Tracker.'].filter(x=>x!=='').join('\n').replace('*Owner:*','\n*Owner:*')}
function sendActionWa(id,fromForm){let a=Object.assign({},S.actions.find(x=>x.id===id)||{id});
  if(fromForm&&document.getElementById('af')){const o=formData('#af');Object.assign(a,o)}
  const num=waNum(a.whatsapp||staffNum(a.owner));if(!num){toast('Add a WhatsApp number for this action or its owner first');return}
  const url='https://wa.me/'+num+'?text='+encodeURIComponent(actionMsg(a));let w=null;try{w=window.open(url,'_blank');if(w)w.opener=null}catch(e){}
  if(!w)waFallback(num,actionMsg(a),url);
  if(db&&S.canEdit){const st=(S.staff||[]).find(x=>x.role===a.owner);const nid='N'+Date.now();write(()=>db.doc(dp('notifications',nid)).set({at:new Date().toISOString(),type:'action',action:a.id,to:a.owner||'',name:st?st.name||'':'',number:'+'+num}))}}
function waFallback(num,text,url){document.getElementById('dlgT').textContent='Send on WhatsApp';
  document.getElementById('dlgB').innerHTML=`<p class="lead">Your browser blocked WhatsApp from opening automatically. Use one of these:</p>
   <ol class="small" style="margin:0 0 var(--space-3);padding-left:18px"><li><a class="btn primary" href="${url}" target="_blank" rel="noopener">Open WhatsApp</a></li><li style="margin-top:8px">Or copy the message and paste it into WhatsApp to <b>${fmtNum(num)}</b>.</li></ol>
   <textarea id="wafb" class="nmsg" readonly>${esc(text)}</textarea>`;
  document.getElementById('dlgF').innerHTML=`<button class="btn" onclick="copyTxt('wafb')">Copy message</button><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('${url}').then(()=>toast('Link copied'))">Copy link</button><button class="btn primary" onclick="dlg.close()">Done</button>`;if(!dlg.open)dlg.showModal()}
function nextId(list,prefix){let mx=0;list.forEach(x=>{const n=parseInt(String(x.id).split('-')[1]);if(n>mx)mx=n});return prefix+'-'+String(mx+1).padStart(3,'0')}
function editAction(id){
  const a=id?S.actions.find(x=>x.id===id):{id:nextId(S.actions,'AT'),raised:iso(today()),status:'Open'};if(!a)return;
  document.getElementById('dlgT').textContent=(id?'Action ':'New action ')+a.id;
  const bmOpts=['',...S.bm.map(b=>'#'+b.n+' '+b.activity.split('(')[0].split('–')[0].trim())];
  document.getElementById('dlgB').innerHTML=`<div class="form" id="af">
   <label>Date raised<input type="date" name="raised" value="${esc(a.raised)}" ${dis()}></label>
   <label>Source<select name="source" ${dis()}>${opt(['',...AT_SOURCES],a.source||'')}</select></label>
   <label>Facility<input type="text" name="facility" list="hfs" value="${esc(a.facility)}" ${dis()}><datalist id="hfs">${HFS.map(x=>`<option value="${x}">`).join('')}</datalist></label>
   <label>Benchmark # / activity<select name="benchmark" ${dis()}>${opt(bmOpts.includes(a.benchmark||'')?bmOpts:[...bmOpts,a.benchmark],a.benchmark||'')}</select></label>
   <label class="full">Finding<textarea name="finding" ${dis()}>${esc(a.finding)}</textarea></label>
   <label class="full">Action agreed<textarea name="action" ${dis()}>${esc(a.action)}</textarea></label>
   <label>Owner<select name="owner" ${dis()} onchange="actOwnerChanged(this)">${opt(['',...new Set([...(a.owner&&!owners().includes(a.owner)?[a.owner]:[]),...owners()])],a.owner||'')}</select></label>
   <label>Deadline<input type="date" name="deadline" value="${esc(a.deadline)}" ${dis()}></label>
   <label>WhatsApp contact for updates<input type="tel" name="whatsapp" value="${esc(a.whatsapp||staffNum(a.owner))}" placeholder="+260 97 123 4567" ${dis()} data-auto="${a.whatsapp?'':'1'}"><span class="small muted">Fills from the owner's number in Notifications; you can type another.</span></label>
   <label>Status<select name="status" ${dis()}>${opt(AT_STATUS,a.status)}</select></label>
   <label>Date closed<input type="date" name="closedDate" value="${esc(a.closedDate)}" ${dis()}></label>
   <label class="full">Evidence of closure<input type="text" name="evidence" value="${esc(a.evidence)}" ${dis()}></label></div>`;
  document.getElementById('dlgF').innerHTML=S.canEdit?`${id?`<button class="btn ghost" style="margin-right:auto" onclick="if(confirm('Delete ${a.id}?')){dlg.close();write(()=>db.doc(dp('actions','${a.id}')).delete())}">Delete</button>`:''}<button class="btn" onclick="dlg.close()">Cancel</button><button class="btn" onclick="sendActionWa('${a.id}',true)">${ic('send')} Send notification</button><button class="btn primary" onclick="saveAction('${a.id}')">Save</button>`:`<button class="btn" onclick="sendActionWa('${a.id}',true)">${ic('send')} Send notification</button><button class="btn" onclick="dlg.close()">Close</button>`;
  dlg.showModal();
}
function formData(sel){const o={};document.querySelectorAll(sel+' [name]').forEach(e=>o[e.name]=e.value.trim());return o}
function saveAction(id){const o=formData('#af');if(!o.action){alert('Enter the action agreed.');return}
  if(o.whatsapp&&!waNum(o.whatsapp)){alert('Enter a valid WhatsApp number, e.g. +260 97 123 4567');return}
  if(o.whatsapp&&waNum(o.whatsapp)===waNum(staffNum(o.owner)))o.whatsapp='';
  if(o.status==='Closed'&&!o.closedDate)o.closedDate=iso(today());const prev=S.actions.find(x=>x.id===id)||{};o.id=id;dlg.close();write(()=>db.doc(dp('actions',id)).set(Object.assign({},prev,o)))}

/* ---------- BENCHMARKS ---------- */
function vBm(){
  const q='Q'+(Math.floor(today().getMonth()/3)+1);const k=s=>bmVis().filter(b=>(b.ratings||{})[q]===s).length;
  let h=`<div class="grid g-kpi" style="margin-bottom:var(--space-5)"><div class="card kpi good"><div class="l"><span class="dot"></span>${q} met</div><div class="v">${k('Met')}</div></div><div class="card kpi warn"><div class="l"><span class="dot"></span>${q} partly met</div><div class="v">${k('Partly met')}</div></div><div class="card kpi bad"><div class="l"><span class="dot"></span>${q} not met</div><div class="v">${k('Not met')}</div></div><div class="card kpi none"><div class="l"><span class="dot"></span>Not yet rated</div><div class="v">${bmVis().filter(b=>!(b.ratings||{})[q]).length}</div><div class="s">of ${bmVis().length} benchmarks</div></div></div>
  <p class="lead">Rate each benchmark every quarter. Any “Partly met” or “Not met” needs an Action Tracker entry.</p>
  <div class="tw"><table><thead><tr><th>#</th><th style="min-width:200px">Key activity</th><th style="min-width:260px">Quality benchmark</th><th>Checklist / tool <span style="text-transform:none;font-weight:400">(tick if applicable)</span></th><th>Owner</th>${['Q1','Q2','Q3','Q4'].map(x=>`<th class="${x===q?'cur':''}">${x}</th>`).join('')}</tr></thead><tbody>`;
  for(const b of bmVis())h+=`<tr><td class="muted">${b.n}</td><td><b>${esc(b.activity)}</b><div class="small muted">${esc(b.frequency)}</div></td><td class="small">${esc(b.benchmark)}</td><td style="min-width:200px"><ul class="tl">${bmTools(b).map((x,k)=>{const on=!!(b.tools||{})[k];return `<li><label><input type="checkbox" ${on?'checked':''} ${dis()} onchange="tickTool('${b.id}',${k},this.checked)" aria-label="${esc(x)} applicable"><span class="${on||!toolsSet(b)?'':'off'}">${esc(x)}</span></label></li>`}).join('')}</ul></td><td class="small">${esc(b.owner)}</td>${['Q1','Q2','Q3','Q4'].map(x=>{const v=(b.ratings||{})[x]||'';return `<td style="min-width:122px"><select aria-label="${x} rating" class="${statusTone(v)}" style="width:100%" ${dis()} onchange="rateBm('${b.id}','${x}',this.value)">${opt(BM_RATE,v)}</select></td>`}).join('')}</tr>`;
  if(!S.bm.length)h+=`<tr><td colspan="9" class="empty">No benchmarks set up for this project.</td></tr>`;
  return h+`</tbody></table></div>`;
}
function rateBm(id,q,v){write(()=>db.doc(dp('benchmarks',id)).update({ratings:{[q]:v}}))}

/* ---------- FRM ---------- */
function frmPri(f){const c=f.category||'';if(f.sensitive==='Yes'||/\(refer\)/.test(c))return 'P1';if(/Information|Appreciation|Suggestion/.test(c))return 'P3';return 'P2'}
function frmSla(f){const p=frmPri(f);const d0=parse(f.date);if(!d0)return {p,ok:null};const lim=p==='P1'?1:p==='P2'?14:7;const end=f.closed?parse(f.closed):(f.status==='Referred'&&f.ack?parse(f.ack):null);
  const due=new Date(d0.getTime()+lim*864e5);const ackOk=f.ack?days(d0,parse(f.ack))<=(p==='P1'?1:3):null;const ok=end?days(d0,end)<=lim:(today()>due?false:null);return {p,lim,due,ok,ackOk,overdue:!end&&today()>due&&f.status!=='Closed'}}
function vFrmDesign(){const d=S.frmDesign||{};if(!d.purpose)return '';const f=S.f;
