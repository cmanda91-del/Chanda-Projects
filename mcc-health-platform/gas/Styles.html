<style>
:root { --brand:#0f5f5c; --brand-d:#0a4644; --bg:#f3f5f7; --panel:#fff; --line:#d9dee3; --fg:#1d2a33; --muted:#5f6f7a; --ok:#1b7f3b; --warn:#a15c00; --bad:#b3261e; --sel:#e6f2f1; --r:6px; }
* { box-sizing: border-box; }
body { margin:0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:var(--fg); background:var(--bg); }
h1 { font-size:20px; margin:0 0 12px; font-weight:600; } h2 { font-size:18px; margin:0 0 8px; } h3 { font-size:15px; margin:0 0 10px; }
a { color:var(--brand); }
.small { font-size:12.5px; } .muted { color:var(--muted); } .grow { flex:1; margin:0; } .spacer { flex:1; }
[hidden] { display:none !important; }
input, select, textarea { font:inherit; color:var(--fg); background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:7px 9px; width:100%; }
input:focus, select:focus, textarea:focus { outline:2px solid color-mix(in srgb, var(--brand) 40%, transparent); border-color:var(--brand); }
label { display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted); }
label.inline { flex-direction:row; align-items:center; gap:6px; white-space:nowrap; }
.btn { font:inherit; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:var(--r); padding:7px 12px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.btn:hover { border-color:var(--brand); } .btn:disabled { opacity:.5; cursor:not-allowed; }
.btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; } .btn.primary:hover { background:var(--brand-d); }
.btn.ghost { background:transparent; } .btn.light { color:#fff; border-color:rgba(255,255,255,.4); }
.btn.sm { padding:3px 8px; font-size:12.5px; } .btn.danger { color:var(--bad); }
.msg { color:var(--bad); font-size:13px; min-height:1em; } .msg.ok { color:var(--ok); }
.stack { display:flex; flex-direction:column; gap:12px; }
/* auth */
.auth { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; background:linear-gradient(160deg, var(--brand) 0 38%, var(--bg) 38%); }
.auth-card { width:100%; max-width:420px; background:#fff; border-radius:10px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,.12); }
.brand-row { display:flex; gap:10px; align-items:center; margin-bottom:18px; }
.logo { display:inline-grid; place-items:center; width:32px; height:32px; border-radius:8px; background:var(--brand); color:#fff; font-weight:700; }
.topbar .logo { background:#fff; color:var(--brand); width:26px; height:26px; }
.brand { font-weight:700; letter-spacing:.2px; }
/* shell */
.topbar { position:sticky; top:0; z-index:20; height:48px; display:flex; align-items:center; gap:10px; padding:0 12px; background:var(--brand); color:#fff; }
.icon-btn { background:none; border:0; color:#fff; font-size:20px; cursor:pointer; display:none; }
.who { font-size:12.5px; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40vw; }
.layout { display:flex; min-height:calc(100vh - 48px); }
.sidenav { width:220px; flex:none; background:#fff; border-right:1px solid var(--line); padding:10px 0; position:sticky; top:48px; height:calc(100vh - 48px); overflow:auto; }
.nav { display:block; padding:9px 16px; color:var(--fg); text-decoration:none; border-left:3px solid transparent; }
.nav:hover { background:var(--bg); } .nav.active { background:var(--sel); border-left-color:var(--brand); font-weight:600; }
.main { flex:1; min-width:0; padding:18px; position:relative; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:14px; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0; }
.bar input[type=search] { flex:1; min-width:180px; width:auto; } .bar select { width:auto; min-width:160px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-bottom:14px; }
.tile { background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; }
.tile b { display:block; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; } .tile span { color:var(--muted); font-size:12.5px; }
.tile.alert b { color:var(--warn); }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:12px; }
.grid4 { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:8px; }
table.t { width:100%; border-collapse:collapse; background:#fff; font-size:13px; }
.tw { overflow:auto; border:1px solid var(--line); border-radius:var(--r); max-height:65vh; background:#fff; }
table.t th { position:sticky; top:0; background:#eef1f4; text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); white-space:nowrap; font-weight:600; z-index:1; }
table.t td { padding:6px 9px; border-bottom:1px solid var(--line); vertical-align:top; max-width:28rem; }
table.t tr.click { cursor:pointer; } table.t tr.click:hover td { background:var(--sel); }
.pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; background:#eef1f4; }
.pill.ok { background:#e3f3e8; color:var(--ok); } .pill.warn { background:#fff1dc; color:var(--warn); } .pill.bad { background:#fde8e6; color:var(--bad); }
/* person */
.person-head { display:flex; flex-wrap:wrap; gap:6px 24px; } .person-head div span { display:block; font-size:12px; color:var(--muted); }
.stages { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
.card.match { border-color:#c7dcf2; margin-bottom:8px; }
.risk { background:#fde8e6; color:var(--bad); border:1px solid #f3c1bc; padding:8px 12px; border-radius:var(--r); margin-bottom:10px; font-weight:600; }
.info { background:#e8f1fb; color:#164d80; border:1px solid #c7dcf2; padding:8px 12px; border-radius:var(--r); margin-bottom:10px; }
/* forms */
.form-head { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px; }
fieldset.sec { border:1px solid var(--line); border-radius:var(--r); background:#fff; margin:0 0 12px; padding:0; }
fieldset.sec legend { font-weight:600; padding:0 6px; margin-left:10px; }
.sec-body { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:12px 18px; padding:10px 14px 14px; }
.fld .req { color:var(--bad); } .fld .help { font-size:11.5px; color:var(--muted); }
.fld.auto input, .fld.auto select { background:#f1f4f6; }
.fld .fmsg { font-size:12px; color:var(--warn); } .fld .fmsg.err { color:var(--bad); }
.radios, .checks { display:flex; flex-wrap:wrap; gap:4px 12px; color:var(--fg); font-size:13px; }
.radios label, .checks label { flex-direction:row; align-items:center; gap:5px; color:var(--fg); font-size:13px; }
.radios input, .checks input { width:auto; }
.sticky-actions { position:sticky; bottom:0; background:var(--bg); padding:10px 0; border-top:1px solid var(--line); }
.toast { position:fixed; right:16px; bottom:16px; background:#1d2a33; color:#fff; padding:10px 14px; border-radius:var(--r); opacity:0; transition:opacity .2s; pointer-events:none; z-index:50; max-width:80vw; }
.toast.show { opacity:.95; }
.preview { margin-top:10px; } pre.txt { white-space:pre-wrap; max-height:280px; overflow:auto; background:#f7f8fa; border:1px solid var(--line); border-radius:var(--r); padding:10px; font-size:12px; }
@media (max-width: 760px) {
  .icon-btn { display:block; }
  .sidenav { position:fixed; top:48px; bottom:0; left:0; z-index:30; transform:translateX(-100%); transition:transform .2s; box-shadow:2px 0 12px rgba(0,0,0,.15); }
  .sidenav.open { transform:none; }
  .main { padding:12px; }
  .who { display:none; }
}
</style>
