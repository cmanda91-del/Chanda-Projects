<script>
(function () {
'use strict';
var META = window.MCC_META;
var S = { token: null, user: null, ous: [], allOus: [], person: null, enrollment: null, form: null, browse: { offset: 0, total: 0 } };
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v === undefined || v === null || v === false) return;
    if (k === 'text') e.textContent = v;
    else if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  (kids || []).forEach(function (c) { if (c !== null && c !== undefined) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 3200); }
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

// ---------- server calls ----------
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) {
      var m = (err && err.message) || String(err);
      if (m.indexOf('SESSION_EXPIRED') >= 0) { signOutLocal(); showAuth('login', 'Your session ended. Please sign in again.'); }
      reject(new Error(m.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '')));
    })[fn].apply(null, args);
  });
}
function busy(btn, on) { if (btn) { btn.disabled = on; } }

// ---------- dates ----------
function iso(d) { var z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
function today() { return iso(new Date()); }
function addDays(s, n) { var d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); }
function daysBetween(a, b) { return Math.round((new Date(String(b).slice(0, 10) + 'T00:00:00') - new Date(String(a).slice(0, 10) + 'T00:00:00')) / 86400000); }
function yearsBetween(a, b) { var x = new Date(a), y = new Date(b); var n = y.getFullYear() - x.getFullYear(); if (y.getMonth() < x.getMonth() || (y.getMonth() === x.getMonth() && y.getDate() < x.getDate())) n--; return n; }
function has(v) { return v !== undefined && v !== null && String(v) !== ''; }
function num(v) { return has(v) ? Number(v) : NaN; }

// ================= AUTH =================
function showAuth(which, msg) {
  $('#shell').hidden = true; $('#auth').hidden = false;
  $('#login-form').hidden = which !== 'login'; $('#signup-form').hidden = which !== 'signup'; $('#pending').hidden = which !== 'pending';
  var m = $('#auth-msg'); m.textContent = msg || ''; m.className = 'msg';
  if (which === 'signup') fillOuSelect($('#signup-form [name=org_unit]'), S.allOus, true);
}
$$('[data-go]').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); showAuth(a.dataset.go); }); });
$('#login-form').addEventListener('submit', function (e) {
  e.preventDefault(); var f = e.target, b = f.querySelector('button'); busy(b, true); $('#auth-msg').textContent = '';
  api('login', f.email.value, f.password.value).then(function (r) {
    S.token = r.token; S.user = r.user; store('mcc_token', r.token); f.password.value = ''; enterApp();
  }).catch(function (err) { $('#auth-msg').textContent = err.message; }).then(function () { busy(b, false); });
});
$('#signup-form').addEventListener('submit', function (e) {
  e.preventDefault(); var f = e.target, b = f.querySelector('button');
  if (f.password.value !== f.password2.value) { $('#auth-msg').textContent = 'Passwords do not match.'; return; }
  busy(b, true);
  api('signup', { name: f.name.value, email: f.email.value, phone: f.phone.value, org_unit: f.org_unit.value, role: f.role.value, password: f.password.value })
    .then(function (r) { f.reset(); if (r.status === 'APPROVED') showAuth('login', 'Administrator account created. Sign in.'); else showAuth('pending'); })
    .catch(function (err) { $('#auth-msg').textContent = err.message; }).then(function () { busy(b, false); });
});
function signOutLocal() { S.token = null; S.user = null; store('mcc_token', null); }
$('#logout').addEventListener('click', function () { var t = S.token; signOutLocal(); api('logout', t).catch(function () {}); showAuth('login', 'Signed out.'); });

function can(what) {
  var r = S.user && S.user.role;
  if (what === 'admin') return r === 'ADMIN';
  if (what === 'entry') return ['ADMIN', 'CLINICIAN', 'DATA_ASSOCIATE'].indexOf(r) >= 0;
  if (what === 'pii') return ['ADMIN', 'CLINICIAN', 'DATA_ASSOCIATE', 'DISTRICT_VIEWER'].indexOf(r) >= 0;
  return false;
}
function enterApp() {
  $('#auth').hidden = true; $('#shell').hidden = false;
  $('#who').textContent = S.user.name + ' · ' + S.user.role.replace('_', ' ').toLowerCase();
  $$('[data-need]').forEach(function (x) { x.hidden = !can(x.dataset.need); });
  api('myOrgUnits', S.token).then(function (ous) {
    S.ous = ous;
    [$('#cap-ou'), $('#up-ou')].forEach(function (s) { fillOuSelect(s, ous, false); if (S.user.org_unit && ous.some(function (o) { return o.code === S.user.org_unit; })) s.value = S.user.org_unit; });
    show('home');
  });
}
/** Facility pickers: grouped by district/programme (OHNEZ – Lumezi, IMNCHN – Mongu). facilitiesOnly hides provinces and districts. */
function fillOuSelect(sel, ous, placeholder, facilitiesOnly) {
  sel.replaceChildren();
  if (placeholder) sel.append(el('option', { value: '', text: 'Select…' }));
  var all = S.allOus && S.allOus.length ? S.allOus : ous, nameOf = {}; all.forEach(function (o) { nameOf[o.code] = o; });
  var higher = ous.filter(function (o) { return o.level < 4; }).sort(function (a, b) { return a.level - b.level || String(a.name).localeCompare(b.name); });
  if (!facilitiesOnly) higher.forEach(function (o) { sel.append(el('option', { value: o.code, text: '\u00a0'.repeat((o.level - 1) * 2) + o.name })); });
  var groups = {};
  ous.filter(function (o) { return o.level >= 4; }).forEach(function (o) { (groups[o.parent_code] = groups[o.parent_code] || []).push(o); });
  Object.keys(groups).sort().forEach(function (pc) {
    var d = nameOf[pc] || {}, g = el('optgroup', { label: (d.program ? d.program + ' – ' : '') + (d.name || pc) });
    groups[pc].sort(function (a, b) { return String(a.name).localeCompare(b.name); }).forEach(function (o) { g.append(el('option', { value: o.code, text: o.name })); });
    sel.append(g);
  });
}

// ================= NAV =================
function show(v) {
  $$('.view').forEach(function (x) { x.hidden = x.id !== 'v-' + v; });
  $$('.nav').forEach(function (a) { a.classList.toggle('active', a.dataset.view === v); });
  $('#sidenav').classList.remove('open');
  if (v === 'home') loadHome();
  if (v === 'upload') loadUploads();
  if (v === 'browse') loadTables();
  if (v === 'admin') loadAdmin();
  if (v === 'odk') loadOdk();
  if (v === 'analytics') { if (!AN.data) loadAnalytics(); }
  window.scrollTo(0, 0);
}
$$('.nav').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); show(a.dataset.view); }); });
$('#menu-toggle').addEventListener('click', function () { $('#sidenav').classList.toggle('open'); });

// ================= HOME =================
function loadHome() {
  $('#tiles').replaceChildren(el('div', { class: 'muted', text: 'Loading…' }));
  api('homeStats', S.token).then(function (s) {
    $('#home-sub').textContent = 'Figures for your assigned org units. Month: ' + s.month + '.';
    var t = [['Women registered', s.persons], ['Active pregnancies', s.activeEnrollments], ['Events this month', s.eventsThisMonth], ['High-risk bookings', s.highRiskBookings, 'alert'], ['Files uploaded', s.uploads]];
    if (s.pendingUsers !== null) t.push(['Accounts awaiting approval', s.pendingUsers, s.pendingUsers ? 'alert' : '']);
    $('#tiles').replaceChildren.apply($('#tiles'), t.map(function (x) { return el('div', { class: 'tile ' + (x[2] || '') }, [el('b', { text: Number(x[1]).toLocaleString() }), el('span', { text: x[0] })]); }));
  }).catch(function (e) { $('#tiles').replaceChildren(el('div', { class: 'msg', text: e.message })); });
}

// ================= CAPTURE =================
$('#cap-search').addEventListener('click', doSearch);
$('#cap-q').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
function doSearch() {
  $('#cap-person').replaceChildren();
  var out = $('#cap-results'); out.replaceChildren(el('p', { class: 'muted', text: 'Searching…' }));
  api('searchPersons', S.token, $('#cap-q').value).then(function (rows) {
    if (!rows.length) { out.replaceChildren(el('div', { class: 'info', text: 'No match. Check spelling, try the phone number or UMID, then register her if she is new.' })); return; }
    var tb = el('tbody');
    rows.forEach(function (p) {
      tb.append(el('tr', { class: 'click', onclick: function () { openPerson(p.tei_id); } }, [
        el('td', { text: p.umid }), el('td', { text: (p.MCC_FIRST_NAME || '') + ' ' + (p.MCC_SURNAME || '') }), el('td', { text: p.MCC_DOB }),
        el('td', { text: p.MCC_FIRST_ANC_DATE }), el('td', { text: p.MCC_VILLAGE }), el('td', { text: p.MCC_PHONE }), el('td', { text: p.MCC_CUR_EDD }), el('td', { text: ouName(p.org_unit) })]));
    });
    out.replaceChildren(el('div', { class: 'tw' }, [el('table', { class: 't' }, [el('thead', null, [el('tr', null, ['Unique ID', 'Name', 'DOB', 'First ANC', 'Village', 'Phone', 'Current EDD', 'Facility'].map(function (h) { return el('th', { text: h }); }))]), tb])]));
  }).catch(function (e) { out.replaceChildren(el('div', { class: 'msg', text: e.message })); });
}
$('#cap-new').addEventListener('click', function () { openForm({ kind: 'reg', org_unit: $('#cap-ou').value }); });

function openPerson(teiId, keepEnrollment) {
  show('capture'); capTab('clients'); $('#cap-results').replaceChildren();
  var box = $('#cap-person'); box.replaceChildren(el('p', { class: 'muted', text: 'Loading…' }));
  return api('getPerson', S.token, teiId).then(function (d) {
    S.person = d;
    var active = d.enrollments.filter(function (e) { return e.status === 'ACTIVE'; })[0];
    S.enrollment = (keepEnrollment && d.enrollments.filter(function (e) { return e.enrollment_id === keepEnrollment; })[0]) || active || d.enrollments[d.enrollments.length - 1] || null;
    renderPerson();
  }).catch(function (e) { box.replaceChildren(el('div', { class: 'msg', text: e.message })); });
}
function ouName(c) { var o = (S.allOus || []).filter(function (x) { return x.code === c; })[0]; return o ? o.name : c; }
function stageName(c) { return (META.stages.filter(function (s) { return s.code === c; })[0] || {}).name || c; }
function hivPos(extra) {
  return S.person.events.some(function (e) { return e.MCC_HIV_RESULT === 'POS' || e.MCC_HIV_RESULT === 'KNOWN_POS'; }) || (extra && (extra.MCC_HIV_RESULT === 'POS' || extra.MCC_HIV_RESULT === 'KNOWN_POS'));
}
function renderPerson() {
  var d = S.person, p = d.person, box = $('#cap-person');
  var head = el('div', { class: 'card' }, [
    el('div', { class: 'bar' }, [el('h2', { class: 'grow', text: (p.MCC_FIRST_NAME || '') + ' ' + (p.MCC_SURNAME || '') }),
      can('entry') ? el('button', { class: 'btn ghost', text: 'Edit details', onclick: function () { openForm({ kind: 'reg', tei_id: p.tei_id, values: p, org_unit: p.org_unit }); } }) : null]),
    el('div', { class: 'person-head' }, [['UMID', p.umid], ['Date of birth', p.MCC_DOB + (has(p.MCC_DOB) ? ' (' + yearsBetween(p.MCC_DOB, today()) + ' y)' : '')], ['Village / zone', [p.MCC_VILLAGE, p.MCC_ZONE].filter(has).join(' / ')],
      ['Phone', p.MCC_PHONE], ['First ANC', p.MCC_FIRST_ANC_DATE], ['Age at first ANC', has(p.MCC_DOB) && has(p.MCC_FIRST_ANC_DATE) ? yearsBetween(p.MCC_DOB, p.MCC_FIRST_ANC_DATE) + ' y' : ''], ['ANC reg. no.', p.MCC_ANC_REG_NO], ['CBV', p.MCC_CBV], ['Facility', ouName(p.org_unit)]]
      .map(function (x) { return el('div', null, [el('span', { text: x[0] }), x[1] || '—']); }))]);
  var enrCard = el('div', { class: 'card' });
  var sel = el('select', { 'aria-label': 'Pregnancy' });
  d.enrollments.forEach(function (e, i) { sel.append(el('option', { value: e.enrollment_id, text: 'Pregnancy ' + (i + 1) + ' · booked ' + e.enrollment_date + ' · LMP ' + e.lmp + ' · ' + e.status })); });
  if (S.enrollment) sel.value = S.enrollment.enrollment_id;
  sel.addEventListener('change', function () { S.enrollment = d.enrollments.filter(function (e) { return e.enrollment_id === sel.value; })[0]; renderPerson(); });
  var hasActive = d.enrollments.some(function (e) { return e.status === 'ACTIVE'; });
  enrCard.append(el('div', { class: 'bar' }, [el('h3', { class: 'grow', text: 'Pregnancies' }), d.enrollments.length ? sel : el('span', { class: 'muted', text: 'Not enrolled yet' })]));
  if (!hasActive && can('entry')) {
    var ed = el('input', { type: 'date', value: !d.enrollments.length && has(p.MCC_FIRST_ANC_DATE) ? String(p.MCC_FIRST_ANC_DATE).slice(0, 10) : today(), max: today() }), lmp = el('input', { type: 'date', max: today() });
    var msg = el('span', { class: 'msg' });
    enrCard.append(el('div', { class: 'grid4' }, [el('label', null, ['Booking (ANC1) date', ed]), el('label', null, ['Date of LMP (or ultrasound-derived LMP)', lmp]),
      el('div', { style: 'display:flex;align-items:flex-end' }, [el('button', { class: 'btn primary', text: 'Enroll new pregnancy', onclick: function (ev) {
        busy(ev.target, true);
        api('enroll', S.token, p.tei_id, { enrollment_date: ed.value, lmp: lmp.value, org_unit: $('#cap-ou').value || p.org_unit })
          .then(function (e) { toast('Pregnancy enrolled. EDD ' + addDays(e.lmp, 280)); return openPerson(p.tei_id, e.enrollment_id); })
          .catch(function (e) { msg.textContent = e.message; }).then(function () { busy(ev.target, false); });
      } })])]), msg);
  }
  box.replaceChildren(head, enrCard);
  if (S.newUmid === p.umid) { box.prepend(el('div', { class: 'info big', text: 'Registered. Unique ID: ' + p.umid + ' — write it on her ANC card. Next: enroll the pregnancy below, then open ANC 1.' })); S.newUmid = null; }
  if (!S.enrollment) { box.append(uploadsCard(d.uploads)); return; }
  var en = S.enrollment, evs = d.events.filter(function (e) { return e.enrollment_id === en.enrollment_id; })
    .sort(function (a, b) { return String(a.event_date).localeCompare(String(b.event_date)); });
  var anc1 = evs.filter(function (e) { return e.stage === 'ANC1'; })[0];
  var hasStage = function (c) { return evs.some(function (e) { return e.stage === c; }); };
  var latestRisk = evs.filter(function (e) { return e.stage === 'ANC1' || e.stage === 'ANCFU'; }).reverse().filter(function (e) { return String(e.MCC_HIGH_RISK) === 'true'; })[0];
  var card = el('div', { class: 'card' });
  if (latestRisk) card.append(el('div', { class: 'risk', text: 'HIGH-RISK PREGNANCY: ' + latestRisk.MCC_RISK_REASONS }));
  var edd = (anc1 && anc1.MCC_EDD) || addDays(en.lmp, 280);
  var ga = Math.floor((280 - daysBetween(today(), edd)) / 7);
  card.append(el('div', { class: 'person-head' }, [['LMP', en.lmp], ['EDD', edd], ['GA today', en.status === 'ACTIVE' && !hasStage('DEL') && !hasStage('LOSS') ? ga + ' weeks' : '—'], ['Status', en.status]]
    .map(function (x) { return el('div', null, [el('span', { text: x[0] }), x[1]]); })));
  if (en.status === 'ACTIVE' && can('entry')) {
    var btns = el('div', { class: 'stages' });
    var add = function (code, ok) { if (ok) btns.append(el('button', { class: 'btn', text: '+ ' + stageName(code), onclick: function () { openForm({ kind: 'event', stage: code }); } })); };
    add('ANC1', !anc1); add('ANCFU', !!anc1 && !hasStage('DEL') && !hasStage('LOSS')); add('DEL', !hasStage('DEL') && !hasStage('LOSS'));
    add('PNC', hasStage('DEL')); add('LOSS', !hasStage('DEL') && !hasStage('LOSS')); add('REF', true); add('EXIT', !hasStage('EXIT'));
    card.append(btns);
  }
  var tb = el('tbody');
  evs.forEach(function (e) {
    var key = e.stage === 'DEL' ? (e.MCC_DEL_MODE || '') + ' ' + (e.MCC_B1_OUTCOME || '') : e.stage === 'PNC' ? (e.MCC_PNC_WINDOW || '') : e.stage === 'EXIT' ? e.MCC_EXIT_OUTCOME : has(e.MCC_GA_WK) ? 'GA ' + e.MCC_GA_WK + ' wk' : '';
    tb.append(el('tr', { class: 'click', onclick: function () { openForm({ kind: 'event', stage: e.stage, event: e }); } }, [
      el('td', { text: e.event_date }), el('td', { text: stageName(e.stage) }), el('td', null, [el('span', { class: 'pill ' + (e.status === 'COMPLETED' ? 'ok' : ''), text: e.status })]),
      el('td', { text: key }), el('td', { text: String(e.MCC_HIGH_RISK) === 'true' ? 'High risk' : '' }), el('td', { text: /upload|ingest/.test(e.created_by || '') ? 'Upload / KoBo' : 'Form' }), el('td', { text: e.updated_by })]));
  });
  card.append(evs.length ? el('div', { class: 'tw' }, [el('table', { class: 't' }, [el('thead', null, [el('tr', null, ['Date', 'Stage', 'Status', 'Summary', 'Risk', 'Source', 'Last edited by'].map(function (h) { return el('th', { text: h }); }))]), tb])])
    : el('p', { class: 'muted', text: 'No events yet. Start with ANC 1.' }));
  box.append(card);
  box.append(uploadsCard(d.uploads));
}

// ================= FORMS =================
function optionsOf(f) { return META.optionSets[META.fields[f].os] || []; }
function inputFor(code, value, onChange) {
  var m = META.fields[code], vt = m.vt, auto = m.mand === 'Auto', node;
  var fire = function () { onChange(code, read()); };
  var read;
  if (vt === 'MULTI_TEXT') {
    var set = String(value || '').split(',').filter(Boolean);
    node = el('div', { class: 'checks' }, optionsOf(code).map(function (o) {
      return el('label', null, [el('input', { type: 'checkbox', value: o[0], checked: set.indexOf(o[0]) >= 0, disabled: auto, onchange: fire }), o[1]]);
    }));
    read = function () { return $$('input:checked', node).map(function (i) { return i.value; }).join(','); };
  } else if (m.os && optionsOf(code).length <= 4 && !auto) {
    var nm = 'r_' + code + '_' + Math.random().toString(36).slice(2, 7);
    node = el('div', { class: 'radios' }, optionsOf(code).map(function (o) {
      return el('label', null, [el('input', { type: 'radio', name: nm, value: o[0], checked: String(value) === o[0], onchange: fire }), o[1]]);
    }).concat([el('button', { type: 'button', class: 'btn sm ghost', text: 'clear', onclick: function () { $$('input', node).forEach(function (i) { i.checked = false; }); fire(); } })]));
    read = function () { var c = $('input:checked', node); return c ? c.value : ''; };
  } else if (m.os) {
    node = el('select', { disabled: auto, onchange: fire }, [el('option', { value: '', text: '' })].concat(optionsOf(code).map(function (o) { return el('option', { value: o[0], text: o[1] }); })));
    node.value = has(value) ? String(value) : ''; read = function () { return node.value; };
  } else if (vt === 'BOOLEAN') {
    var nb = 'b_' + code + '_' + Math.random().toString(36).slice(2, 7);
    node = el('div', { class: 'radios' }, [['true', 'Yes'], ['false', 'No']].map(function (o) {
      return el('label', null, [el('input', { type: 'radio', name: nb, value: o[0], checked: String(value) === o[0], disabled: auto, onchange: fire }), o[1]]);
    }));
    read = function () { var c = $('input:checked', node); return c ? c.value : ''; };
  } else if (vt === 'TRUE_ONLY') {
    var cb = el('input', { type: 'checkbox', checked: String(value) === 'true', disabled: auto, onchange: fire });
    node = el('div', { class: 'checks' }, [el('label', null, [cb, 'Yes'])]);
    read = function () { return cb.checked ? 'true' : ''; };
  } else if (vt === 'ORGANISATION_UNIT') {
    node = el('select', { onchange: fire }); fillOuSelect(node, S.allOus, true); node.value = value || ''; read = function () { return node.value; };
  } else if (vt === 'AGE') {
    // Date of birth and age stay in step: typing either fills the other. Age is counted at the first ANC visit (today if not entered yet).
    var refDate = function () { return (S.form && S.form.values.MCC_FIRST_ANC_DATE) || today(); };
    var dob = el('input', { type: 'date', value: value || '', max: today(), 'aria-label': 'Date of birth' });
    var yrs = el('input', { type: 'number', min: 10, max: 60, placeholder: 'Age', 'aria-label': 'Age in years', style: 'max-width:6.5rem' });
    var syncAge = function () { yrs.value = has(dob.value) ? yearsBetween(dob.value, refDate()) : ''; };
    dob.addEventListener('input', function () { syncAge(); if (S.form) S.form.values.MCC_DOB_ESTIMATED = 'false'; fire(); });
    yrs.addEventListener('input', function () {
      if (!has(yrs.value)) return;
      var r = new Date(refDate() + 'T00:00:00'); r.setFullYear(r.getFullYear() - Number(yrs.value));
      dob.value = iso(r); if (S.form) S.form.values.MCC_DOB_ESTIMATED = 'true'; fire();
    });
    syncAge();
    node = el('div', { class: 'bar', style: 'margin:0' }, [dob, el('span', { class: 'small muted', text: 'or age' }), yrs, el('span', { class: 'small muted', text: 'years' })]);
    node.syncAge = syncAge;
    read = function () { return dob.value; };
  } else {
    var type = { DATE: 'date', DATETIME: 'datetime-local', NUMBER: 'number', INTEGER: 'number', INTEGER_POSITIVE: 'number', INTEGER_ZERO_OR_POSITIVE: 'number', PHONE_NUMBER: 'tel' }[vt] || 'text';
    if (vt === 'LONG_TEXT') node = el('textarea', { rows: 2, readonly: auto, oninput: fire });
    else node = el('input', { type: type, readonly: auto, step: vt === 'NUMBER' ? 'any' : null, min: /POSITIVE/.test(vt) ? (vt === 'INTEGER_POSITIVE' ? 1 : 0) : null, oninput: fire });
    node.value = has(value) ? (vt === 'DATETIME' ? String(value).replace(' ', 'T').slice(0, 16) : String(value)) : ''; read = function () { return node.value; };
  }
